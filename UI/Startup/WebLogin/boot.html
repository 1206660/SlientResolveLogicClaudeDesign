<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 启动</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage {
  background: #050405;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  /* The boot stage shouldn't crossfade in itself — its children animate independently. */
  animation: none;
}

.brand {
  text-align: center;
  position: relative;
}
.brand-mark {
  font-family: var(--font-kai);
  font-size: clamp(96px, 11vw, 200px);
  font-weight: 900;
  letter-spacing: 0.4em;
  padding-left: 0.4em;
  color: var(--paper);
  text-shadow: 0 0 36px rgba(237,223,194,0.4);
  opacity: 0;
  transform: scale(0.96);
  animation: brand-reveal 700ms ease-out 280ms both;
}
.brand-sub {
  font-family: var(--font-kai);
  font-size: clamp(20px, 1.6vw, 30px);
  font-weight: 700;
  letter-spacing: 0.55em;
  padding-left: 0.55em;
  color: var(--paper-2);
  margin-top: 22px;
  opacity: 0;
  animation: brand-reveal 600ms ease-out 720ms both;
}
.brand-divider {
  width: 220px; height: 1px;
  margin: 24px auto 0;
  background: linear-gradient(90deg, transparent, var(--zhusha), transparent);
  box-shadow: 0 0 8px var(--zhusha-glow);
  transform: scaleX(0);
  transform-origin: center;
  animation: divider-grow 600ms cubic-bezier(0.25, 0.85, 0.4, 1) 1000ms both;
}
.brand-tagline {
  font-family: var(--font-kai);
  font-size: 14px; letter-spacing: 0.4em;
  color: var(--paper-dim);
  margin-top: 18px;
  opacity: 0;
  animation: brand-reveal 500ms ease-out 1300ms both;
}

.boot-stamp {
  position: absolute; bottom: 8vh; left: 0; right: 0;
  display: flex; justify-content: center; gap: 18px;
  opacity: 0;
  animation: brand-reveal 500ms ease-out 1500ms both;
}
.boot-stamp .pip {
  width: 8px; height: 8px;
  background: var(--zhusha);
  transform: rotate(45deg);
  box-shadow: 0 0 8px var(--zhusha-glow);
}
.boot-stamp .text {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.35em; color: var(--paper-mute);
}

.boot-skip {
  position: absolute; bottom: 4vh; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.32em; color: var(--paper-mute);
  opacity: 0;
  animation: brand-reveal 500ms ease-out 1800ms both;
}

@keyframes brand-reveal {
  0%   { opacity: 0; transform: scale(0.96); }
  100% { opacity: 1; transform: scale(1.0); }
}
@keyframes divider-grow {
  0%   { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}

.boot-grain {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.06;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.7  0 0 0 0.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Final fade-out before navigating to login. C++ also paints sr-navigating black scrim, but
 * we play this 240ms slow fade first so the title doesn't pop out. */
.stage.boot-leaving {
  animation: boot-out 280ms ease-in forwards;
}
@keyframes boot-out {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
ue.interface.setBootData = function(data) {
  window.SRBootTemplate = data && data.template ? data.template : "Default";
};

window.SRBoot = {
  state: { transitioning: false, autoTimer: null, totalDelay: 2400 },
  navigateToLogin() {
    if (this.state.transitioning) return;
    this.state.transitioning = true;
    if (this.state.autoTimer) { clearTimeout(this.state.autoTimer); this.state.autoTimer = null; }
    document.querySelector(".stage").classList.add("boot-leaving");
    setTimeout(() => SRBridge.send("nav", { to: "login" }), 240);
  },
  back() { SRBridge.back("startup-web-boot"); }
};

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Enter" || e.key === " " || e.key === "Backspace") {
    e.preventDefault();
    SRBoot.navigateToLogin();
  }
});

// Warm CEF cache for every WebUI page during the 2.4s splash idle. After this, the first
// navigation to any page should hit cache instead of fetching from disk again.
const SR_PREFETCH_PAGES = [
  "login", "settings", "skills", "inventory", "journal", "dialogue",
  "load", "combat", "cinematic", "pause", "map", "codex", "profile", "lobby"
];
function srPrefetchAll() {
  SR_PREFETCH_PAGES.forEach(p => {
    const link = document.createElement("link");
    link.rel = "prefetch";
    link.as = "document";
    link.href = p + ".html";
    document.head.appendChild(link);
  });
  // Also prefetch shared assets (font is heaviest).
  ["assets/common.css", "assets/ue-bridge.js", "ZhongQiMaShanZhengBrushKai.ttf"].forEach(href => {
    const link = document.createElement("link");
    link.rel = "prefetch";
    link.href = href;
    document.head.appendChild(link);
  });
  console.log("[SRBoot] prefetched", SR_PREFETCH_PAGES.length, "pages + 3 shared assets");
}

window.addEventListener("DOMContentLoaded", () => {
  SRBridge.ready("startup-web-boot");
  // Kick off prefetch early so it overlaps the splash animation.
  if (typeof requestIdleCallback === "function") {
    requestIdleCallback(srPrefetchAll, { timeout: 600 });
  } else {
    setTimeout(srPrefetchAll, 200);
  }
  // Auto-nav after the brand reveal completes (~2.4s total).
  SRBoot.state.autoTimer = setTimeout(() => SRBoot.navigateToLogin(), SRBoot.state.totalDelay);
});
</script>
</head>
<body>
<main class="stage">
  <div class="boot-grain"></div>

  <section class="brand">
    <div class="brand-mark">一介</div>
    <div class="brand-sub">寒土孤山</div>
    <div class="brand-divider"></div>
    <div class="brand-tagline">凡人的宁静 · 时代的碾碎</div>
  </section>

  <div class="boot-stamp">
    <div class="pip"></div>
    <div class="text">内测版 〇·壹·〇 · 二〇二六</div>
    <div class="pip"></div>
  </div>

  <div class="boot-skip">按任意键 · 跳过</div>
</main>
</body>
</html>
