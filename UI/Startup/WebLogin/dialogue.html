<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 念白 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* SR Dialogue · transparent HUD overlay (Default theme).
 *
 * Reference: combat.html for the transparency pattern; .agents/skills/shadcn/SKILL.md
 * for the token names + archetype layout matrix. We only render UI furniture above
 * the 3D viewport — no full-screen backgrounds. Layout switches by data-archetype
 * (and data-node-type for choice_response). */

:root {
  --do-overlay-bg:        rgba(20, 17, 13, 0.72);
  --do-overlay-bg-faint:  rgba(20, 17, 13, 0.42);
  --do-fg:                #EDDFC2;
  --do-fg-dim:            rgba(237, 223, 194, 0.78);
  --do-fg-mute:           rgba(168, 153, 125, 0.82);
  --do-border:            rgba(237, 223, 194, 0.18);
  --do-border-strong:     rgba(237, 223, 194, 0.32);
  --do-primary:           #D85528;
  --do-primary-soft:      rgba(216, 85, 40, 0.16);
  --do-primary-glow:      rgba(216, 85, 40, 0.40);
  --do-letterbox:         rgba(0, 0, 0, 0.85);
  --do-radius:            4px;
  --do-pad-comfy:         20px;
  --do-pad-tight:         14px;
}

/* Combat-style transparency: 3D viewport stays visible behind everything. */
html, body { background: transparent !important; }
.stage     { background: transparent; }

.dialogue-overlay {
  position: fixed; inset: 0;
  pointer-events: none;            /* gameplay input passes through unless on a panel */
  font-family: var(--font-kai), 'STKaiti', KaiTi, '楷体', serif;
  color: var(--do-fg);
}
.dialogue-overlay .panel,
.dialogue-overlay .choices,
.dialogue-overlay .subtitle,
.dialogue-overlay .speaker-badge { pointer-events: auto; }

/* ------------- letterbox bars ------------- */
.letterbox {
  position: absolute; left: 0; right: 0;
  height: 0;                         /* hidden by default; narration_cutscene shows */
  background: var(--do-letterbox);
  pointer-events: none;
  transition: height 0.28s ease;
  z-index: 1;
}
.letterbox-top    { top: 0; }
.letterbox-bottom { bottom: 0; }
[data-archetype="narration_cutscene"] .letterbox-top,
[data-archetype="narration_cutscene"] .letterbox-bottom { height: 8vh; }

/* ------------- speaker badge ------------- */
.speaker-badge {
  position: absolute;
  bottom: calc(13vh + 12px);
  left: 50%; transform: translateX(-50%);
  display: flex; align-items: baseline; gap: 14px;
  padding: 5px 18px;
  background: var(--do-overlay-bg-faint);
  border-left: 2px solid var(--do-primary);
  border-radius: var(--do-radius);
  z-index: 6;
}
.speaker-badge .speaker-name {
  font-size: 17px; letter-spacing: 0.28em;
  color: var(--do-fg);
}
.speaker-badge .speaker-mood {
  font-family: var(--font-mono), 'JetBrains Mono', Consolas, monospace;
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--do-primary);
}
.speaker-badge[data-empty="true"] { display: none; }

[data-archetype="ambient_walkby"]   .speaker-badge,
[data-archetype="combat_bark"]      .speaker-badge,
[data-archetype="social_schedule"]  .speaker-badge { bottom: calc(8vh + 14px); }

[data-archetype="choice_response"][data-node-type="choice"] .speaker-badge {
  bottom: auto;
  top: 18vh;
}

/* ------------- subtitle band ------------- */
.subtitle {
  position: absolute;
  bottom: 12vh;
  left: 50%; transform: translateX(-50%);
  width: min(900px, 70vw);
  padding: var(--do-pad-comfy);
  background: var(--do-overlay-bg);
  border: 1px solid var(--do-border);
  border-top-color: var(--do-border-strong);
  border-radius: var(--do-radius);
  z-index: 5;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.subtitle .dialogue-line {
  margin: 0;
  font-size: 21px; line-height: 1.7;
  letter-spacing: 0.08em;
  color: var(--do-fg);
  min-height: 2em;
}
.subtitle .dialogue-line .cursor {
  display: inline-block;
  width: 6px; height: 1em;
  margin-left: 4px;
  background: var(--do-primary);
  vertical-align: text-bottom;
  opacity: 0.85;
  animation: do-cursor 0.7s steps(2) infinite;
}
@keyframes do-cursor { 0%, 50% { opacity: 0.85 } 50.01%, 100% { opacity: 0 } }

[data-archetype="narration_cutscene"] .subtitle {
  bottom: 14vh;
  width: min(820px, 56vw);
  background: rgba(14, 11, 8, 0.82);
}

/* Non-blocking floating subtitle — no full bg, narrow, left-anchored. */
[data-archetype="ambient_walkby"]   .subtitle,
[data-archetype="combat_bark"]      .subtitle,
[data-archetype="social_schedule"]  .subtitle {
  bottom: 7vh;
  padding: 10px 18px;
  background: var(--do-overlay-bg-faint);
  border: 0;
  border-left: 2px solid var(--do-primary);
  border-radius: 0 var(--do-radius) var(--do-radius) 0;
  width: auto;
  max-width: min(560px, 60vw);
  left: 6vw; transform: none;
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
}
[data-archetype="ambient_walkby"]   .subtitle .dialogue-line,
[data-archetype="combat_bark"]      .subtitle .dialogue-line,
[data-archetype="social_schedule"]  .subtitle .dialogue-line {
  font-size: 17px;
  letter-spacing: 0.06em;
  line-height: 1.55;
}
[data-archetype="combat_bark"] .subtitle { left: auto; right: 6vw; border-left: 0; border-right: 2px solid var(--do-primary); border-radius: var(--do-radius) 0 0 var(--do-radius); }

/* Hide subtitle when on a choice node (the choices list takes over). */
[data-node-type="choice"] .subtitle { display: none; }

/* ------------- choice list ------------- */
.choices {
  position: absolute;
  bottom: 10vh;
  left: 50%; transform: translateX(-50%);
  width: min(620px, 56vw);
  display: none;
  flex-direction: column; gap: 10px;
  list-style: none; margin: 0; padding: 0;
  z-index: 7;
}
[data-node-type="choice"] .choices { display: flex; }

.choice {
  position: relative;
  padding: var(--do-pad-tight) calc(var(--do-pad-comfy) + 6px);
  background: var(--do-overlay-bg);
  border: 1px solid var(--do-border);
  border-radius: var(--do-radius);
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.18em;
  color: var(--do-fg-dim);
  cursor: pointer;
  transition: color 120ms ease, border-color 120ms ease, background 120ms ease, transform 120ms ease;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.choice:hover {
  color: var(--do-fg);
  border-color: var(--do-fg-mute);
}
.choice.active {
  color: var(--do-fg);
  border-color: var(--do-primary);
  background: linear-gradient(90deg, var(--do-primary-soft), var(--do-overlay-bg) 80%);
  box-shadow: 0 0 16px var(--do-primary-glow);
  transform: translateX(4px);
}
.choice.active::before {
  content: "";
  position: absolute;
  left: -1px; top: -1px; bottom: -1px;
  width: 3px;
  background: var(--do-primary);
  border-radius: var(--do-radius) 0 0 var(--do-radius);
}
.choice.disabled {
  opacity: 0.42;
  cursor: not-allowed;
  pointer-events: none;
}

/* ------------- bottom-right hint strip ------------- */
.prompt-hints {
  position: absolute;
  right: 2vw; bottom: 2vh;
  display: flex; gap: 16px;
  font-family: var(--font-mono), 'JetBrains Mono', Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--do-fg-mute);
  pointer-events: none;
  z-index: 8;
}
.prompt-hints kbd {
  display: inline-block;
  padding: 1px 6px;
  margin-right: 5px;
  border: 1px solid var(--do-border-strong);
  border-radius: 2px;
  font-family: inherit;
  color: var(--do-fg-dim);
  background: rgba(0, 0, 0, 0.35);
}
[data-archetype="combat_bark"] .prompt-hints { display: none; }

/* ------------- responsive ------------- */
@media (max-height: 600px) {
  .subtitle { bottom: 5vh; padding: 12px 16px; }
  .subtitle .dialogue-line { font-size: 18px; }
  .speaker-badge { bottom: calc(5vh + 18px); }
  .choices { bottom: 4vh; width: min(540px, 60vw); }
  .choice { padding: 10px 16px; font-size: 16px; }
  [data-archetype="narration_cutscene"] .letterbox-top,
  [data-archetype="narration_cutscene"] .letterbox-bottom { height: 5vh; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
/* SRDialogue · payload-driven renderer (Default theme — transparent HUD).
 *
 *   ue.interface.setDialogueData(payload) is the only data path. payload schema lives
 *   in Content/CoreLogic/UI/Startup/WebUI.contract.json under "dialogue.payload".
 *
 *   The body's data-archetype + data-node-type drives layout in CSS; the JS just
 *   populates strings and choice items. DEV fallback covers standalone preview.
 */
window.SRDialogue = {
  state: {
    payload: null,
    activeChoice: 0,
    receivedRealPayload: false
  },

  _devFallback: {
    dialogueId: "dev_preview",
    title: "念白 · DEV 预览",
    archetype: "choice_response",
    progression: "TextBased",
    nodeType: "choice",
    nodeId: "n_dev_choice",
    nodeIndex: 2,
    nodeCount: 3,
    speakerId: "elder",
    speaker: "先生",
    portrait: "",
    text: "孩子忘事是福气。你呢？",
    choices: [
      { id: "answer_remember", text: "我都记得",   enabled: true },
      { id: "answer_forget",   text: "我也想忘",   enabled: true },
      { id: "answer_silent",   text: "〔不语〕",   enabled: true }
    ]
  },

  current() { return this.state.payload || this._devFallback; },
  hasChoices() {
    const p = this.current();
    return p.nodeType === "choice" && Array.isArray(p.choices) && p.choices.length > 0;
  },
  isFinished() { return this.current().nodeType === "end"; },

  /* ---- inbound from UE ---- */
  ingest(payload) {
    this.state.payload = payload;
    this.state.receivedRealPayload = true;
    this.state.activeChoice = 0;
    this.render();
  },

  /* ---- outbound to UE ---- */
  emitAdvance() {
    if (this._typing) { this.finishTypewriter(); return; }
    if (this.hasChoices()) return;
    if (this.isFinished()) { SRBridge.send("dialogue.abort", {}); return; }
    SRBridge.send("dialogue.advance", { nodeId: this.current().nodeId });
  },
  emitChoice(idx) {
    const p = this.current();
    if (!this.hasChoices()) return;
    if (idx < 0 || idx >= p.choices.length) return;
    const choice = p.choices[idx];
    if (choice.enabled === false) return;
    SRBridge.send("dialogue.choice", { choiceId: choice.id, choiceIndex: idx, nodeId: p.nodeId });
  },
  emitSkip()    { SRBridge.send("dialogue.skip",    { nodeId: this.current().nodeId }); },
  emitBacklog() { SRBridge.send("dialogue.backlog", { open: true }); },
  emitAbort()   { SRBridge.send("dialogue.abort",   {}); },

  selectChoice(idx) {
    const p = this.current();
    if (!this.hasChoices()) return;
    if (idx < 0 || idx >= p.choices.length) return;
    this.state.activeChoice = idx;
    this.renderChoices();
  },
  commitChoice() {
    if (!this.hasChoices()) return;
    this.emitChoice(this.state.activeChoice);
  },

  /* ---- render ---- */
  render() {
    const p = this.current();
    const speaker     = p.speaker     || "";
    const speakerId   = p.speakerId   || "";
    const archetype   = p.archetype   || "";
    const nodeType    = p.nodeType    || "say";
    const moodLabel   = SRDialogue._archetypeMood(archetype);

    document.body.dataset.archetype = archetype;
    document.body.dataset.nodeType  = nodeType;

    const badge = document.querySelector(".speaker-badge");
    document.querySelector(".speaker-badge .speaker-name").textContent = speaker;
    document.querySelector(".speaker-badge .speaker-mood").textContent = moodLabel;
    const isNarrator = speakerId === "" || speakerId === "narrator";
    badge.dataset.empty = isNarrator ? "true" : "false";

    if (this.hasChoices()) {
      this.state.activeChoice = Math.max(0, Math.min(this.state.activeChoice, p.choices.length - 1));
      this.renderChoices();
    } else {
      this.startTypewriter(p.text || "");
    }
  },

  startTypewriter(rawText) {
    const lineEl = document.querySelector(".dialogue-line");
    if (this._typewriterTimer) { clearInterval(this._typewriterTimer); this._typewriterTimer = null; }
    lineEl.innerHTML = `<span class="typed"></span><span class="cursor"></span>`;
    const typed = lineEl.querySelector(".typed");
    let i = 0;
    this._typing = true;
    this._typewriterTimer = setInterval(() => {
      i++;
      typed.textContent = rawText.slice(0, i);
      if (i >= rawText.length) {
        clearInterval(this._typewriterTimer);
        this._typewriterTimer = null;
        const cur = lineEl.querySelector(".cursor");
        if (cur) cur.remove();
        this._typing = false;
      }
    }, 40);
  },
  finishTypewriter() {
    if (!this._typing) return;
    if (this._typewriterTimer) { clearInterval(this._typewriterTimer); this._typewriterTimer = null; }
    const lineEl = document.querySelector(".dialogue-line");
    lineEl.innerHTML = this.current().text || "";
    this._typing = false;
  },
  renderChoices() {
    const wrap = document.querySelector(".choices");
    wrap.innerHTML = "";
    const p = this.current();
    if (!this.hasChoices()) return;
    p.choices.forEach((c, idx) => {
      const li = document.createElement("li");
      li.className = "choice" + (idx === this.state.activeChoice ? " active" : "");
      if (c.enabled === false) li.classList.add("disabled");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(idx === this.state.activeChoice));
      li.textContent = String(c.text || "");
      li.addEventListener("mouseenter", () => this.selectChoice(idx));
      li.addEventListener("click", () => { this.selectChoice(idx); this.commitChoice(); });
      wrap.appendChild(li);
    });
  },

  _archetypeMood(arch) {
    switch (arch) {
      case "ambient_walkby":     return "闲谈";
      case "narration_cutscene": return "旁白";
      case "choice_response":    return "对话";
      case "combat_bark":        return "战意";
      case "social_schedule":    return "日常";
      default:                   return "";
    }
  }
};

ue.interface.setDialogueData = function(payload) { window.SRDialogue.ingest(payload || {}); };

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); SRDialogue.emitAbort(); return; }
  if (e.key === "Backspace") { e.preventDefault(); SRDialogue.emitBacklog(); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (SRDialogue.hasChoices()) SRDialogue.commitChoice(); else SRDialogue.emitAdvance();
    return;
  }
  if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") {
    if (SRDialogue.hasChoices()) { e.preventDefault(); SRDialogue.selectChoice(SRDialogue.state.activeChoice - 1); }
    return;
  }
  if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
    if (SRDialogue.hasChoices()) { e.preventDefault(); SRDialogue.selectChoice(SRDialogue.state.activeChoice + 1); }
    return;
  }
  if (e.key === "Tab") { e.preventDefault(); SRDialogue.emitSkip(); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRDialogue.render();
  SRBridge.ready("startup-web-dialogue");
  setTimeout(() => {
    if (!SRDialogue.state.receivedRealPayload) {
      console.info("[SRDialogue] no setDialogueData received — running DEV preview");
    }
  }, 600);
});
</script>
</head>
<body data-archetype="" data-node-type="">
<main class="dialogue-overlay">
  <div class="letterbox letterbox-top"></div>
  <div class="letterbox letterbox-bottom"></div>

  <div class="speaker-badge" data-empty="true">
    <span class="speaker-name"></span>
    <span class="speaker-mood"></span>
  </div>

  <div class="subtitle">
    <p class="dialogue-line"></p>
  </div>

  <ul class="choices" role="listbox" aria-label="对话选项"></ul>

  <div class="prompt-hints">
    <span class="hint"><kbd>↵</kbd>推进</span>
    <span class="hint"><kbd>↑↓</kbd>选择</span>
    <span class="hint"><kbd>Esc</kbd>退出</span>
  </div>
</main>
</body>
</html>
