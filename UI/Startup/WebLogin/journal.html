<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 行錄 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage { background: linear-gradient(180deg, #0C0907 0%, #14110C 100%); }

.header { position:absolute; top:0; left:0; right:0; height:110px;
  display:flex; align-items:center; padding: 0 5vw; border-bottom: 1px solid var(--line); }
.bc-kanji { font-size: clamp(40px,4.2vw,60px); font-weight:900; letter-spacing:0.2em; }
.bc-path  { margin-left:auto; display:flex; gap:14px;
  font-family: var(--font-mono); font-size: 13px; color: var(--paper-dim); letter-spacing: 0.25em; }
.bc-path .sep { opacity:0.4; } .bc-path .cur { color: var(--zhusha-bright); }

.seal.corner-seal-2 { position:absolute; top:38px; right:5vw; width:56px; height:56px;
  font-size:32px; transform: rotate(-3deg); z-index:5; }

.body { position:absolute; top:110px; left:0; right:0; bottom:72px;
  display:grid; grid-template-columns: 320px 1fr; }

.list {
  border-right: 1px solid var(--line); padding: 30px 0;
  background: rgba(0,0,0,0.28); overflow-y:auto;
}
.entry {
  position:relative; display:flex; flex-direction:column; gap: 6px;
  padding: 18px 30px; cursor:pointer;
  border-bottom: 1px solid var(--line);
  transition: background 0.18s ease;
}
.entry:hover { background: rgba(237,223,194,0.04); }
.entry.active {
  background: linear-gradient(90deg, rgba(184,58,28,0.13) 0%, transparent 100%);
}
.entry.active::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background: var(--zhusha); box-shadow: 0 0 14px var(--zhusha-glow); }
.entry-row { display:flex; align-items:baseline; justify-content: space-between; gap: 12px; }
.entry-name { font-size: 18px; letter-spacing: 0.18em; color: var(--paper-dim); }
.entry.active .entry-name { color: var(--paper); font-weight: 700; }
.entry-state { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; }
.state-active { color: var(--zhusha-bright); }
.state-done   { color: var(--gold); }
.state-todo   { color: var(--paper-mute); }
.entry-where {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--paper-mute); letter-spacing: 0.16em;
}

.scroll {
  padding: 36px 6vw; overflow-y:auto;
  background:
    radial-gradient(ellipse 60% 80% at 30% 20%, rgba(184,58,28,0.04), transparent 70%),
    linear-gradient(180deg, rgba(20,17,13,0.6), rgba(10,9,7,0.8));
}
.scroll-head {
  display:flex; align-items:baseline; gap:24px;
  padding-bottom: 18px; margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.scroll-title { font-size: 32px; letter-spacing: 0.22em; font-weight:700; }
.scroll-act   { font-family: var(--font-mono); font-size: 12px; color: var(--paper-mute); letter-spacing: 0.2em; margin-left: auto; }

.scroll-summary {
  font-family: var(--font-kai); font-size: 16px;
  line-height: 1.9; color: var(--paper-2);
  letter-spacing: 0.06em;
  padding: 18px 0 24px 0;
  border-bottom: 1px solid var(--line);
}

.timeline { padding: 22px 0; }
.timeline h4 {
  font-family: var(--font-kai); font-weight: 500;
  font-size: 14px; letter-spacing: 0.3em; color: var(--paper-2);
  margin: 0 0 14px 0;
}
.step {
  position:relative;
  padding: 6px 0 14px 28px;
  font-family: var(--font-mono); font-size: 13px;
  color: var(--paper-dim); letter-spacing: 0.05em; line-height: 1.7;
  border-left: 1px solid var(--line);
}
.step::before {
  content:""; position:absolute; left: -6px; top: 12px;
  width: 11px; height: 11px;
  background: var(--paper-mute);
  border: 2px solid var(--ink-0);
}
.step.done::before  { background: var(--gold); }
.step.now::before   { background: var(--zhusha); box-shadow: 0 0 8px var(--zhusha-glow); }
.step .stamp {
  display: inline-block; margin-right: 12px;
  color: var(--paper-mute);
  font-size: 11px; letter-spacing: 0.1em;
}
.step.now .text { color: var(--paper); }

.meta {
  margin-top: 28px; padding: 18px 22px;
  background: rgba(0,0,0,0.4);
  border-left: 3px solid var(--zhusha);
}
.meta-title { font-family: var(--font-kai); font-size: 13px; letter-spacing: 0.3em; color: var(--paper-2); margin-bottom: 10px; }
.meta-row {
  font-family: var(--font-mono); font-size: 12px;
  display:flex; justify-content: space-between;
  padding: 4px 0;
  color: var(--paper-dim); letter-spacing: 0.06em;
}
.meta-row .v { color: var(--paper); }

@media (max-height: 720px) {
  .header { height: 84px; } .body { top: 84px; bottom: 60px; }
  .footer-bar { height: 60px; } .seal.corner-seal-2 { top: 22px; width: 44px; height: 44px; font-size: 26px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRJournal = {
  state: {
    activeId: "act3_village",
    entries: [
      { id:"act3_village", name:"第三幕 · 山村回忆",
        state:"进行中", stateClass:"state-active",
        where:"寒土孤山 · 山村",
        title:"山村回忆 · 灵儿戏水",
        act:"第三幕 · 进度 七成",
        summary: "回到山村旧居。雨初停，竹梢上挂着水珠。灵儿在井边戏水，似乎已不记得母亲走的那年。先生说，孩子忘事是福气。",
        steps: [
          { stamp:"〇·〇一", state:"done", text:"在井边遇见灵儿。" },
          { stamp:"〇·〇二", state:"done", text:"陪她说了几句关于母亲的事。" },
          { stamp:"〇·〇三", state:"now",  text:"返回山村南口的旧屋。" },
          { stamp:"〇·〇四", state:"todo", text:"取出母亲留下的青玉玦。" }
        ],
        meta: [{n:"领位人",v:"先生"},{n:"地标",v:"山村南口"},{n:"奖励",v:"母亲的青玉玦"},{n:"时辰",v:"廿二·四一"}] },
      { id:"act2_road", name:"第二幕 · 雪行",
        state:"已完成", stateClass:"state-done", where:"漠北 · 古道",
        title:"雪行 · 见无名丐者",
        act:"第二幕 · 已完成",
        summary: "茫雪压了三日，路上只剩一个无名的丐者。他没说话，只是望了望天，又望了望我。",
        steps: [
          { stamp:"〇·〇一", state:"done", text:"出居延关。" },
          { stamp:"〇·〇二", state:"done", text:"翻越冰原断崖。" },
          { stamp:"〇·〇三", state:"done", text:"入山村，遇先生。" }
        ],
        meta: [{n:"领位人",v:"〔无〕"},{n:"地标",v:"漠北古道"},{n:"奖励",v:"碎银 · 御寒裘"}] },
      { id:"chapter_jian", name:"残卷 · 汉简",
        state:"未开启", stateClass:"state-todo", where:"〔未知〕",
        title:"残卷 · 汉简",
        act:"〔机要 · 待解〕",
        summary: "残竹简上字迹斑驳，「寒土孤山」四字尚清，余字含糊难辨。",
        steps: [
          { stamp:"?", state:"todo", text:"找回三块汉简残片。" }
        ],
        meta: [{n:"领位人",v:"〔机要〕"},{n:"地标",v:"〔未知〕"}] }
    ]
  },
  setEntry(id) {
    if (!this.state.entries.find(e => e.id === id)) return;
    this.state.activeId = id;
    this.render();
    SRBridge.send("journal-select", { entryId: id });
  },
  cycle(delta) {
    const list = this.state.entries;
    const idx = list.findIndex(e => e.id === this.state.activeId);
    this.setEntry(list[(idx + delta + list.length) % list.length].id);
  },
  back() { SRBridge.back("startup-web-journal"); },

  renderList() {
    const wrap = document.querySelector(".list");
    wrap.innerHTML = "";
    this.state.entries.forEach(e => {
      const node = document.createElement("div");
      node.className = "entry" + (e.id === this.state.activeId ? " active" : "");
      node.innerHTML = `
        <div class="entry-row">
          <div class="entry-name">${e.name}</div>
          <div class="entry-state ${e.stateClass}">${e.state}</div>
        </div>
        <div class="entry-where">${e.where}</div>
      `;
      node.addEventListener("click", () => this.setEntry(e.id));
      wrap.appendChild(node);
    });
  },
  renderScroll() {
    const wrap = document.querySelector(".scroll");
    wrap.innerHTML = "";
    const e = this.state.entries.find(x => x.id === this.state.activeId);
    if (!e) return;
    const stepsHtml = e.steps.map(s => `
      <div class="step ${s.state}">
        <span class="stamp">${s.stamp}</span><span class="text">${s.text}</span>
      </div>`).join("");
    const metaHtml = (e.meta || []).map(m => `<div class="meta-row"><span>${m.n}</span><span class="v">${m.v}</span></div>`).join("");

    wrap.innerHTML = `
      <div class="scroll-head">
        <div class="scroll-title">${e.title}</div>
        <div class="scroll-act">${e.act}</div>
      </div>
      <div class="scroll-summary">${e.summary}</div>
      <div class="timeline">
        <h4>线脉</h4>
        ${stepsHtml}
      </div>
      <div class="meta">
        <div class="meta-title">机要</div>
        ${metaHtml}
      </div>
    `;
  },
  renderBreadcrumb() {
    const e = this.state.entries.find(x => x.id === this.state.activeId);
    document.querySelector(".bc-path .cur").textContent = e ? e.name : "";
  },
  render() { this.renderList(); this.renderScroll(); this.renderBreadcrumb(); }
};

ue.interface.setJournalData = function() { window.SRJournal.render(); };

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRJournal.back(); }
  else if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); SRJournal.cycle(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); SRJournal.cycle(1); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRJournal.render();
  SRBridge.ready("startup-web-journal");
});
</script>
</head>
<body>
<main class="stage">
  <div class="header">
    <div class="bc-kanji">行錄</div>
    <div class="bc-path"><span>主页</span><span class="sep">·</span><span>行錄</span><span class="sep">·</span><span class="cur">第三幕</span></div>
  </div>
  <div class="seal corner-seal-2">錄</div>

  <div class="body">
    <div class="list"></div>
    <div class="scroll"></div>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta">行錄 · DEV 预览 · 二〇二六</div>
    <div class="prompts">
      <div class="prompt"><span class="key cross">✕</span>跟随</div>
      <div class="prompt"><span class="key triangle">△</span>详情</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
    </div>
  </footer>
</main>
</body>
</html>
