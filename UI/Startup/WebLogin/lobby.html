<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 前堂 · WebUI 总览</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage {
  background:
    radial-gradient(ellipse 60% 35% at 50% 25%, rgba(184,58,28,0.07) 0%, transparent 70%),
    linear-gradient(180deg, #0F0B07 0%, #14110C 60%, #08070A 100%);
}

.header {
  position: absolute; top: 0; left: 0; right: 0; height: 110px;
  display: flex; align-items: center; padding: 0 5vw;
  border-bottom: 1px solid var(--line);
  z-index: 5;
}
.bc-kanji { font-size: clamp(40px, 4.2vw, 60px); font-weight: 900; letter-spacing: 0.2em; }
.bc-tag {
  margin-left: 22px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.3em; color: var(--paper-mute);
  padding: 3px 10px; border: 1px solid var(--line-mid);
}
.bc-hint {
  margin-left: auto;
  font-family: var(--font-kai); font-size: 14px;
  letter-spacing: 0.2em; color: var(--paper-dim);
}

.seal.corner-seal-2 {
  position: absolute; top: 38px; right: 5vw;
  width: 56px; height: 56px;
  font-size: 30px; transform: rotate(-3deg); z-index: 5;
}

.body {
  position: absolute; top: 110px; left: 0; right: 0; bottom: 72px;
  padding: 32px 5vw;
  overflow-y: auto;
}

.group + .group { margin-top: 36px; }
.group-title {
  display: flex; align-items: baseline; gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.group-title h2 {
  font-family: var(--font-kai); font-weight: 700;
  font-size: 22px; letter-spacing: 0.3em;
  color: var(--paper);
  margin: 0;
}
.group-title .count {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--paper-mute);
  margin-left: auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.card {
  position: relative;
  display: flex; flex-direction: column; gap: 8px;
  padding: 18px 20px 20px;
  background: rgba(20, 17, 13, 0.55);
  border: 1px solid var(--line-mid);
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
  overflow: hidden;
}
.card:hover {
  background: rgba(20, 17, 13, 0.85);
  border-color: var(--paper-dim);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(237, 223, 194, 0.15);
}
.card:hover .card-glyph { color: var(--paper); }
.card.active {
  border-color: var(--zhusha);
  background: linear-gradient(150deg, rgba(184,58,28,0.18) 0%, rgba(20,17,13,0.85) 65%);
  box-shadow: 0 0 0 1px rgba(216,85,40,0.5), 0 6px 22px rgba(184,58,28,0.25);
}
.card.active .card-glyph { color: var(--paper); }
.card.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--zhusha); box-shadow: 0 0 12px var(--zhusha-glow);
}
.card:active { transform: translateY(1px) scale(0.997); }

.card-row {
  display: flex; align-items: flex-start; gap: 16px;
}

.card-glyph {
  flex: 0 0 56px;
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-kai); font-size: 32px; font-weight: 900;
  color: var(--paper-2);
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--line);
  transition: color 0.18s ease;
}

.card-meta { flex: 1; min-width: 0; }
.card-name {
  font-family: var(--font-kai);
  font-size: 20px; letter-spacing: 0.22em;
  color: var(--paper);
  margin-bottom: 4px;
}
.card-cn   { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.3em; color: var(--paper-mute); }

.card-desc {
  margin-top: 10px;
  font-family: var(--font-kai);
  font-size: 13px; line-height: 1.55;
  letter-spacing: 0.06em;
  color: var(--paper-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-keys {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 4px;
}
.card-key {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.25em;
  padding: 2px 8px;
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--line-mid);
  color: var(--paper-dim);
}
.card-key.primary {
  border-color: var(--zhusha);
  color: var(--zhusha-bright);
}

@media (max-height: 720px) {
  .header { height: 84px; } .body { top: 84px; bottom: 60px; padding: 20px 4vw; }
  .footer-bar { height: 60px; } .seal.corner-seal-2 { top: 22px; width: 44px; height: 44px; font-size: 26px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRLobby = {
  state: {
    activeId: "login",
    groups: [
      { id: "title", name: "标题与流程", cards: [
        { id: "login",     glyph: "介", name: "标题",   cn: "LOGIN",     key: "H",
          desc: "标题画面 / 主菜单 / 退出确认 modal" },
        { id: "load",      glyph: "载", name: "载入存档", cn: "LOAD",      key: "",
          desc: "存档槽列表 · 自动 / 壹 / 貳 / 空槽" },
        { id: "settings",  glyph: "設", name: "设定",   cn: "SETTINGS",  key: "P",
          desc: "六分类配置：影像 / 音聲 / 操控 / 玩法 / 輔助 / 帳號 — 落盘自动保存" },
        { id: "pause",     glyph: "暫", name: "暂停",   cn: "PAUSE",     key: "",
          desc: "局中暂停面板：继续 / 设定 / 返回标题 / 退出" }
      ]},
      { id: "world", name: "人物与世界", cards: [
        { id: "profile",   glyph: "己", name: "人物",   cn: "PROFILE",   key: "U",
          desc: "立绘 · 属相 · 佩物 · 气脉雷达 · 行迹" },
        { id: "skills",    glyph: "武", name: "武学",   cn: "SKILLS",    key: "L",
          desc: "流派 · 招式 · 详情；汉刀流 / 轻功 / 铁气 / 风咏" },
        { id: "inventory", glyph: "囊", name: "行囊",   cn: "INVENTORY", key: "I",
          desc: "六分类标签 · 网格 · 详情面板；方向键导航" },
        { id: "journal",   glyph: "錄", name: "行錄",   cn: "JOURNAL",   key: "J",
          desc: "任务列表 + 残卷叙事 + 时间线" },
        { id: "map",       glyph: "圖", name: "世界图", cn: "MAP",       key: "M",
          desc: "上帝视角 · 地标 · 传送 · 当前位脉动" },
        { id: "codex",     glyph: "典", name: "典故",   cn: "CODEX",     key: "X",
          desc: "人物 / 地名 / 器物 / 典故 / 宗派；未读自动「新」" }
      ]},
      { id: "scene", name: "战斗与叙事", cards: [
        { id: "combat",    glyph: "战", name: "战斗 HUD", cn: "COMBAT",   key: "",
          desc: "命气势条 · 装备轮盘 · 风向 · 任务条 · 破挡化提示" },
        { id: "dialogue",  glyph: "白", name: "念白",   cn: "DIALOGUE",  key: "K",
          desc: "对话推进 + 打字机 + 三选一抉择" },
        { id: "cinematic", glyph: "幕", name: "剧情演绎", cn: "CINEMATIC", key: "",
          desc: "letterbox + 字幕逐字 + 跳过/重演" }
      ]}
    ]
  },

  setActive(id) {
    if (!this.allCards().some(c => c.id === id)) return;
    this.state.activeId = id;
    this.renderCards();
  },
  cycle(delta) {
    const list = this.allCards();
    const idx = list.findIndex(c => c.id === this.state.activeId);
    this.setActive(list[(idx + delta + list.length) % list.length].id);
  },
  enter() {
    SRBridge.send("nav", { to: this.state.activeId });
  },
  back() { SRBridge.back("startup-web-lobby"); },

  allCards() {
    return [].concat(...this.state.groups.map(g => g.cards));
  },

  renderCards() {
    const wrap = document.querySelector(".lobby-groups");
    wrap.innerHTML = "";
    this.state.groups.forEach(group => {
      const groupEl = document.createElement("section");
      groupEl.className = "group";
      groupEl.innerHTML = `
        <div class="group-title">
          <h2>${group.name}</h2>
          <span class="count">${group.cards.length} 张</span>
        </div>
        <div class="cards"></div>`;
      const cardsEl = groupEl.querySelector(".cards");
      group.cards.forEach(card => {
        const node = document.createElement("div");
        node.className = "card" + (card.id === this.state.activeId ? " active" : "");
        node.innerHTML = `
          <div class="card-row">
            <div class="card-glyph">${card.glyph}</div>
            <div class="card-meta">
              <div class="card-name">${card.name}</div>
              <div class="card-cn">${card.cn}</div>
            </div>
          </div>
          <div class="card-desc">${card.desc}</div>
          <div class="card-keys">
            ${card.key ? `<span class="card-key primary">${card.key}</span>` : ""}
            <span class="card-key">SR.WebUI.Open ${card.id}</span>
          </div>`;
        node.addEventListener("mouseenter", () => this.setActive(card.id));
        node.addEventListener("click", () => {
          this.setActive(card.id);
          SRBridge.send("nav", { to: card.id });
        });
        cardsEl.appendChild(node);
      });
      wrap.appendChild(groupEl);
    });
  },

  render() { this.renderCards(); }
};

ue.interface.setLobbyData = function() { window.SRLobby.render(); };

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRLobby.back(); }
  else if (e.key === "Enter" || e.key === " ")     { e.preventDefault(); SRLobby.enter(); }
  else if (e.key === "ArrowLeft"  || e.key === "a" || e.key === "A") { e.preventDefault(); SRLobby.cycle(-1); }
  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); SRLobby.cycle(1); }
  else if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); SRLobby.cycle(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); SRLobby.cycle(1); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRLobby.render();
  SRBridge.ready("startup-web-lobby");
});
</script>
</head>
<body>
<main class="stage">
  <div class="header">
    <div class="bc-kanji">前堂</div>
    <div class="bc-tag">DEV · LOBBY</div>
    <div class="bc-hint">点格登场 / Esc 退</div>
  </div>
  <div class="seal corner-seal-2">门</div>

  <div class="body">
    <div class="lobby-groups"></div>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta">前堂 · 全 WebUI 总览 · 二〇二六</div>
    <div class="prompts">
      <div class="prompt"><span class="key cross">✕</span>登场</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
    </div>
  </footer>
</main>
</body>
</html>
