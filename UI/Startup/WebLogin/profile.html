<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 人物 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage { background: linear-gradient(180deg, #0E0B07 0%, #14110C 100%); }

.header { position: absolute; top: 0; left: 0; right: 0; height: 110px;
  display: flex; align-items: center; padding: 0 5vw; border-bottom: 1px solid var(--line); }
.bc-kanji { font-size: clamp(40px, 4.2vw, 60px); font-weight: 900; letter-spacing: 0.2em; }
.bc-path  { margin-left: auto; display: flex; gap: 14px;
  font-family: var(--font-mono); font-size: 13px; color: var(--paper-dim); letter-spacing: 0.25em; }
.bc-path .sep { opacity: 0.4; } .bc-path .cur { color: var(--zhusha-bright); }

.seal.corner-seal-2 { position: absolute; top: 38px; right: 5vw; width: 56px; height: 56px;
  font-size: 32px; transform: rotate(-3deg); z-index: 5; }

.body {
  position: absolute; top: 110px; left: 0; right: 0; bottom: 72px;
  padding: 32px 5vw;
  display: grid;
  grid-template-columns: minmax(260px, 320px) 1fr 360px;
  gap: 32px;
  overflow: hidden;
}

.portrait-col {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.portrait {
  width: 100%; aspect-ratio: 3 / 4;
  background:
    radial-gradient(ellipse 70% 70% at 50% 35%, rgba(184,58,28,0.10) 0%, transparent 70%),
    linear-gradient(180deg, rgba(20,17,13,0.85) 0%, rgba(8,7,4,0.92) 100%);
  border: 1px solid var(--line-mid);
  position: relative; overflow: hidden;
}
.portrait::after {
  content: "風"; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-kai); font-size: 12vw; font-weight: 900;
  color: rgba(237,223,194,0.10);
}
.portrait .frame {
  position: absolute; inset: 14px;
  border: 1px solid rgba(237,223,194,0.10);
  pointer-events: none;
}
.portrait .seal-mark {
  position: absolute; bottom: 18px; right: 18px;
  width: 38px; height: 38px;
  font-size: 22px; transform: rotate(-5deg);
}

.identity {
  text-align: center; line-height: 1.5;
}
.identity .name {
  font-family: var(--font-kai); font-size: 30px; font-weight: 700;
  letter-spacing: 0.32em; color: var(--paper); margin-bottom: 6px;
}
.identity .clazz {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.4em; color: var(--zhusha-bright);
  display: inline-block; padding: 3px 12px;
  border: 1px solid var(--zhusha);
}
.identity .lineage {
  margin-top: 14px;
  font-family: var(--font-kai);
  font-size: 13px; color: var(--paper-dim);
  letter-spacing: 0.18em; line-height: 1.7;
}

.center-col {
  display: flex; flex-direction: column; gap: 24px;
  overflow-y: auto;
  padding-right: 6px;
}

.section {
  background: rgba(0,0,0,0.32);
  border: 1px solid var(--line);
  padding: 18px 22px;
}
.section h3 {
  font-family: var(--font-kai);
  font-size: 18px; letter-spacing: 0.3em;
  color: var(--paper);
  margin: 0 0 12px 0; font-weight: 700;
  position: relative; padding-left: 16px;
}
.section h3::before {
  content: ""; position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 16px;
  background: var(--zhusha);
  box-shadow: 0 0 8px var(--zhusha-glow);
}

.attrs {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px 26px;
}
.attr-row {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}
.attr-name { font-size: 14px; letter-spacing: 0.18em; color: var(--paper-2); width: 60px; }
.attr-bar { flex: 1; height: 4px; background: rgba(0,0,0,0.6); border: 1px solid rgba(237,223,194,0.18); position: relative; }
.attr-fill {
  position: absolute; inset: 0 auto 0 0;
  background: linear-gradient(90deg, var(--zhusha) 0%, var(--gold) 100%);
  box-shadow: 0 0 8px var(--zhusha-glow);
}
.attr-val { font-family: var(--font-mono); font-size: 14px; color: var(--paper); width: 48px; text-align: right; }

.equipped {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px 14px;
}
.equip {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.55);
  border: 1px solid var(--line-mid);
}
.equip-glyph {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.45);
  border: 1px solid var(--line);
  font-family: var(--font-kai); font-size: 22px; color: var(--paper-2);
}
.equip-info { flex: 1; min-width: 0; }
.equip-slot { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.3em; color: var(--paper-mute); }
.equip-name { font-size: 14px; letter-spacing: 0.16em; color: var(--paper); margin-top: 2px; }
.equip-tier {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.3em; color: var(--gold);
  margin-top: 2px;
}

.right-col {
  display: flex; flex-direction: column; gap: 24px;
  overflow-y: auto;
}

.spider {
  background: rgba(0,0,0,0.32);
  border: 1px solid var(--line);
  padding: 16px 16px 22px;
  text-align: center;
}
.spider h3 {
  font-family: var(--font-kai);
  font-size: 16px; letter-spacing: 0.3em;
  color: var(--paper); margin: 0 0 14px 0;
}
.spider svg { width: 100%; height: auto; max-width: 320px; }

.history {
  background: rgba(0,0,0,0.32);
  border: 1px solid var(--line);
  padding: 16px 22px;
}
.history-row {
  display: flex; justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 12px;
  color: var(--paper-dim);
  letter-spacing: 0.12em;
}
.history-row .when { color: var(--paper-mute); }
.history-row .what { color: var(--paper-2); }
.history-row:last-child { border-bottom: 0; }

@media (max-width: 1180px) {
  .body { grid-template-columns: 240px 1fr 320px; }
}
@media (max-height: 720px) {
  .header { height: 84px; } .body { top: 84px; bottom: 60px; padding: 18px 4vw; gap: 18px; }
  .footer-bar { height: 60px; } .seal.corner-seal-2 { top: 22px; width: 44px; height: 44px; font-size: 26px; }
  .spider svg { max-width: 240px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRProfile = {
  state: {
    name: "風行客",
    title: "汉刀流 · 内门",
    lineage: "汉北边骑 · 出居延关\n师承先生 · 三式入门",
    attrs: [
      { id:"strength",  name:"力",  v: 78 },
      { id:"agility",   name:"行",  v: 82 },
      { id:"endurance", name:"忍",  v: 70 },
      { id:"qi",        name:"气",  v: 65 },
      { id:"sense",     name:"察",  v: 88 },
      { id:"poise",     name:"势",  v: 60 }
    ],
    radar: [
      // [label, value 0..1]
      ["攻", 0.78], ["御", 0.62], ["速", 0.84], ["谋", 0.71], ["命", 0.66]
    ],
    equipped: [
      { slot:"刀", name:"环首汉刀", tier:"上品", glyph:"刀" },
      { slot:"甲", name:"片甲",     tier:"中品", glyph:"甲" },
      { slot:"佩", name:"汉玉玦",   tier:"上品", glyph:"玦" },
      { slot:"术", name:"风咏 · 聆", tier:"未阶", glyph:"聆" }
    ],
    history: [
      { when:"〇·〇一", what:"出居延关" },
      { when:"〇·〇五", what:"破雪行三日" },
      { when:"〇·〇九", what:"返山村南口" },
      { when:"〇·一一", what:"觉醒 · 第二式" }
    ]
  },

  back() { SRBridge.back("startup-web-profile"); },

  renderIdentity() {
    document.querySelector(".identity .name").textContent  = this.state.name;
    document.querySelector(".identity .clazz").textContent = this.state.title;
    const lin = document.querySelector(".identity .lineage");
    lin.innerHTML = "";
    this.state.lineage.split("\n").forEach(line => {
      const div = document.createElement("div");
      div.textContent = line;
      lin.appendChild(div);
    });
  },

  renderAttrs() {
    const wrap = document.querySelector(".attrs");
    wrap.innerHTML = "";
    this.state.attrs.forEach(a => {
      const node = document.createElement("div");
      node.className = "attr-row";
      node.innerHTML = `
        <div class="attr-name">${a.name}</div>
        <div class="attr-bar"><div class="attr-fill" style="width:${a.v}%"></div></div>
        <div class="attr-val">${a.v}</div>`;
      wrap.appendChild(node);
    });
  },

  renderEquipped() {
    const wrap = document.querySelector(".equipped");
    wrap.innerHTML = "";
    this.state.equipped.forEach(e => {
      const node = document.createElement("div");
      node.className = "equip";
      node.innerHTML = `
        <div class="equip-glyph">${e.glyph}</div>
        <div class="equip-info">
          <div class="equip-slot">${e.slot}</div>
          <div class="equip-name">${e.name}</div>
          <div class="equip-tier">${e.tier}</div>
        </div>`;
      wrap.appendChild(node);
    });
  },

  renderRadar() {
    const svg = document.querySelector(".spider svg");
    if (!svg) return;
    const cx = 160, cy = 160, r = 120;
    const pts = this.state.radar;
    const n = pts.length;
    const angleAt = (i) => -Math.PI / 2 + i * (2 * Math.PI / n);
    const polarToXY = (i, ratio) => [
      cx + r * ratio * Math.cos(angleAt(i)),
      cy + r * ratio * Math.sin(angleAt(i))
    ];
    let html = "";
    // grid rings
    for (let g = 1; g <= 4; g++) {
      const ratio = g / 4;
      const ringPts = pts.map((_, i) => polarToXY(i, ratio).join(",")).join(" ");
      html += `<polygon points="${ringPts}" fill="none" stroke="rgba(237,223,194,0.10)" stroke-width="1"/>`;
    }
    // axes
    pts.forEach((_, i) => {
      const [x, y] = polarToXY(i, 1.0);
      html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(237,223,194,0.10)" stroke-width="1"/>`;
    });
    // value polygon
    const valPts = pts.map((p, i) => polarToXY(i, p[1]).join(",")).join(" ");
    html += `<polygon points="${valPts}" fill="rgba(184,58,28,0.30)" stroke="#D85528" stroke-width="2"/>`;
    // labels
    pts.forEach((p, i) => {
      const [x, y] = polarToXY(i, 1.16);
      html += `<text x="${x}" y="${y}" font-family="KaiBrush, KaiTi, serif" font-size="16" fill="#EDDFC2" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">${p[0]}</text>`;
    });
    svg.innerHTML = html;
  },

  renderHistory() {
    const wrap = document.querySelector(".history-list");
    wrap.innerHTML = "";
    this.state.history.forEach(h => {
      const node = document.createElement("div");
      node.className = "history-row";
      node.innerHTML = `<span class="when">${h.when}</span><span class="what">${h.what}</span>`;
      wrap.appendChild(node);
    });
  },

  render() {
    this.renderIdentity();
    this.renderAttrs();
    this.renderEquipped();
    this.renderRadar();
    this.renderHistory();
  }
};

ue.interface.setProfileData = function(data) {
  if (!data) return;
  Object.assign(window.SRProfile.state, data);
  window.SRProfile.render();
};

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRProfile.back(); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRProfile.render();
  SRBridge.ready("startup-web-profile");
});
</script>
</head>
<body>
<main class="stage">
  <div class="header">
    <div class="bc-kanji">人物</div>
    <div class="bc-path"><span>主页</span><span class="sep">·</span><span>人物</span><span class="sep">·</span><span class="cur">風行客</span></div>
  </div>
  <div class="seal corner-seal-2">己</div>

  <div class="body">
    <div class="portrait-col">
      <div class="portrait">
        <div class="frame"></div>
        <div class="seal seal-mark">介</div>
      </div>
      <div class="identity">
        <div class="name"></div>
        <div class="clazz"></div>
        <div class="lineage"></div>
      </div>
    </div>

    <div class="center-col">
      <section class="section">
        <h3>属相</h3>
        <div class="attrs"></div>
      </section>
      <section class="section">
        <h3>佩物</h3>
        <div class="equipped"></div>
      </section>
    </div>

    <div class="right-col">
      <section class="spider">
        <h3>气脉</h3>
        <svg viewBox="0 0 320 320"></svg>
      </section>
      <section class="history">
        <div class="history-list"></div>
      </section>
    </div>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta">人物 · DEV 预览 · 二〇二六</div>
    <div class="prompts">
      <div class="prompt"><span class="key cross">✕</span>详情</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
    </div>
  </footer>
</main>
</body>
</html>
