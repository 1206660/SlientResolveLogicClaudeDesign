<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 设定 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage {
  background: linear-gradient(180deg, #0C0A07 0%, #14110C 100%);
  overflow: hidden;
}
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease, filter 0.18s ease;
}
body[data-scroll-mode="ink"] .stage::after {
  opacity: 1;
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,0.04) 0%, transparent 32%),
    linear-gradient(180deg, rgba(0,0,0,0.10), rgba(255,255,255,0.02));
  mix-blend-mode: screen;
}
body[data-scroll-mode="scroll"] .stage::after {
  opacity: 1;
  background:
    linear-gradient(180deg, rgba(88,64,34,0.18), rgba(22,18,12,0.06)),
    repeating-linear-gradient(
      180deg,
      rgba(255,244,220,0.016) 0px,
      rgba(255,244,220,0.016) 2px,
      rgba(0,0,0,0.00) 2px,
      rgba(0,0,0,0.00) 8px
    );
  mix-blend-mode: soft-light;
}

.header {
  position: absolute; top: 0; left: 0; right: 0; height: 110px;
  display: flex; align-items: center; padding: 0 5vw;
  border-bottom: 1px solid var(--line);
}
.bc-kanji {
  font-family: var(--font-kai);
  font-size: clamp(40px, 4.4vw, 64px);
  font-weight: 900; letter-spacing: 0.2em;
  color: var(--paper);
}
.bc-path {
  margin-left: auto;
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--paper-dim);
  letter-spacing: 0.25em;
}
.bc-path .sep { opacity: 0.4; }
.bc-path .cur { color: var(--zhusha-bright); }

.seal.corner-seal-2 {
  position: absolute; top: 38px; right: 5vw;
  width: 56px; height: 56px;
  font-size: 34px;
  transform: rotate(-3deg); z-index: 5;
}

.body {
  position: absolute; top: 110px; left: 0; right: 0; bottom: 72px;
  display: grid; grid-template-columns: 320px 1fr;
}

.sidebar {
  border-right: 1px solid var(--line);
  padding: 36px 0;
  background: rgba(0,0,0,0.28);
  overflow: hidden;
}
.cat {
  position: relative; display: flex; align-items: center; gap: 18px;
  padding: 16px 5vw; cursor: pointer;
  transition: background 0.18s ease;
}
.cat:hover { background: rgba(237,223,194,0.04); }
.cat.active {
  background: linear-gradient(90deg, rgba(184,58,28,0.13) 0%, transparent 100%);
}
.cat.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--zhusha);
  box-shadow: 0 0 14px var(--zhusha-glow);
}
.cat-num {
  font-family: var(--font-kai);
  font-size: 22px; font-weight: 900;
  color: var(--paper-mute);
  min-width: 28px; text-align: center;
}
.cat.active .cat-num { color: var(--zhusha-bright); }
.cat-name {
  font-size: 22px; font-weight: 500;
  letter-spacing: 0.4em; padding-left: 0.4em;
  color: var(--paper-dim);
}
.cat.active .cat-name { color: var(--paper); font-weight: 700; }
.cat-en {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--paper-mute);
}

.content {
  padding: 44px 5vw;
  overflow-y: auto;
  scrollbar-width: none;
  background: radial-gradient(ellipse 100% 80% at 100% 50%, rgba(184,58,28,0.022) 0%, transparent 70%);
}
.content::-webkit-scrollbar { width: 0; height: 0; }

.section-head {
  display: flex; align-items: baseline; gap: 24px;
  margin-bottom: 32px; padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.section-title {
  font-family: var(--font-kai);
  font-size: 32px; font-weight: 700;
  letter-spacing: 0.22em; color: var(--paper);
}
.section-hint {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--paper-mute);
  letter-spacing: 0.2em;
}

.row {
  display: grid; grid-template-columns: minmax(220px, 320px) 1fr 140px;
  align-items: center; gap: 32px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: none; }
.row-title {
  font-size: 18px; font-weight: 500;
  letter-spacing: 0.15em; color: var(--paper);
}
.row-desc {
  font-size: 12px; color: var(--paper-mute);
  letter-spacing: 0.06em; line-height: 1.6; margin-top: 4px;
}

.seg {
  display: flex; border: 1px solid var(--line-mid);
  background: rgba(0,0,0,0.32);
}
.seg-item {
  flex: 1; padding: 10px 14px; text-align: center;
  font-family: var(--font-kai);
  font-size: 14px; letter-spacing: 0.18em;
  color: var(--paper-dim);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.seg-item.active {
  background: var(--zhusha); color: var(--paper); font-weight: 700;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.35);
}
.seg-item + .seg-item { border-left: 1px solid var(--line); }

.slider-wrap { display: flex; align-items: center; gap: 16px; }
.slider {
  flex: 1; height: 24px;             /* widen click/drag target without changing visual */
  background: transparent;
  position: relative; cursor: ew-resize;
  display: flex; align-items: center;
}
.slider::before {
  content: ""; position: absolute; left: 0; right: 0;
  top: 50%; height: 2px; transform: translateY(-50%);
  background: var(--line-mid);
}
.slider-fill {
  position: absolute; left: 0; top: 50%;
  height: 2px; transform: translateY(-50%);
  background: linear-gradient(90deg, var(--zhusha) 0%, var(--gold) 100%);
  box-shadow: 0 0 10px var(--zhusha-glow);
  pointer-events: none;
}
.slider-knob {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 14px; height: 14px;
  background: var(--paper);
  border: 2px solid var(--zhusha);
  box-shadow: 0 0 14px var(--zhusha-glow);
  pointer-events: none;
}

.toggle {
  display: inline-flex; align-items: center; gap: 12px;
  cursor: pointer;
}
.toggle-track {
  width: 50px; height: 22px;
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--line-mid);
  position: relative; transition: background 0.2s ease, border-color 0.2s ease;
}
.toggle-knob {
  position: absolute; top: 1px; left: 1px;
  width: 18px; height: 18px;
  background: var(--paper-dim);
  transition: left 0.2s ease, background 0.2s ease;
}
.toggle.on .toggle-track {
  background: var(--zhusha); border-color: var(--zhusha);
}
.toggle.on .toggle-knob {
  left: 29px; background: var(--paper);
}
.toggle-label {
  font-size: 13px; letter-spacing: 0.2em;
  color: var(--paper-dim); transition: color 0.2s ease;
}
.toggle.on .toggle-label { color: var(--paper); }

.value {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 16px; letter-spacing: 0.1em;
  color: var(--paper);
}
.value .unit {
  color: var(--paper-mute);
  font-size: 12px; margin-left: 4px;
}

.row.signature {
  background: linear-gradient(90deg, rgba(184,58,28,0.07) 0%, transparent 100%);
  border-left: 3px solid var(--zhusha);
  padding-left: 18px; margin-left: -18px;
}
.row.signature .row-title::after {
  content: "殘卷";
  font-family: var(--font-kai); font-weight: 700;
  font-size: 11px; letter-spacing: 0.3em;
  background: var(--zhusha); color: var(--paper);
  padding: 2px 8px; margin-left: 12px; vertical-align: middle;
}

.action-row {
  display: flex; gap: 14px; margin-top: 28px;
  padding-top: 22px; border-top: 1px solid var(--line);
}
.action-btn {
  position: relative; flex: 0 0 auto;
  padding: 12px 30px;
  font-family: var(--font-kai); font-size: 16px;
  letter-spacing: 0.32em; color: var(--paper-2);
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--line-mid);
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}
.action-btn:hover {
  color: var(--paper);
  border-color: var(--paper-dim);
  background: rgba(237,223,194,0.06);
}
.action-btn:active { transform: translateY(1px); }
.action-btn.primary {
  border-color: var(--zhusha);
  color: var(--paper);
  background: linear-gradient(180deg, rgba(184,58,28,0.5), rgba(138,40,16,0.6));
  box-shadow: 0 0 14px var(--zhusha-glow);
}
.action-btn.primary:hover { background: linear-gradient(180deg, rgba(216,85,40,0.7), rgba(184,58,28,0.7)); }

.toast {
  position: absolute; right: 5vw; bottom: 88px;
  z-index: 60;
  padding: 12px 20px;
  background: rgba(20,17,13,0.95);
  border: 1px solid var(--zhusha);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.18em;
  box-shadow: 0 4px 24px rgba(184,58,28,0.30);
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

body[data-subtitle-size="s"] .row-desc,
body[data-subtitle-size="s"] .section-hint,
body[data-subtitle-size="s"] .footer-meta,
body[data-subtitle-size="s"] .prompt {
  font-size: 11px;
}
body[data-subtitle-size="l"] .row-desc,
body[data-subtitle-size="l"] .section-hint,
body[data-subtitle-size="l"] .footer-meta,
body[data-subtitle-size="l"] .prompt {
  font-size: 13px;
}
body[data-subtitle-size="xl"] .row-desc,
body[data-subtitle-size="xl"] .section-hint,
body[data-subtitle-size="xl"] .footer-meta,
body[data-subtitle-size="xl"] .prompt {
  font-size: 14px;
}
body[data-subtitle-size="xl"] .row-title {
  font-size: 19px;
}

@media (max-height: 720px) {
  .header { height: 84px; }
  .body { top: 84px; bottom: 60px; }
  .footer-bar { height: 60px; }
  .seal.corner-seal-2 { top: 22px; width: 44px; height: 44px; font-size: 26px; }
  .sidebar { padding: 18px 0; }
  .cat { padding-top: 12px; padding-bottom: 12px; }
  .cat-name { font-size: 20px; }
  .cat-en { font-size: 9px; letter-spacing: 0.24em; }
  .content { padding-top: 28px; padding-bottom: 24px; }
  .section-head { margin-bottom: 18px; padding-bottom: 12px; }
  .section-title { font-size: 30px; }
  .row { padding: 13px 0; gap: 24px; }
  .row-title { font-size: 17px; }
  .row-desc { line-height: 1.4; }
  .action-row { margin-top: 18px; padding-top: 16px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>

function SRNormalizeTemplateOption(value) {
  if (value === "Ink" || value === "Sanguo") return "Ink";
  if (value === "Default") return "Default";
  return "Default";
}

window.SRSettings = {
  state: {
    activeCategoryId: "display",
    categories: [
      { id: "display",   numeral: "壹", name: "影像", en: "DISPLAY" },
      { id: "audio",     numeral: "貳", name: "音聲", en: "AUDIO" },
      { id: "controls",  numeral: "參", name: "操控", en: "CONTROLS" },
      { id: "gameplay",  numeral: "肆", name: "玩法", en: "GAMEPLAY" },
      { id: "access",    numeral: "伍", name: "輔助", en: "ACCESSIBILITY" },
      { id: "account",   numeral: "陸", name: "帳號", en: "ACCOUNT" }
    ],
    sections: {
      display: {
        title: "影像", hint: "八项 · 自动保存",
        rows: [
          { id: "template", title: "界面模板", desc: "整体视觉风格 · 切换后将重载界面",
            kind: "seg", signature: true,
            options: [{ id:"Default", label:"默认 · 楷墨" },{ id:"Ink", label:"水墨 · Ink" }],
            value: "Default" },
          { id: "renderMode", title: "画面模式", desc: "切换目标帧率与整体画面负载",
            kind: "seg", options: [{ id:"perf", label:"120帧" },{ id:"balance", label:"60帧" },{ id:"quality", label:"30帧" }],
            value: "perf" },
          { id: "hdr", title: "高动态范围", desc: "需电视支持 · 开启后可进入校准",
            kind: "toggle", value: true, valueText: "1400 尼特", labelOn: "已开 · 标准制式", labelOff: "未开" },
          { id: "scrollMode", title: "水墨残卷模式", desc: "切换水墨滤镜与残卷质感表现",
            kind: "seg", signature: true, options: [{ id:"off", label:"关闭" },{ id:"ink", label:"水墨" },{ id:"scroll", label:"古卷" }],
            value: "off" },
          { id: "motionBlur", title: "运动模糊", desc: "摄像机快速移动时的模糊强度",
            kind: "slider", value: 32, max: 100 },
          { id: "camShake", title: "摄像机摇晃", desc: "战斗与奔跑时的屏幕摇晃",
            kind: "slider", value: 60, max: 100 },
          { id: "subtitleSize", title: "字幕大小", desc: "含说话人标签与背景不透明度",
            kind: "seg", options: [{ id:"s",label:"小" },{ id:"m",label:"中" },{ id:"l",label:"大" },{ id:"xl",label:"特大" }],
            value: "m" },
          { id: "colorblind", title: "色觉辅助", desc: "调整关键 UI 与敌我识别的色彩",
            kind: "seg", options: [{ id:"off",label:"关闭" },{ id:"rg",label:"红绿" },{ id:"by",label:"蓝黄" },{ id:"all",label:"全色盲" }],
            value: "off" }
        ]
      },
      audio: {
        title: "音聲", hint: "五项 · 主音量 80%",
        rows: [
          { id: "master",  title: "主音量", desc: "总输出 · 影响所有音轨", kind:"slider", value: 80, max: 100 },
          { id: "music",   title: "配乐",   desc: "片头 · 战斗 · 探索",   kind:"slider", value: 70, max: 100 },
          { id: "ambient", title: "环境",   desc: "风 · 水 · 林 · 远人声", kind:"slider", value: 65, max: 100 },
          { id: "voice",   title: "配音",   desc: "对白 · 念白 · 战吼",     kind:"slider", value: 90, max: 100 },
          { id: "subtitleVoice", title: "字幕音", desc: "字幕推送提示音", kind:"toggle", value: false, labelOn:"已开", labelOff:"已关" }
        ]
      },
      controls: {
        title: "操控", hint: "DualSense · 可外设",
        rows: [
          { id: "vibration", title: "振动", desc: "DualSense 触觉反馈强度", kind:"slider", value: 50, max: 100 },
          { id: "trigger",   title: "自适应扳机", desc: "L2/R2 阻力与战斗节奏匹配", kind:"toggle", value:true, labelOn:"已开 · 战斗强化", labelOff:"已关" },
          { id: "stickSensitivity", title: "摇杆灵敏度", desc: "右摇杆视角灵敏度", kind:"slider", value: 55, max: 100 },
          { id: "invertY", title: "反向 Y 轴", desc: "上拉视角下移", kind:"toggle", value:false, labelOn:"已反", labelOff:"标准" }
        ]
      },
      gameplay: {
        title: "玩法", hint: "战斗与提示密度",
        rows: [
          { id: "difficulty", title: "难度", desc: "影响敌人攻击节奏与伤害",
            kind:"seg", options:[{id:"easy",label:"宽悯"},{id:"normal",label:"如常"},{id:"hard",label:"凛冬"}], value:"normal" },
          { id: "autoLock", title: "自动锁敌", desc: "动作命中前自动吸附目标", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id: "windHint", title: "风向辅助", desc: "潜行时显示风的指向", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id: "rttDensity", title: "RTT 提示密度", desc: "战斗内画面右上提示的密度",
            kind:"seg", options:[{id:"low",label:"少"},{id:"mid",label:"中"},{id:"high",label:"多"}], value:"mid" }
        ]
      },
      access: {
        title: "輔助", hint: "无障碍",
        rows: [
          { id: "bigText", title: "大字体", desc: "UI 文本 +20%", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id: "highContrast", title: "高对比", desc: "提升敌我与可交互物的对比度", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id: "oneHand", title: "单手模式", desc: "重要操作合并到单侧手柄", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id: "screenReader", title: "屏读", desc: "朗读 UI 焦点", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" }
        ]
      },
      account: {
        title: "帳號", hint: "云存档",
        rows: [
          { id: "cloudSync", title: "云存档", desc: "自动同步至 Steam Cloud / PSN", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id: "telemetry", title: "匿名使用统计", desc: "用于改进游戏稳定性", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" }
        ]
      }
    }
  },

  setActiveCategory(id) {
    if (!this.state.sections[id]) return;
    this.state.activeCategoryId = id;
    this.renderSidebar();
    this.renderContent();
    this.renderBreadcrumb();
  },

  cycleCategory(delta) {
    const cats = this.state.categories;
    const idx = cats.findIndex(c => c.id === this.state.activeCategoryId);
    const nextIdx = (idx + delta + cats.length) % cats.length;
    this.setActiveCategory(cats[nextIdx].id);
  },

  setRowValue(rowId, newValue) {
    const section = this.state.sections[this.state.activeCategoryId];
    const row = section.rows.find(r => r.id === rowId);
    if (!row) return;
    row.value = newValue;
    const snapshot = this.snapshot();
    this.applyPreviewState(snapshot);
    this.renderContent();
    ue5("change", { categoryId: this.state.activeCategoryId, rowId, value: newValue, snapshot });

    // Live preview for accessibility theme switches — apply BEFORE save so the user
    // sees the change while still adjusting.
    if (rowId === "colorblind" || rowId === "highContrast" || rowId === "bigText") {
      const themePayload = {
        colorblind: this.state.sections.display.rows.find(r => r.id === "colorblind")?.value || "off",
        contrast:   this.state.sections.access.rows.find(r => r.id === "highContrast")?.value ? "high" : "normal",
        bigtext:    this.state.sections.access.rows.find(r => r.id === "bigText")?.value ? "on" : "off"
      };
      if (window.SRTheme) SRTheme.apply(themePayload);
    }
  },

  applyPreviewState(snapshot) {
    if (!snapshot) return;
    const display = snapshot.display || {};
    const access = snapshot.access || {};
    document.body.dataset.scrollMode = display.scrollMode || "off";
    document.body.dataset.subtitleSize = display.subtitleSize || "m";
    document.body.dataset.oneHand = access.oneHand ? "on" : "off";
    document.body.dataset.screenReader = access.screenReader ? "on" : "off";
  },

  apply() {
    SRBridge.send("apply", { snapshot: this.snapshot() });
    this.showToast("已保存 · 自动同步");
  },

  resetSection() {
    SRBridge.send("reset", { categoryId: this.state.activeCategoryId });
    this.showToast("已恢复默认");
  },

  showToast(text) {
    const t = document.querySelector(".toast");
    if (!t) return;
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  },

  back() {
    ue5("back", { surface: "startup-web-settings" });
  },

  snapshot() {
    const out = {};
    Object.keys(this.state.sections).forEach(catId => {
      out[catId] = {};
      this.state.sections[catId].rows.forEach(row => {
        out[catId][row.id] = row.value;
      });
    });
    return out;
  },

  renderSidebar() {
    const sidebar = document.querySelector(".sidebar");
    sidebar.innerHTML = "";
    this.state.categories.forEach(cat => {
      const node = document.createElement("div");
      node.className = "cat" + (cat.id === this.state.activeCategoryId ? " active" : "");
      node.innerHTML = `
        <div class="cat-num">${cat.numeral}</div>
        <div class="cat-name">${cat.name}</div>
      `;
      node.addEventListener("click", () => this.setActiveCategory(cat.id));
      sidebar.appendChild(node);
    });
  },

  renderBreadcrumb() {
    const cur = this.state.categories.find(c => c.id === this.state.activeCategoryId);
    document.querySelector(".bc-path .cur").textContent = cur ? cur.name : "";
  },

  renderContent() {
    const content = document.querySelector(".content");
    content.innerHTML = "";

    const section = this.state.sections[this.state.activeCategoryId];
    if (!section) return;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `
      <div class="section-title">${section.title}</div>
      <div class="section-hint">${section.hint}</div>
    `;
    content.appendChild(head);

    section.rows.forEach(row => {
      const node = document.createElement("div");
      node.className = "row" + (row.signature ? " signature" : "");

      const titleCell = document.createElement("div");
      titleCell.innerHTML = `
        <div class="row-title">${row.title}</div>
        <div class="row-desc">${row.desc || ""}</div>
      `;
      node.appendChild(titleCell);

      const controlCell = document.createElement("div");
      const valueCell = document.createElement("div");
      valueCell.className = "value";

      if (row.kind === "seg") {
        const seg = document.createElement("div");
        seg.className = "seg";
        row.options.forEach(opt => {
          const item = document.createElement("div");
          item.className = "seg-item" + (opt.id === row.value ? " active" : "");
          item.textContent = opt.label;
          item.addEventListener("click", () => this.setRowValue(row.id, opt.id));
          seg.appendChild(item);
        });
        controlCell.appendChild(seg);
        const cur = row.options.find(o => o.id === row.value);
        valueCell.textContent = cur ? cur.label.split(" · ")[0] : "";
      } else if (row.kind === "toggle") {
        const wrap = document.createElement("div");
        wrap.className = "toggle" + (row.value ? " on" : "");
        wrap.innerHTML = `
          <div class="toggle-track"><div class="toggle-knob"></div></div>
          <div class="toggle-label">${row.value ? (row.labelOn || "已开") : (row.labelOff || "已关")}</div>
        `;
        wrap.addEventListener("click", () => this.setRowValue(row.id, !row.value));
        controlCell.appendChild(wrap);
        valueCell.innerHTML = row.valueText
          ? row.valueText
          : `<span>${row.value ? "开" : "关"}</span>`;
      } else if (row.kind === "slider") {
        const wrap = document.createElement("div");
        wrap.className = "slider-wrap";
        const track = document.createElement("div");
        track.className = "slider";
        const fill = document.createElement("div");
        fill.className = "slider-fill";
        const knob = document.createElement("div");
        knob.className = "slider-knob";
        const max = row.max || 100;
        const pct = Math.max(0, Math.min(100, (row.value / max) * 100));
        fill.style.width = pct + "%";
        knob.style.left = pct + "%";
        track.appendChild(fill);
        track.appendChild(knob);
        const valueFromEvent = (event) => {
          const rect = track.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          return Math.round(ratio * max);
        };
        let dragging = false;
        const moveHandler = (event) => {
          if (!dragging) return;
          this.setRowValue(row.id, valueFromEvent(event));
        };
        const upHandler = () => {
          if (!dragging) return;
          dragging = false;
          window.removeEventListener("mousemove", moveHandler);
          window.removeEventListener("mouseup", upHandler);
        };
        track.addEventListener("mousedown", (event) => {
          event.preventDefault();
          dragging = true;
          this.setRowValue(row.id, valueFromEvent(event));
          window.addEventListener("mousemove", moveHandler);
          window.addEventListener("mouseup", upHandler);
        });
        track.addEventListener("wheel", (event) => {
          event.preventDefault();
          const step = Math.max(1, Math.round(max / 50));
          const next = Math.max(0, Math.min(max, row.value + (event.deltaY < 0 ? step : -step)));
          this.setRowValue(row.id, next);
        }, { passive: false });
        wrap.appendChild(track);
        controlCell.appendChild(wrap);
        valueCell.innerHTML = `${row.value}<span class="unit">/ ${max}</span>`;
      }
      node.appendChild(controlCell);
      node.appendChild(valueCell);
      content.appendChild(node);
    });

    const actions = document.createElement("div");
    actions.className = "action-row";
    const apply = document.createElement("button");
    apply.type = "button";
    apply.className = "action-btn primary";
    apply.textContent = "保 存";
    apply.addEventListener("click", () => this.apply());
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "action-btn";
    reset.textContent = "恢 复 默 认";
    reset.addEventListener("click", () => this.resetSection());
    actions.appendChild(apply);
    actions.appendChild(reset);
    content.appendChild(actions);
  },

  render() {
    this.renderSidebar();
    this.renderContent();
    this.renderBreadcrumb();
  }
};

ue.interface.setSettingsData = function(data) {
  if (!data) return;
  if (data.activeCategoryId) {
    window.SRSettings.state.activeCategoryId = data.activeCategoryId;
  }
  if (data.values) {
    Object.keys(data.values).forEach(catId => {
      const section = window.SRSettings.state.sections[catId];
      if (!section) return;
      Object.keys(data.values[catId]).forEach(rowId => {
        const row = section.rows.find(r => r.id === rowId);
        if (row) row.value = rowId === "template" ? SRNormalizeTemplateOption(data.values[catId][rowId]) : data.values[catId][rowId];
      });
    });
  }
  window.SRSettings.applyPreviewState(window.SRSettings.snapshot());
  window.SRSettings.render();
};

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" || event.key === "Backspace") {
    event.preventDefault();
    window.SRSettings.back();
  } else if (event.key === "Tab") {
    event.preventDefault();
    window.SRSettings.cycleCategory(event.shiftKey ? -1 : 1);
  } else if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") {
    event.preventDefault();
    window.SRSettings.cycleCategory(-1);
  } else if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") {
    event.preventDefault();
    window.SRSettings.cycleCategory(1);
  } else if (event.key === "Enter") {
    event.preventDefault();
    window.SRSettings.apply();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  window.SRSettings.applyPreviewState(window.SRSettings.snapshot());
  window.SRSettings.render();
  ue5("ready", { surface: "startup-web-settings" });
});
</script>
</head>

  <div class="header">
    <div class="bc-kanji">設定</div>
    <div class="bc-path">
      <span>主页</span><span class="sep">·</span>
      <span>設定</span><span class="sep">·</span>
      <span class="cur">影像</span>
    </div>
  </div>
  <div class="seal corner-seal-2">設</div>

  <div class="body">
    <div class="sidebar"></div>
    <div class="content"></div>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta">设定 · 内测版 〇·壹·〇 · 自动保存</div>
    <div class="prompts">
      <div class="prompt"><span class="key square">□</span>切换分类</div>
      <div class="prompt"><span class="key triangle">△</span>恢复默认</div>
      <div class="prompt"><span class="key cross">✕</span>保存</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
    </div>
  </footer>

  <div class="toast" aria-live="polite"></div>
</main>
