<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 武学 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.stage { background: linear-gradient(180deg, #0C0907 0%, #14110C 100%); }

.header {
  position: absolute; top: 0; left: 0; right: 0; height: 110px;
  display: flex; align-items: center; padding: 0 5vw;
  border-bottom: 1px solid var(--line);
}
.bc-kanji { font-size: clamp(40px, 4.2vw, 60px); font-weight: 900; letter-spacing: 0.2em; }
.bc-path  { margin-left: auto; display: flex; align-items: center; gap: 14px;
            font-family: var(--font-mono); font-size: 13px;
            color: var(--paper-dim); letter-spacing: 0.25em; }
.bc-path .sep { opacity: 0.4; }
.bc-path .cur { color: var(--zhusha-bright); }

.seal.corner-seal-2 {
  position: absolute; top: 38px; right: 5vw;
  width: 56px; height: 56px;
  font-size: 32px; transform: rotate(-3deg); z-index: 5;
}

.body {
  position: absolute; top: 110px; left: 0; right: 0; bottom: 72px;
  display: grid; grid-template-columns: 280px 1fr 360px;
}

.list {
  border-right: 1px solid var(--line);
  padding: 30px 0;
  background: rgba(0,0,0,0.28);
  overflow-y: auto;
}
.school {
  position: relative; display: flex; flex-direction: column;
  padding: 16px 36px; cursor: pointer;
  border-bottom: 1px solid var(--line);
  transition: background 0.18s ease;
}
.school:hover { background: rgba(237,223,194,0.04); }
.school.active {
  background: linear-gradient(90deg, rgba(184,58,28,0.13) 0%, transparent 100%);
}
.school.active::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background: var(--zhusha); box-shadow: 0 0 14px var(--zhusha-glow);
}
.school-name { font-size: 22px; letter-spacing: 0.4em; color: var(--paper-dim); }
.school.active .school-name { color: var(--paper); font-weight: 700; }
.school-tag  { margin-top: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--paper-mute); letter-spacing: 0.3em; }

.tree {
  padding: 36px 5vw; overflow-y: auto;
  background: radial-gradient(ellipse 60% 80% at 30% 30%, rgba(184,58,28,0.03), transparent 70%);
}
.tree-head { display:flex; align-items:baseline; gap:24px; margin-bottom:24px;
  padding-bottom:18px; border-bottom: 1px solid var(--line); }
.tree-title { font-size: 30px; font-weight: 700; letter-spacing: 0.22em; }
.tree-hint  { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--paper-mute); letter-spacing: 0.2em; }

.skill-row { display: flex; align-items: center; padding: 14px 0; gap: 24px;
  border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s ease; }
.skill-row:hover { background: rgba(237,223,194,0.03); }
.skill-row.active {
  background: linear-gradient(90deg, rgba(184,58,28,0.10) 0%, transparent 100%);
}
.skill-rune {
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-mid);
  font-family: var(--font-kai); font-size: 28px; font-weight: 900;
  color: var(--paper-2);
  background: rgba(0,0,0,0.4);
}
.skill-row.active .skill-rune { background: var(--zhusha); color: var(--paper); border-color: var(--zhusha); }
.skill-info { flex: 1; }
.skill-name { font-size: 18px; letter-spacing: 0.18em; color: var(--paper); }
.skill-desc { margin-top: 4px; font-size: 12px; color: var(--paper-mute); letter-spacing: 0.06em; line-height: 1.5; }
.skill-cost { font-family: var(--font-mono); font-size: 13px; color: var(--paper-dim); letter-spacing: 0.1em; }

.detail {
  border-left: 1px solid var(--line);
  padding: 36px 36px;
  background: rgba(0,0,0,0.30);
  overflow-y: auto;
}
.detail-title { font-size: 26px; letter-spacing: 0.22em; margin-bottom: 8px; }
.detail-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em; color: var(--zhusha-bright); }
.detail-divider { width:100%; height:1px; margin: 24px 0;
  background: linear-gradient(90deg, var(--zhusha), transparent);
  box-shadow: 0 0 6px var(--zhusha-glow); }
.detail-section + .detail-section { margin-top: 22px; }
.detail-section h4 { font-family: var(--font-kai); font-size: 14px; letter-spacing:0.3em; color: var(--paper-2); margin: 0 0 8px 0; font-weight: 500; }
.detail-section p  { font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--paper-dim); margin: 0; letter-spacing: 0.05em; }
.detail-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-top: 6px; }
.stat-row { display:flex; justify-content: space-between; align-items:baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.stat-name { font-size: 13px; color: var(--paper-dim); letter-spacing: 0.18em; }
.stat-val { font-family: var(--font-mono); color: var(--paper); }

@media (max-height: 720px) {
  .header { height: 84px; } .body { top: 84px; bottom: 60px; }
  .footer-bar { height: 60px; } .seal.corner-seal-2 { top: 22px; width: 44px; height: 44px; font-size: 26px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRSkills = {
  state: {
    activeSchoolId: "han_blade",
    activeSkillId: "han_basic",
    schools: [
      { id: "han_blade", name: "汉刀", tag: "环首 · 直刃" },
      { id: "qing_kung", name: "轻功", tag: "踏雪 · 拔身" },
      { id: "iron_qi",   name: "铁气", tag: "御身 · 拒伤" },
      { id: "wind_song", name: "风咏", tag: "感风 · 御风" }
    ],
    trees: {
      han_blade: {
        title: "汉刀 · 招式", hint: "三式 · 已学 二",
        skills: [
          { id:"han_basic", rune:"挥", name:"挥砍 · 基", cost:"〇 气", desc:"环首直刃，自上而下，朴而有力。" },
          { id:"han_storm", rune:"乱", name:"乱风斩",   cost:"二 气", desc:"低位横扫，破盾，可清扫两人。" },
          { id:"han_pierce",rune:"刺", name:"穿心刺",   cost:"三 气", desc:"前冲突刺，命中收尾时附带流血。" }
        ]
      },
      qing_kung: {
        title: "轻功 · 行身", hint: "二式",
        skills: [
          { id:"qk_step", rune:"踏", name:"踏雪步", cost:"一 气", desc:"短距瞬移，可越过陷阱。" },
          { id:"qk_pull", rune:"拔", name:"拔身术", cost:"二 气", desc:"高跳出墙，落地无损耗。" }
        ]
      },
      iron_qi: {
        title: "铁气 · 御身", hint: "二式",
        skills: [
          { id:"iq_skin", rune:"御", name:"铁皮诀",  cost:"一 气", desc:"短时间内大幅减伤。" },
          { id:"iq_root", rune:"根", name:"扎根法",  cost:"〇 气", desc:"格挡时不被击退，但移动减半。" }
        ]
      },
      wind_song: {
        title: "风咏 · 感应", hint: "一式 · 待解",
        skills: [
          { id:"ws_listen", rune:"聆", name:"聆风诀", cost:"〇 气", desc:"短暂显示半径内敌人位置与朝向。" }
        ]
      }
    },
    detail: {
      han_basic: {
        title: "挥砍 · 基", tag: "汉刀 · 入门",
        sections: [
          { h: "招式诀", p: "起手沉肩，刀下随气走。势出即收，不留余势。" },
          { h: "搭配", p: "与「拔身术」连接形成腾空斩。可承「乱风斩」收尾。" }
        ],
        stats: [
          { n:"伤害",   v:"38" },
          { n:"耗气",   v:"0" },
          { n:"出招",   v:"0.32 s" },
          { n:"硬直",   v:"0.18 s" }
        ]
      },
      han_storm: {
        title: "乱风斩", tag: "汉刀 · 中阶",
        sections: [{ h: "招式诀", p: "弯腰沉胯，腰带刀走，扫开两面。" }],
        stats: [{ n:"伤害", v:"60×2" }, { n:"耗气", v:"2" }, { n:"出招", v:"0.48 s" }, { n:"硬直", v:"0.32 s" }]
      },
      han_pierce: {
        title: "穿心刺", tag: "汉刀 · 待解",
        sections: [{ h: "招式诀", p: "突进直刺，留待解锁。" }],
        stats: [{ n:"伤害", v:"95" }, { n:"耗气", v:"3" }, { n:"出招", v:"0.55 s" }, { n:"硬直", v:"0.40 s" }]
      },
      qk_step: { title:"踏雪步", tag:"轻功", sections:[{h:"招式诀",p:"短距瞬移，越过陷阱。"}], stats:[{n:"距离",v:"4 m"},{n:"耗气",v:"1"},{n:"冷却",v:"2 s"}] },
      qk_pull: { title:"拔身术", tag:"轻功", sections:[{h:"招式诀",p:"高跳越墙，落地无损耗。"}], stats:[{n:"高度",v:"3 m"},{n:"耗气",v:"2"}] },
      iq_skin: { title:"铁皮诀", tag:"铁气", sections:[{h:"招式诀",p:"短时间大幅减伤。"}], stats:[{n:"减伤",v:"60%"},{n:"持续",v:"4 s"},{n:"耗气",v:"1"}] },
      iq_root: { title:"扎根法", tag:"铁气", sections:[{h:"招式诀",p:"格挡不被击退，但移动减半。"}], stats:[{n:"位移抗性",v:"100%"},{n:"移动",v:"-50%"}] },
      ws_listen: { title:"聆风诀", tag:"风咏 · 待解", sections:[{h:"招式诀",p:"显示半径内敌人位置。"}], stats:[{n:"半径",v:"12 m"},{n:"持续",v:"3 s"}] }
    }
  },

  setSchool(id) {
    if (!this.state.trees[id]) return;
    this.state.activeSchoolId = id;
    const firstSkill = this.state.trees[id].skills[0];
    if (firstSkill) this.state.activeSkillId = firstSkill.id;
    this.render();
  },
  setSkill(id) {
    if (!this.state.detail[id]) return;
    this.state.activeSkillId = id;
    this.renderTree(); this.renderDetail();
    SRBridge.send("skill-select", { schoolId: this.state.activeSchoolId, skillId: id });
  },
  cycleSchool(delta) {
    const list = this.state.schools;
    const idx = list.findIndex(s => s.id === this.state.activeSchoolId);
    this.setSchool(list[(idx + delta + list.length) % list.length].id);
  },
  back()  { SRBridge.back("startup-web-skills"); },

  renderList() {
    const list = document.querySelector(".list");
    list.innerHTML = "";
    this.state.schools.forEach(s => {
      const node = document.createElement("div");
      node.className = "school" + (s.id === this.state.activeSchoolId ? " active" : "");
      node.innerHTML = `<div class="school-name">${s.name}</div><div class="school-tag">${s.tag}</div>`;
      node.addEventListener("click", () => this.setSchool(s.id));
      list.appendChild(node);
    });
  },
  renderTree() {
    const tree = document.querySelector(".tree");
    tree.innerHTML = "";
    const data = this.state.trees[this.state.activeSchoolId];
    if (!data) return;
    const head = document.createElement("div");
    head.className = "tree-head";
    head.innerHTML = `<div class="tree-title">${data.title}</div><div class="tree-hint">${data.hint}</div>`;
    tree.appendChild(head);

    data.skills.forEach(skill => {
      const row = document.createElement("div");
      row.className = "skill-row" + (skill.id === this.state.activeSkillId ? " active" : "");
      row.innerHTML = `
        <div class="skill-rune">${skill.rune}</div>
        <div class="skill-info">
          <div class="skill-name">${skill.name}</div>
          <div class="skill-desc">${skill.desc || ""}</div>
        </div>
        <div class="skill-cost">${skill.cost || ""}</div>`;
      row.addEventListener("click", () => this.setSkill(skill.id));
      tree.appendChild(row);
    });
  },
  renderDetail() {
    const detail = document.querySelector(".detail");
    detail.innerHTML = "";
    const d = this.state.detail[this.state.activeSkillId];
    if (!d) return;
    const head = document.createElement("div");
    head.innerHTML = `<div class="detail-title">${d.title}</div><div class="detail-tag">${d.tag}</div><div class="detail-divider"></div>`;
    detail.appendChild(head);

    d.sections.forEach(sec => {
      const node = document.createElement("div");
      node.className = "detail-section";
      node.innerHTML = `<h4>${sec.h}</h4><p>${sec.p}</p>`;
      detail.appendChild(node);
    });
    if (d.stats && d.stats.length) {
      const stats = document.createElement("div");
      stats.className = "detail-section";
      stats.innerHTML = `<h4>诸数</h4><div class="detail-stats">` +
        d.stats.map(s => `<div class="stat-row"><span class="stat-name">${s.n}</span><span class="stat-val">${s.v}</span></div>`).join("") +
        `</div>`;
      detail.appendChild(stats);
    }
  },
  renderBreadcrumb() {
    const cur = this.state.schools.find(s => s.id === this.state.activeSchoolId);
    document.querySelector(".bc-path .cur").textContent = cur ? cur.name : "";
  },
  render() {
    this.renderList(); this.renderTree(); this.renderDetail(); this.renderBreadcrumb();
  }
};

ue.interface.setSkillsData = function(data) { /* future hook */ window.SRSkills.render(); };

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRSkills.back(); }
  else if (e.key === "Tab")  { e.preventDefault(); SRSkills.cycleSchool(e.shiftKey ? -1 : 1); }
  else if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); SRSkills.cycleSchool(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); SRSkills.cycleSchool(1); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRSkills.render();
  SRBridge.ready("startup-web-skills");
});
</script>
</head>
<body>
<main class="stage">
  <div class="header">
    <div class="bc-kanji">武學</div>
    <div class="bc-path"><span>主页</span><span class="sep">·</span><span>武学</span><span class="sep">·</span><span class="cur">汉刀</span></div>
  </div>
  <div class="seal corner-seal-2">武</div>

  <div class="body">
    <div class="list"></div>
    <div class="tree"></div>
    <div class="detail"></div>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta">武學 · DEV 预览 · 二〇二六</div>
    <div class="prompts">
      <div class="prompt"><span class="key square">□</span>切换流派</div>
      <div class="prompt"><span class="key cross">✕</span>选定</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
    </div>
  </footer>
</main>
</body>
</html>
