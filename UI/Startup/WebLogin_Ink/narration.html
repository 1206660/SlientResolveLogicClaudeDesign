<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 叙事字幕 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* SR Narration · SandboxStory 专属轻量字幕
 * 不走 SRDialogueRuntimeSubsystem snapshot；直接拿 setNarrationData 推 line。
 * 透明背景，3D viewport 透出来；玩家可走动（StoryDialogueCuePlayer 用
 * SummonWebUI bAllowGameplayInput=true 召出）。 */

:root {
  --nr-overlay-bg:    rgba(20, 17, 13, 0.78);
  --nr-fg:            #EDDFC2;
  --nr-fg-mute:       rgba(168, 153, 125, 0.82);
  --nr-border:        rgba(237, 223, 194, 0.22);
  --nr-primary:       #D85528;
  --nr-radius:        4px;
}

html, body { background: transparent !important; margin: 0; padding: 0; }
.stage    { background: transparent; position: fixed; inset: 0; pointer-events: none; }

.nr-overlay {
  position: fixed; inset: 0;
  font-family: var(--font-kai), 'STKaiti', KaiTi, '楷体', serif;
  color: var(--nr-fg);
  pointer-events: none;
}
.nr-overlay .panel,
.nr-overlay .speaker-badge,
.nr-overlay .choices,
.nr-overlay .advance-hint { pointer-events: auto; }

/* ---- speaker badge（底部字幕之上） ---- */
.speaker-badge {
  position: absolute;
  bottom: calc(13vh + 12px);
  left: 50%; transform: translateX(-50%);
  display: flex; align-items: baseline; gap: 14px;
  padding: 5px 18px;
  background: rgba(20, 17, 13, 0.42);
  border-left: 2px solid var(--nr-primary);
  border-radius: var(--nr-radius);
  z-index: 6;
}
.speaker-badge[data-empty="true"] { display: none; }
.speaker-badge .name {
  font-size: 17px; letter-spacing: 0.28em;
  color: var(--nr-fg);
}
.speaker-badge .index {
  font-family: var(--font-mono), 'JetBrains Mono', Consolas, monospace;
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--nr-primary);
}

/* ---- 字幕条 ---- */
.subtitle {
  position: absolute;
  bottom: 12vh; left: 50%; transform: translateX(-50%);
  width: min(900px, 70vw);
  padding: 18px 22px;
  background: var(--nr-overlay-bg);
  border: 1px solid var(--nr-border);
  border-radius: var(--nr-radius);
  z-index: 5;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 200ms ease;
}
.stage.has-line .subtitle { opacity: 1; }
.stage.choice-mode .subtitle { display: none; }

.subtitle .line {
  margin: 0;
  font-size: 20px; line-height: 1.7;
  letter-spacing: 0.08em;
  color: var(--nr-fg);
  min-height: 2em;
}
.subtitle .line .typed { display: inline-block; vertical-align: top; }
.subtitle .line .cursor {
  display: inline-block;
  width: 6px; height: 1em;
  margin-left: 4px;
  background: var(--nr-primary);
  vertical-align: text-bottom;
  opacity: 0.85;
  animation: nr-cursor 0.7s steps(2) infinite;
}
.subtitle .line.done .cursor { display: none; }
@keyframes nr-cursor { 0%,50% { opacity: 0.85 } 50.01%,100% { opacity: 0 } }

/* ---- choices ---- */
.choices {
  position: absolute;
  bottom: 18vh; left: 50%; transform: translateX(-50%);
  display: none;
  flex-direction: column;
  gap: 8px;
  width: min(720px, 60vw);
  z-index: 8;
}
.stage.choice-mode .choices { display: flex; }

.choice-btn {
  font-family: var(--font-kai); font-size: 17px;
  letter-spacing: 0.16em;
  color: var(--nr-fg);
  background: rgba(20, 17, 13, 0.78);
  border: 1px solid var(--nr-border);
  border-radius: var(--nr-radius);
  padding: 12px 22px;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}
.choice-btn:hover,
.choice-btn.is-selected {
  background: rgba(216, 85, 40, 0.16);
  border-color: var(--nr-primary);
}
.choice-btn:active { transform: translateY(1px); }
.choice-btn .index {
  font-family: var(--font-mono), monospace;
  font-size: 11px; letter-spacing: 0.3em;
  color: var(--nr-primary);
  margin-right: 14px;
}

/* ---- advance hint ---- */
.advance-hint {
  position: absolute;
  bottom: 7vh; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono), monospace;
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--nr-fg-mute);
  z-index: 4;
  opacity: 0;
  transition: opacity 200ms ease;
}
.stage.has-line .advance-hint { opacity: 0.85; }
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRNarration = {
  state: {
    speaker: "",
    text: "",
    lineIndex: 0,
    lineCount: 1,
    choices: [],
    selectedChoiceIdx: 0,
    typing: false,
    typedLen: 0,
    typeTimer: null,
    finishedSent: false
  },

  setData(data) {
    if (!data) return;
    this.state.speaker = data.speaker || "";
    this.state.text = data.text || "";
    this.state.lineIndex = data.lineIndex || 0;
    this.state.lineCount = data.lineCount || 1;
    this.state.choices = Array.isArray(data.choices) ? data.choices : [];
    this.state.finishedSent = false;
    this.render();
  },

  render() {
    const stage = document.querySelector(".stage");
    stage.classList.add("has-line");

    // speaker badge
    const badge = document.querySelector(".speaker-badge");
    if (this.state.speaker) {
      badge.removeAttribute("data-empty");
      badge.querySelector(".name").textContent = this.state.speaker;
      badge.querySelector(".index").textContent =
        (this.state.lineIndex + 1) + " / " + this.state.lineCount;
    } else {
      badge.setAttribute("data-empty", "true");
    }

    // typewriter
    if (this.state.typeTimer) { clearInterval(this.state.typeTimer); this.state.typeTimer = null; }
    const lineEl = document.querySelector(".subtitle .line");
    const typedEl = lineEl.querySelector(".typed");
    typedEl.textContent = "";
    lineEl.classList.remove("done");
    this.state.typing = true;
    this.state.typedLen = 0;
    const text = this.state.text;
    this.state.typeTimer = setInterval(() => {
      this.state.typedLen++;
      typedEl.textContent = text.slice(0, this.state.typedLen);
      if (this.state.typedLen >= text.length) {
        clearInterval(this.state.typeTimer);
        this.state.typeTimer = null;
        this.state.typing = false;
        lineEl.classList.add("done");
      }
    }, 36);

    // choices —— 当前 cue 的最后一行才显示选项
    const isLastLine = (this.state.lineIndex + 1 >= this.state.lineCount);
    if (isLastLine && this.state.choices.length > 0) {
      stage.classList.add("choice-mode");
      this.renderChoices();
    } else {
      stage.classList.remove("choice-mode");
    }
  },

  renderChoices() {
    const wrap = document.querySelector(".choices");
    wrap.innerHTML = "";
    this.state.selectedChoiceIdx = 0;
    this.state.choices.forEach((c, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn" + (i === 0 ? " is-selected" : "");
      btn.type = "button";
      btn.dataset.idx = String(i);
      btn.innerHTML = `<span class="index">${i + 1}</span>${c.text || c.id}`;
      btn.addEventListener("click", () => this.choose(c.id));
      btn.addEventListener("mouseenter", () => this.setSelected(i));
      wrap.appendChild(btn);
    });
  },

  setSelected(idx) {
    if (!this.state.choices.length) return;
    const n = this.state.choices.length;
    const next = ((idx % n) + n) % n;
    this.state.selectedChoiceIdx = next;
    document.querySelectorAll(".choice-btn").forEach((el) => {
      el.classList.toggle("is-selected", parseInt(el.dataset.idx, 10) === next);
    });
  },

  moveSelection(delta) {
    if (!this.state.choices.length) return;
    this.setSelected(this.state.selectedChoiceIdx + delta);
  },

  commitSelection() {
    const c = this.state.choices[this.state.selectedChoiceIdx];
    if (c) this.choose(c.id);
  },

  finishTyping() {
    if (!this.state.typing) return;
    if (this.state.typeTimer) { clearInterval(this.state.typeTimer); this.state.typeTimer = null; }
    document.querySelector(".subtitle .line .typed").textContent = this.state.text;
    document.querySelector(".subtitle .line").classList.add("done");
    this.state.typing = false;
  },

  advance() {
    if (this.state.finishedSent) return;
    if (this.state.typing) { this.finishTyping(); return; }
    const stage = document.querySelector(".stage");
    if (stage.classList.contains("choice-mode")) {
      // choice-mode 下 Enter 即"提交当前高亮选项"，不再静默吞掉
      this.commitSelection();
      return;
    }
    SRBridge.send("narration.advance", { lineIndex: this.state.lineIndex });
  },

  choose(choiceId) {
    if (this.state.finishedSent) return;
    this.state.finishedSent = true;
    SRBridge.send("narration.choice", { choiceId });
  },

  skip() {
    if (this.state.finishedSent) return;
    this.state.finishedSent = true;
    SRBridge.send("narration.skip", { lineIndex: this.state.lineIndex });
  }
};

ue.interface.setNarrationData = function(data) {
  window.SRNarration.setData(data);
};

window.addEventListener("keydown", (e) => {
  const inChoice = document.querySelector(".stage").classList.contains("choice-mode");
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); SRNarration.advance(); }
  else if (e.key === "Tab")               { e.preventDefault(); SRNarration.skip(); }
  else if (inChoice && (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "w" || e.key === "W")) {
    e.preventDefault(); SRNarration.moveSelection(-1);
  }
  else if (inChoice && (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "s" || e.key === "S")) {
    e.preventDefault(); SRNarration.moveSelection(+1);
  }
  else if (/^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const c = SRNarration.state.choices[idx];
    if (c) { e.preventDefault(); SRNarration.choose(c.id); }
  }
});

window.addEventListener("DOMContentLoaded", () => {
  SRBridge.ready("startup-web-narration");
});
</script>
</head>
<body>
<main class="stage">
  <div class="nr-overlay">
    <div class="speaker-badge" data-empty="true">
      <span class="name"></span>
      <span class="index"></span>
    </div>

    <section class="subtitle">
      <p class="line"><span class="typed"></span><span class="cursor"></span></p>
    </section>

    <div class="choices"></div>

    <div class="advance-hint">[Enter] 继续/选择 · [↑↓] 切换 · [1-9] 直选 · [Tab] 跳过</div>
  </div>
</main>
</body>
</html>
