<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 视频回放 · WebUI</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* SR Video · 全屏视频回放（trailer / 预渲染 cutscene）
 * 不像 dialogue/combat 那样透明，视频要遮住 3D viewport — opaque fullscreen。
 * SkipAllowed = true 时显示右上角"跳过 [Tab]" 提示。 */

html, body { background: #000 !important; margin: 0; padding: 0; overflow: hidden; }
.stage { background: #000; position: fixed; inset: 0; }

video.fullframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;       /* 保持视频原比例，黑边 letterbox 由 body 黑底兜底 */
  background: #000;
  outline: none;
}

.skip-hint {
  position: absolute; top: 24px; right: 32px;
  font-family: var(--font-mono, 'Courier New', monospace);
  font-size: 11px; letter-spacing: 0.3em;
  color: rgba(237, 223, 194, 0.55);
  padding: 6px 12px;
  border: 1px solid rgba(237, 223, 194, 0.18);
  background: rgba(0, 0, 0, 0.4);
  z-index: 10;
  opacity: 0;
  transition: opacity 600ms ease;
  pointer-events: none;
}
.stage.show-hint .skip-hint { opacity: 1; }

.fade-overlay {
  position: absolute; inset: 0;
  background: #000;
  opacity: 1;
  z-index: 20;
  pointer-events: none;
  transition: opacity var(--fade-in, 400ms) ease;
}
.stage.faded-in .fade-overlay { opacity: 0; }

.error-msg {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  color: #c66; font-family: var(--font-mono, monospace);
  font-size: 14px; padding: 16px 24px;
  background: rgba(0,0,0,0.6); border: 1px solid #c66;
  display: none;
  z-index: 15;
}
.stage.error .error-msg { display: block; }

/* DEV 诊断条 — CEF 没法 attach devtools，靠直接画屏看 codec 探针 + 事件链。
 * 播成功后 5s 自动淡出；播失败/超时一直显示。 */
.dev-diag {
  position: absolute; left: 12px; bottom: 12px;
  max-width: 60vw; padding: 8px 12px;
  font-family: var(--font-mono, 'Consolas', monospace);
  font-size: 11px; line-height: 1.5;
  color: #b9d8b9;
  background: rgba(0,0,0,0.62);
  border: 1px solid rgba(110, 199, 110, 0.35);
  border-radius: 3px;
  white-space: pre;
  z-index: 25;
  opacity: 0.85;
  transition: opacity 600ms ease;
  pointer-events: none;
}
.dev-diag.hidden { opacity: 0; }
.dev-diag .bad   { color: #d8693a; }
</style>
<script src="assets/ue-bridge.js"></script>
<script>
// DEV 诊断条 — 直接画到屏幕上，不依赖 CEF console。
function devDiagAppend(line, isBad) {
  const el = document.querySelector(".dev-diag");
  if (!el) return;
  const span = document.createElement("span");
  if (isBad) span.className = "bad";
  span.textContent = line + "\n";
  el.appendChild(span);
}
function devDiagFade() {
  const el = document.querySelector(".dev-diag");
  if (el) el.classList.add("hidden");
}

// 把 HTMLMediaElement.error.code + networkState 翻成可读字串，
// CEF 端 console + 屏幕 error-msg 都用得到。
function decodeMediaErr(video, jsErr) {
  if (!video) return jsErr ? (jsErr.message || String(jsErr)) : "(no video element)";
  const codes = { 1: "ABORTED", 2: "NETWORK", 3: "DECODE", 4: "SRC_NOT_SUPPORTED" };
  const netStates = { 0: "EMPTY", 1: "IDLE", 2: "LOADING", 3: "NO_SOURCE" };
  const e = video.error;
  const parts = [];
  if (e) parts.push("MediaError code=" + e.code + " (" + (codes[e.code] || "?") + ")"
                    + (e.message ? " msg='" + e.message + "'" : ""));
  parts.push("networkState=" + netStates[video.networkState] + " readyState=" + video.readyState);
  parts.push("src='" + (video.currentSrc || video.src || "") + "'");
  if (jsErr && jsErr.message) parts.push("jsErr=" + jsErr.message);
  return parts.join(" | ");
}

window.SRVideo = {
  state: {
    videoUrl: "",
    skipAllowed: true,
    fadeInSeconds: 0.4,
    fadeOutSeconds: 0.4,
    minDurationBeforeSkipSeconds: 0,
    startWallClock: 0,
    finishedSent: false
  },

  setData(data) {
    if (!data) return;
    // 关键：把所有"上一次 cue 留下的瞬时状态"全归零。CEF 实际表现是「同一个 widget 被
    // SummonWebUI("video") 反复 summon，page 不一定每次重新加载」，state-reuse 会让
    // finishedSent=true 残留 → onEnded 静默吞 → C++ 拿不到 finish → 13s safety timeout
    // 顶上来 → 表面就是"反反复复，刚才能放，现在又黑"。
    this.state.videoUrl = data.videoUrl || "";
    this.state.skipAllowed = data.skipAllowed !== false;
    this.state.fadeInSeconds = data.fadeInSeconds || 0.4;
    this.state.fadeOutSeconds = data.fadeOutSeconds || 0.4;
    this.state.minDurationBeforeSkipSeconds = data.minDurationBeforeSkipSeconds || 0;
    this.state.startWallClock = 0;
    this.state.finishedSent = false;
    // DOM 状态也要复位 —— faded-in / error / show-hint 都不能留
    const stage = document.querySelector(".stage");
    stage.classList.remove("faded-in", "error");
    stage.classList.toggle("show-hint", this.state.skipAllowed);
    stage.style.setProperty("--fade-in", this.state.fadeInSeconds + "s");
    document.querySelector(".error-msg").textContent = "";
    // dev-diag 也清空，避免上一次的事件链堆叠到新 cue 上
    const diag = document.querySelector(".dev-diag");
    if (diag) {
      diag.classList.remove("hidden");
      diag.innerHTML = "";
    }
    devDiagAppend("setData call #" + (++SRVideo._setDataCount));
    this.loadVideo();
  },

  _setDataCount: 0,

  loadVideo() {
    const video = document.querySelector("video.fullframe");
    if (!video) return;
    const url = this.state.videoUrl || "";
    if (!url) {
      this.showError("videoUrl 为空");
      return;
    }

    // 诊断 1：编码探针 — CEF 标准 build 不开 proprietary codecs：mp4/h264 返回 ""，webm/vp9/opus 应返回 "probably"。
    const probeMp4  = video.canPlayType("video/mp4; codecs=\"avc1.42E01E\"");
    const probeWebm = video.canPlayType("video/webm; codecs=\"vp9, opus\"");
    const resolved = new URL(url, document.baseURI).href;
    const head = "[SRVideo] mp4/h264=" + (probeMp4 || "<unsupported>")
               + " | webm/vp9=" + (probeWebm || "<unsupported>");
    console.log(head + " | url=" + url + " | resolved=" + resolved);
    devDiagAppend("url=" + url);
    devDiagAppend("mp4/h264=" + (probeMp4 || "<unsupported>"), !probeMp4);
    devDiagAppend("webm/vp9=" + (probeWebm || "<unsupported>"), !probeWebm);
    devDiagAppend("--");

    video.src = url;
    video.load();

    const onStarted = () => {
      this.state.startWallClock = performance.now() / 1000;
      console.log("[SRVideo] play started, fading in");
      devDiagAppend("play started ✓");
      setTimeout(devDiagFade, 5000);
      requestAnimationFrame(() => {
        document.querySelector(".stage").classList.add("faded-in");
      });
    };

    // 优先有声 autoplay；CEF 若拦截无手势 unmuted 播放则降级为 muted。
    // 任意 play 失败都得告知 C++ 完成 cue，否则 beat 卡死等 safety timeout（典型表现：黑屏几秒后突然恢复）。
    const failFinish = (msg) => {
      this.showError(msg);
      if (this.state.finishedSent) return;
      this.state.finishedSent = true;
      SRBridge.send("video.finish", { reason: "error" });
    };
    let started = false;
    const onStartedOnce = () => { started = true; onStarted(); };
    video.play().then(onStartedOnce).catch((err) => {
      const policyBlocked = err && (err.name === "NotAllowedError" || /user/i.test(err.message || ""));
      if (policyBlocked) {
        devDiagAppend("autoplay blocked → retry muted", true);
        video.muted = true;
        video.play().then(onStartedOnce).catch((err2) => {
          failFinish("muted autoplay 也失败：" + decodeMediaErr(video, err2));
        });
      } else {
        failFinish("video.play 失败：" + decodeMediaErr(video, err));
      }
    });
    // 看门狗：play() 调了但 2s 内 onStarted 没 fire — 把当时 video 状态打到屏上，
    // 至少知道是 promise 挂住了还是 onStarted 那段同步代码挂了。
    setTimeout(() => {
      if (!started && !this.state.finishedSent) {
        devDiagAppend("WATCHDOG: 2s 后未启动 — " + decodeMediaErr(video, null), true);
      }
    }, 2000);
  },

  onEnded() {
    if (this.state.finishedSent) return;
    this.state.finishedSent = true;
    SRBridge.send("video.finish", { reason: "ended" });
  },

  onError() {
    const video = document.querySelector("video.fullframe");
    this.showError("video 元素 error: " + decodeMediaErr(video, null));
    if (this.state.finishedSent) return;
    this.state.finishedSent = true;
    // 发 finish 让游戏不卡 beat — reason 区分用
    SRBridge.send("video.finish", { reason: "error" });
  },

  showError(msg) {
    const stage = document.querySelector(".stage");
    stage.classList.add("error");
    document.querySelector(".error-msg").textContent = msg;
  },

  trySkip() {
    if (!this.state.skipAllowed) return;
    const elapsed = performance.now() / 1000 - this.state.startWallClock;
    if (elapsed < (this.state.minDurationBeforeSkipSeconds || 0)) return;
    if (this.state.finishedSent) return;
    this.state.finishedSent = true;
    SRBridge.send("video.finish", { reason: "skip" });
  }
};

ue.interface.setVideoData = function(data) {
  window.SRVideo.setData(data);
};

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Tab" || e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    SRVideo.trySkip();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  const video = document.querySelector("video.fullframe");
  video.addEventListener("ended", () => SRVideo.onEnded());
  video.addEventListener("error", () => SRVideo.onError());
  // 诊断事件链：loadstart → loadedmetadata → loadeddata → canplay → playing → ended
  // 哪一步停下来就是哪一步出问题。屏幕诊断条 + console 都打。
  ["loadstart", "loadedmetadata", "loadeddata", "canplay", "canplaythrough", "playing", "stalled", "suspend"].forEach((ev) => {
    video.addEventListener(ev, () => {
      const line = ev + " r=" + video.readyState + " n=" + video.networkState;
      console.log("[SRVideo] " + line);
      devDiagAppend(line);
    });
  });
  SRBridge.ready("startup-web-video");
});
</script>
</head>
<body>
<main class="stage">
  <video class="fullframe" playsinline preload="auto"></video>
  <div class="fade-overlay"></div>
  <div class="skip-hint">跳过 [Tab]</div>
  <div class="error-msg"></div>
  <div class="dev-diag"></div>
</main>
</body>
</html>
