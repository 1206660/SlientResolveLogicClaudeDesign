<style>
/* === Ink Reference · 冷白宣纸 / 黑墨剑痕 / 留白 =========================

 * 协议契约不变：.profile/.save-hint/.title-wrap/.menu 等 selector 与 SRLogin 保留。

    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='17'/><feColorMatrix values='0 0 0 0 0.63 0 0 0 0 0.68 0 0 0 0 0.74 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
    linear-gradient(180deg, #F2F6FB 0%, #EAF0F7 42%, #DDE6EF 100%);
}
.stage::before {
  content: "";
  position: absolute; inset: 0;

    radial-gradient(circle 1.2px at 8% 20%, rgba(255,255,255,0.86), transparent 72%),

    radial-gradient(circle 1.2px at 74% 92%, rgba(255,255,255,0.82), transparent 72%),

}
.stage::after {
  content: "";

    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 420' preserveAspectRatio='none'><path d='M0 330 C160 270 260 355 410 300 C520 260 640 350 790 300 C940 245 1030 345 1200 292 C1370 240 1480 335 1600 278 L1600 420 L0 420 Z' fill='%233A4146' opacity='.36'/><path d='M370 310 C445 265 512 285 610 250 C548 316 470 333 370 310 Z' fill='%231D2225' opacity='.32'/><path d='M0 405 C250 360 460 393 700 350 C980 302 1210 388 1600 330 L1600 420 L0 420 Z' fill='%23080A0B' opacity='.22'/><path d='M92 382 L130 338 L170 382 Z M111 365 L111 420 L124 420 L124 365 Z' fill='%23080A0B' opacity='.28'/></svg>");
  filter: blur(0.1px);
}
.mountains, .moon, .hero { display: none; }
.vignette {
  position:absolute; inset:0; pointer-events:none; z-index:4;
  background:
    radial-gradient(ellipse 74% 80% at 50% 44%, transparent 48%, rgba(138,154,168,0.22) 100%),

.ink-birds {
  position:absolute; top:6vh; left:50%; width:430px; height:92px; transform:translateX(-50%); z-index:6; pointer-events:none; opacity:.42;
}
.ink-birds i { position:absolute; width:54px; height:20px; }
.ink-birds i::before, .ink-birds i::after {
  content:""; position:absolute; top:10px; width:30px; height:10px;
  border-top:4px solid rgba(25,31,35,.45); border-radius:50% 50% 0 0;

/* PS5 / shadcn-grade polish: clear focus rings, tighter safe-area placement,
 * tactile component states, but no style drift away from cold ink reference. */

<script src="assets/ue-bridge.js"></script>
<script>

window.SRLogin = {
  data: {
    playerName: "風行客",
    playerStatus: "在线 · 已游 12 时",
    saveTag: "续旅",
    saveWhere: "第三幕 · 山村回忆 · 灵儿戏水",
    saveTime: "二〇二六/四/二四 · 廿二时四一分 · 自动存档",
    titleMain: "一介",
    titleSub: "寒土孤山",
    tagline: "凡人的宁静 · 时代的碾碎",
    footer: "一介 · 寒土孤山 · 内测版 〇·壹·〇 · 二〇二六",
    selectedIndex: 0,
    options: [
      { optionId: "ContinueJourney", label: "继续旅途", hint: "第三幕 · 山村回忆", enabled: true },
      { optionId: "NewBeginning", label: "新的开始", hint: "从寒土孤山重新起程", enabled: true },
      { optionId: "LoadSave", label: "载入存档", hint: "查看可用回忆节点", enabled: true },
      { optionId: "Settings", label: "设定", hint: "画面 · 声音 · 操作", enabled: true },
      { optionId: "Quit", label: "退出", hint: "离开游戏", enabled: true }
    ]
  },
  setData(data) {
    this.data = Object.assign({}, this.data, data || {});
    this.render();
  },
  setSelection(index) {
    const count = this.data.options.length;
    if (!count) return;
    let next = (index + count) % count;
    for (let i = 0; i < count; i++) {
      const option = this.data.options[next];
      if (!option || option.enabled !== false) {
        // 关键：选中项没变化就直接返回，否则鼠标 hover 期间会无限重建 DOM，
        // 导致 mousedown/mouseup 落在不同 element 上，click 永远不合成。
        if (this.data.selectedIndex === next) return;
        this.data.selectedIndex = next;
        this.renderMenu();
        return;
      }
      next = (next + 1) % count;
    }
  },
  moveUp() {
    this.setSelection(this.data.selectedIndex - 1);
  },
  moveDown() {
    this.setSelection(this.data.selectedIndex + 1);
  },
  commit() {
    const option = this.data.options[this.data.selectedIndex];
    if (!option || option.enabled === false) return;
    if (option.optionId === "Quit") {
      this.openQuitModal();
      return;
    }
    ue5("commit", { optionId: option.optionId, label: option.label });
  },
  back() {
    if (this.modalOpen()) { this.closeQuitModal(); return; }
    this.openQuitModal();
  },
  modalOpen() {
    return document.querySelector(".modal-mask").classList.contains("show");
  },
  openQuitModal() {
    document.querySelector(".modal-mask").classList.add("show");
  },
  closeQuitModal() {
    document.querySelector(".modal-mask").classList.remove("show");
  },
  confirmQuit() {
    ue5("commit", { optionId: "Quit", label: "退出" });
  },
  render() {
    document.querySelector(".profile-name").textContent = this.data.playerName;
    document.querySelector(".profile-tag").textContent = this.data.playerStatus;
    document.querySelector(".save-tag").textContent = this.data.saveTag;
    document.querySelector(".save-where").textContent = this.data.saveWhere;
    document.querySelector(".save-time").textContent = this.data.saveTime;
    document.querySelector(".title-main").textContent = this.data.titleMain;
    document.querySelector(".title-sub").textContent = this.data.titleSub;
    document.querySelector(".title-tagline").textContent = this.data.tagline;
    document.querySelector(".footer-meta").textContent = this.data.footer;
    this.renderMenu();
  },
  renderMenu() {
    const menu = document.querySelector(".menu");
    menu.innerHTML = "";
    let activeNode = null;
    this.data.options.forEach((option, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "menu-item" + (index === this.data.selectedIndex ? " active" : "");
      button.disabled = option.enabled === false;
      button.innerHTML = `${option.label}${option.hint ? `<small>${option.hint}</small>` : ""}`;
      button.addEventListener("mouseenter", () => this.setSelection(index));
      button.addEventListener("click", () => {
        this.setSelection(index);
        this.commit();
      });
      menu.appendChild(button);
      if (index === this.data.selectedIndex) activeNode = button;
    });
    if (activeNode && typeof activeNode.scrollIntoView === "function") {
      activeNode.scrollIntoView({ block: "nearest" });
    }
  }
};

ue.interface.setStartupData = function(data) {
  window.SRLogin.setData(data);
};

window.addEventListener("keydown", (event) => {
  if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") {
    event.preventDefault();
    window.SRLogin.moveUp();
  } else if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") {
    event.preventDefault();
    window.SRLogin.moveDown();
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    window.SRLogin.commit();
  } else if (event.key === "Escape" || event.key === "Backspace") {
    event.preventDefault();
    window.SRLogin.back();
  }
});

/* ----- 冷白飞雪 / 淡墨颗粒：沿用 leaf 容器，视觉上不再是红叶 ----- */
const SR_LEAF_SVG = `<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="2.4" fill="#F8FBFF" opacity="0.88"/><circle cx="7" cy="9" r="3.8" fill="#2A3238" opacity="0.16"/></svg>`;

function srSpawnLeaves(count) {
  const layer = document.querySelector(".leaves");
  if (!layer) return;
  layer.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    const left      = (i + 0.5) * (100 / count) + (Math.random() - 0.5) * 4;
    const fallDur   = 9 + Math.random() * 11;       /* 9–20s */
    const fallDelay = -Math.random() * fallDur;
    const swayDur   = 2.6 + Math.random() * 2.8;    /* 2.6–5.4s 摆动周期 */
    const swayDelay = -Math.random() * swayDur;     /* 让正弦相位散开 */
    const spinDur   = 5 + Math.random() * 7;        /* 5–12s 一周自转 */
    const scale     = 0.55 + Math.random() * 1.15;  /* 0.55–1.70 */
    const sway      = 18 + Math.random() * 36;      /* 18–54px 横摆 */
    const rot       = Math.random() * 360;
    leaf.style.left = `${left}%`;
    leaf.style.setProperty("--fall-dur",   `${fallDur.toFixed(2)}s`);
    leaf.style.setProperty("--fall-delay", `${fallDelay.toFixed(2)}s`);
    leaf.style.setProperty("--sway-dur",   `${swayDur.toFixed(2)}s`);
    leaf.style.setProperty("--sway-delay", `${swayDelay.toFixed(2)}s`);
    leaf.style.setProperty("--spin-dur",   `${spinDur.toFixed(2)}s`);
    leaf.style.setProperty("--leaf-scale", scale.toFixed(2));
    leaf.style.setProperty("--sway",       `${sway.toFixed(1)}px`);
    leaf.style.setProperty("--rot-from",   `${rot.toFixed(0)}deg`);
    leaf.innerHTML = `<div class="leaf-sway"><div class="leaf-spin">${SR_LEAF_SVG}</div></div>`;
    frag.appendChild(leaf);
  }
  layer.appendChild(frag);
}

window.addEventListener("DOMContentLoaded", () => {
  srSpawnLeaves(22);
  if (window.SRPerfHud && !SRPerfHud.isVisible()) SRPerfHud.toggle(); /* 帧率默认开 */
  window.SRLogin.render();
  ue5("ready", { surface: "startup-web-login" });
});
</script>
</head>
<body>
<main class="stage">
  <div class="ink-birds" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="leaves" aria-hidden="true"></div>

  <section class="profile" aria-label="玩家档案">
    <div class="avatar">風</div>
    <div>
      <div class="profile-name"></div>
      <div class="profile-tag"></div>
    </div>
  </section>

  <section class="save-hint" aria-label="最近存档">
    <div class="save-tag"></div>
    <div class="save-where"></div>
    <div class="save-time"></div>
  </section>

  <section class="title-wrap" aria-label="标题">
    <div class="title-main"></div>
    <div class="title-sub"></div>
    <div class="title-divider"></div>
    <div class="title-tagline"></div>
  </section>

  <div class="seal corner-seal">一介印</div>
  <nav class="menu" aria-label="主菜单"></nav>

  <footer class="footer-bar">
    <div class="footer-meta"></div>
    <div class="prompts">
      <div class="prompt"><span class="key cross">✕</span>确认</div>
      <div class="prompt"><span class="key circle">○</span>返回</div>
      <div class="prompt"><span class="key triangle">△</span>阅览</div>
    </div>
  </footer>

  <div class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
    <div class="modal">
      <div class="modal-title" id="quitTitle">暂离寒山？</div>
      <div class="modal-body">雪声未停，墨迹已干。自动存档会保留此刻。</div>
      <div class="modal-actions">
        <button class="modal-btn" type="button" onclick="window.SRLogin.closeQuitModal()">留 下</button>
        <button class="modal-btn danger" type="button" onclick="window.SRLogin.confirmQuit()">离 开</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
