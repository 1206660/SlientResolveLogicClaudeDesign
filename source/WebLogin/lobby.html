<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 前堂 · 水墨军帐</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* === 水墨 · 中军大帐 前堂总览 ============================================
 * 布局完全重构：
 *   - 朱漆门额「前堂」+ 锯齿帐幕飘带
 *   - 三组改为军旗章节头（旗杆顶端金钉 + 〚〛装饰 + count 印章）
 *   - 卡片重构为虎符牌（顶部铜钉条 + 朱印 glyph 方块 + name + CN
 *     + 朱砂左边 desc 块 + 底部 keys + 角落"令"字暗刻）
 *   - hover/active 加朱砂红光晕 + 上浮，glyph 朱印颜色加深
 *   - footer 沿用水墨木轴风格
 * SRLobby 命名空间、setLobbyData、SRBridge.send("nav", ...) 协议层不变。
 * ============================================================================ */

.stage {
  background:
    radial-gradient(ellipse 60% 35% at 50% 25%, rgba(184, 58, 28, 0.10) 0%, transparent 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='p'><feTurbulence baseFrequency='0.014 0.04' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.14  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
    linear-gradient(180deg, #1A0F06 0%, #2A1B0E 50%, #3A2616 100%);
}

/* === 顶部朱漆门额 ======================================================= */
.header {
  position: absolute; top: 0; left: 0; right: 0;
  height: 124px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 calc(5vw + 80px) 0 6vw;
  background:
    repeating-linear-gradient(0deg,
      rgba(0, 0, 0, 0.06) 0px, rgba(0, 0, 0, 0.06) 1px,
      transparent 1px, transparent 5px),
    linear-gradient(180deg, #2A1B0E 0%, var(--zhusha-deep) 30%, #6A1A08 50%, var(--zhusha-deep) 70%, #2A1B0E 100%);
  border-bottom: 4px solid #2A1B0E;
  box-shadow:
    0 6px 18px rgba(0, 0, 0, 0.6),
    inset 0 0 0 2px rgba(220, 184, 122, 0.18);
  z-index: 6;
}
.header::before, .header::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px;
  height: 4px;
  background:
    radial-gradient(circle 2px at 5% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2px at 25% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2px at 50% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2px at 75% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2px at 95% 50%, #BC8F3A, transparent 55%);
}
.header::before { top: 6px; }
.header::after  { bottom: 8px; }

.bc-kanji {
  font-family: var(--font-kai);
  font-size: clamp(36px, 4.0vw, 56px);
  font-weight: 900;
  letter-spacing: 0.4em;
  padding-left: 0.4em;
  color: var(--paper);
  text-shadow:
    0 0 14px rgba(255, 220, 170, 0.5),
    0 3px 6px rgba(0, 0, 0, 0.7);
  position: relative;
  z-index: 2;
}
.bc-tag {
  font-family: var(--font-kai);
  font-size: 12px;
  letter-spacing: 0.32em;
  padding: 4px 12px;
  background:
    repeating-linear-gradient(0deg,
      rgba(76, 52, 28, 0.18) 0px, rgba(76, 52, 28, 0.18) 1px,
      transparent 1px, transparent 4px),
    linear-gradient(180deg, #C99566 0%, #A07546 100%);
  border-left: 3px solid #4A2E16;
  border-right: 3px solid #4A2E16;
  color: #2A1B0E;
  font-weight: 900;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
}
.bc-hint {
  margin-left: auto;
  font-family: var(--font-kai);
  font-size: 14px;
  letter-spacing: 0.22em;
  color: rgba(255, 222, 170, 0.85);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
}

.seal.corner-seal-2 {
  position: absolute;
  top: 30px; right: 5vw;
  width: 64px; height: 64px;
  font-size: 30px;
  background: var(--zhusha);
  border: 3px solid #2A1B0E;
  border-radius: 0;
  color: var(--paper);
  font-family: var(--font-kai);
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-5deg);
  z-index: 9;
  box-shadow:
    inset 0 0 0 3px rgba(255, 222, 170, 0.22),
    inset 0 0 12px rgba(0, 0, 0, 0.4),
    0 6px 16px rgba(0, 0, 0, 0.5),
    0 0 18px var(--zhusha-glow);
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.55);
}

/* === 帐幕飘带（header 下方锯齿） ======================================= */
.tent-drape {
  position: absolute;
  top: 124px;
  left: 0; right: 0;
  height: 22px;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(180deg, var(--zhusha-deep) 0%, transparent 100%);
  clip-path: polygon(
    0 0, 5% 100%, 10% 0, 15% 100%, 20% 0, 25% 100%, 30% 0,
    35% 100%, 40% 0, 45% 100%, 50% 0, 55% 100%, 60% 0,
    65% 100%, 70% 0, 75% 100%, 80% 0, 85% 100%, 90% 0,
    95% 100%, 100% 0
  );
}

/* === 主体 ============================================================== */
.body {
  position: absolute;
  top: 146px; left: 0; right: 0; bottom: 72px;
  padding: 32px 5vw;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(220, 184, 122, 0.25) transparent;
}
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-thumb { background: rgba(220, 184, 122, 0.25); }

/* === 单组 = 军旗章节头 + 卡阵 ========================================== */
.group + .group { margin-top: 36px; }
.group-title {
  display: flex; align-items: baseline; gap: 14px;
  margin-bottom: 18px;
  padding: 10px 18px 10px 22px;
  background: linear-gradient(90deg, rgba(184, 58, 28, 0.32) 0%, rgba(40, 24, 12, 0.55) 100%);
  border-left: 6px solid var(--zhusha);
  border-bottom: 1px solid rgba(220, 184, 122, 0.25);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  position: relative;
}
.group-title::before {
  /* 军旗左侧"旗杆顶端"金钉 */
  content: "";
  position: absolute;
  left: -14px; top: 50%;
  width: 8px; height: 8px;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(220, 184, 122, 0.7);
  transform: translateY(-50%) rotate(45deg);
}
.group-title h2 {
  font-family: var(--font-kai);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 0.4em;
  padding-left: 0.4em;
  color: var(--paper);
  margin: 0;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
.group-title h2::before { content: "〚 "; color: var(--zhusha-bright); font-weight: 400; }
.group-title h2::after  { content: " 〛"; color: var(--zhusha-bright); font-weight: 400; }

.group-title .count {
  font-family: var(--font-kai);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: rgba(255, 222, 170, 0.7);
  margin-left: auto;
  padding: 2px 10px;
  border: 1px solid rgba(220, 184, 122, 0.3);
  background: rgba(0, 0, 0, 0.25);
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}

/* === 单卡 = 虎符牌 ===================================================== */
.card {
  position: relative;
  display: flex; flex-direction: column;
  gap: 10px;
  padding: 18px 18px 16px;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(184, 58, 28, 0.10), transparent 70%),
    linear-gradient(180deg, #3A2614 0%, #2A1B0E 60%, #1A1108 100%);
  border: 2px solid #6E4824;
  border-radius: 2px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.18s cubic-bezier(0.3, 0.9, 0.4, 1),
              border-color 0.18s ease,
              box-shadow 0.18s ease,
              background 0.18s ease;
  box-shadow:
    inset 0 0 0 1px rgba(220, 184, 122, 0.22),
    0 4px 10px rgba(0, 0, 0, 0.5);
}
.card::before {
  /* 顶部铜钉条 */
  content: "";
  position: absolute;
  top: 4px; left: 8px; right: 8px;
  height: 3px;
  background:
    radial-gradient(circle 1.5px at 12% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 50% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 88% 50%, #BC8F3A, transparent 55%);
}
.card::after {
  /* 角落"令"字暗刻 */
  content: "令";
  position: absolute;
  bottom: 4px; right: 10px;
  font-family: var(--font-kai);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(220, 184, 122, 0.32);
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(220, 184, 122, 0.55);
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(184, 58, 28, 0.18), transparent 70%),
    linear-gradient(180deg, #4A3018 0%, #3A2614 60%, #2A1B0E 100%);
  box-shadow:
    inset 0 0 0 1px rgba(220, 184, 122, 0.32),
    0 8px 18px rgba(0, 0, 0, 0.55);
}
.card:hover .card-glyph {
  background: linear-gradient(180deg, var(--zhusha-bright), var(--zhusha));
  color: var(--paper);
}
.card.active {
  transform: translateY(-4px);
  border-color: var(--zhusha-bright);
  background:
    radial-gradient(ellipse 90% 50% at 50% 0%, rgba(184, 58, 28, 0.30), transparent 70%),
    linear-gradient(180deg, #5C3318 0%, #3A2614 60%, #2A1B0E 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 222, 170, 0.45),
    0 0 22px var(--zhusha-glow),
    0 8px 20px rgba(0, 0, 0, 0.55);
}
.card.active .card-glyph {
  background: linear-gradient(180deg, var(--zhusha-bright), var(--zhusha-deep));
  color: var(--paper);
  box-shadow:
    inset 0 0 0 1px rgba(255, 222, 170, 0.45),
    0 0 16px var(--zhusha-glow);
}
.card:active { transform: translateY(0); }

.card-row {
  display: flex; align-items: stretch; gap: 14px;
  padding-top: 6px;
}

.card-glyph {
  flex: 0 0 56px;
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-kai);
  font-size: 32px;
  font-weight: 900;
  color: var(--paper);
  background: linear-gradient(180deg, var(--zhusha-deep), #6A1A08);
  border: 2px solid #2A1B0E;
  border-radius: 0;
  box-shadow:
    inset 0 0 0 1px rgba(255, 222, 170, 0.32),
    inset 0 0 8px rgba(0, 0, 0, 0.4),
    0 4px 8px rgba(0, 0, 0, 0.4);
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.55);
  transition: background 0.18s ease;
}

.card-meta { flex: 1; min-width: 0; }
.card-name {
  font-family: var(--font-kai);
  font-size: 20px;
  letter-spacing: 0.28em;
  padding-left: 0.28em;
  color: var(--paper);
  margin-bottom: 4px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
.card-cn {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  color: rgba(220, 184, 122, 0.55);
}

.card-desc {
  margin-top: 8px;
  padding: 10px 12px;
  font-family: var(--font-kai);
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: 0.06em;
  color: var(--paper-2);
  background: rgba(0, 0, 0, 0.32);
  border-left: 2px solid var(--zhusha);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-keys {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 4px;
}
.card-key {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.25em;
  padding: 3px 9px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(220, 184, 122, 0.25);
  color: var(--paper-dim);
  border-radius: 2px;
}
.card-key.primary {
  border-color: var(--zhusha-bright);
  color: var(--paper);
  background: linear-gradient(180deg, rgba(184, 58, 28, 0.5), rgba(122, 28, 12, 0.6));
  box-shadow: 0 0 8px var(--zhusha-glow);
  font-weight: 700;
}

/* === 底部 footer = 木轴 + 军令传承条 =================================== */
.footer-bar {
  background:
    linear-gradient(180deg,
      transparent 0%, rgba(0, 0, 0, 0.4) 30%,
      #2C1A0A 50%, #4A2E16 65%, #6E4824 78%, #4A2E16 92%, #2C1A0A 100%);
  border-top: 1px solid rgba(110, 72, 36, 0.6);
  box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.5);
  height: 56px;
  pointer-events: none;
}
.footer-bar > * { pointer-events: auto; }
.footer-meta {
  font-family: var(--font-kai);
  color: var(--paper-2);
  font-size: 12px;
  letter-spacing: 0.4em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
.footer-meta::before { content: "❖ "; color: var(--zhusha-bright); }
.prompts {
  display: flex; align-items: center; gap: 22px;
}
.prompt {
  display: flex; align-items: center; gap: 8px;
  color: var(--paper-2);
  font-family: var(--font-kai);
  font-size: 13px;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
.key {
  width: 26px; height: 26px;
  border: 1.5px solid;
  border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(20, 12, 6, 0.7), rgba(0, 0, 0, 0.5));
  font-family: Arial, sans-serif;
  font-size: 13px; font-weight: 700;
}
.key.cross    { color: #DCC288; border-color: #BC8F3A; }
.key.circle   { color: var(--zhusha-bright); border-color: var(--zhusha); }
.key.triangle { color: #7A8E5C; border-color: #4A6B3F; }
.key.square   { color: #C99566; border-color: #6E4824; border-radius: 2px; }

@media (max-height: 720px) {
  .header { height: 96px; }
  .body { top: 116px; bottom: 60px; padding: 22px 4vw; }
  .footer-bar { height: 60px; }
  .seal.corner-seal-2 { width: 50px; height: 50px; font-size: 26px; }
  .tent-drape { top: 96px; height: 18px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
  .group-title { padding: 8px 16px 8px 18px; }
  .group-title h2 { font-size: 19px; }
  .card { padding: 14px 14px 12px; }
  .card-glyph { width: 48px; height: 48px; font-size: 28px; }
  .card-name { font-size: 18px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRLobby = {
  state: {
    activeId: "login",
    groups: [
      { id: "title", name: "标题与流程", cards: [
        { id: "login",     glyph: "介", name: "标题",   cn: "LOGIN",     key: "H",
          desc: "标题画面 / 主菜单 / 退出确认 modal" },
        { id: "load",      glyph: "载", name: "载入存档", cn: "LOAD",      key: "",
          desc: "存档槽列表 · 自动 / 壹 / 貳 / 空槽" },
        { id: "settings",  glyph: "設", name: "设定",   cn: "SETTINGS",  key: "P",
          desc: "六分类配置：影像 / 音聲 / 操控 / 玩法 / 輔助 / 帳號 — 落盘自动保存" },
        { id: "pause",     glyph: "暫", name: "暂停",   cn: "PAUSE",     key: "",
          desc: "局中暂停面板：继续 / 设定 / 返回标题 / 退出" }
      ]},
      { id: "world", name: "人物与世界", cards: [
        { id: "profile",   glyph: "己", name: "人物",   cn: "PROFILE",   key: "U",
          desc: "立绘 · 属相 · 佩物 · 气脉雷达 · 行迹" },
        { id: "skills",    glyph: "武", name: "武学",   cn: "SKILLS",    key: "L",
          desc: "流派 · 招式 · 详情；汉刀流 / 轻功 / 铁气 / 风咏" },
        { id: "inventory", glyph: "囊", name: "行囊",   cn: "INVENTORY", key: "I",
          desc: "六分类标签 · 网格 · 详情面板；方向键导航" },
        { id: "journal",   glyph: "錄", name: "行錄",   cn: "JOURNAL",   key: "J",
          desc: "任务列表 + 残卷叙事 + 时间线" },
        { id: "map",       glyph: "圖", name: "世界图", cn: "MAP",       key: "M",
          desc: "上帝视角 · 地标 · 传送 · 当前位脉动" },
        { id: "codex",     glyph: "典", name: "典故",   cn: "CODEX",     key: "X",
          desc: "人物 / 地名 / 器物 / 典故 / 宗派；未读自动「新」" }
      ]},
      { id: "scene", name: "战斗与叙事", cards: [
        { id: "combat",    glyph: "战", name: "战斗 HUD", cn: "COMBAT",   key: "",
          desc: "命气势条 · 装备轮盘 · 风向 · 任务条 · 破挡化提示" },
        { id: "dialogue",  glyph: "白", name: "念白",   cn: "DIALOGUE",  key: "K",
          desc: "对话推进 + 打字机 + 三选一抉择" },
        { id: "cinematic", glyph: "幕", name: "剧情演绎", cn: "CINEMATIC", key: "",
          desc: "letterbox + 字幕逐字 + 跳过/重演" }
      ]}
    ]
  },

  setActive(id) {
    if (!this.allCards().some(c => c.id === id)) return;
    this.state.activeId = id;
    this.renderCards();
  },
  cycle(delta) {
    const list = this.allCards();
    const idx = list.findIndex(c => c.id === this.state.activeId);
    this.setActive(list[(idx + delta + list.length) % list.length].id);
  },
  enter() {
    SRBridge.send("nav", { to: this.state.activeId });
  },
  back() { SRBridge.back("startup-web-lobby"); },

  allCards() {
    return [].concat(...this.state.groups.map(g => g.cards));
  },

  renderCards() {
    const wrap = document.querySelector(".lobby-groups");
    wrap.innerHTML = "";
    this.state.groups.forEach(group => {
      const groupEl = document.createElement("section");
      groupEl.className = "group";
      groupEl.innerHTML = `
        <div class="group-title">
          <h2>${group.name}</h2>
          <span class="count">${group.cards.length} 张</span>
        </div>
        <div class="cards"></div>`;
      const cardsEl = groupEl.querySelector(".cards");
      group.cards.forEach(card => {
        const node = document.createElement("div");
        node.className = "card" + (card.id === this.state.activeId ? " active" : "");
        node.innerHTML = `
          <div class="card-row">
            <div class="card-glyph">${card.glyph}</div>
            <div class="card-meta">
              <div class="card-name">${card.name}</div>
              <div class="card-cn">${card.cn}</div>
            </div>
          </div>
          <div class="card-desc">${card.desc}</div>
          <div class="card-keys">
            ${card.key ? `<span class="card-key primary">${card.key}</span>` : ""}
            <span class="card-key">SR.WebUI.Open ${card.id}</span>
          </div>`;
        node.addEventListener("mouseenter", () => this.setActive(card.id));
        node.addEventListener("click", () => {
          this.setActive(card.id);
          SRBridge.send("nav", { to: card.id });
        });
        cardsEl.appendChild(node);
      });
      wrap.appendChild(groupEl);
    });
  },

  render() { this.renderCards(); }
};

ue.interface.setLobbyData = function() { window.SRLobby.render(); };

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRLobby.back(); }
  else if (e.key === "Enter" || e.key === " ")     { e.preventDefault(); SRLobby.enter(); }
  else if (e.key === "ArrowLeft"  || e.key === "a" || e.key === "A") { e.preventDefault(); SRLobby.cycle(-1); }
  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); SRLobby.cycle(1); }
  else if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); SRLobby.cycle(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); SRLobby.cycle(1); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRLobby.render();
  SRBridge.ready("startup-web-lobby");
});
</script>
</head>
<body>
<main class="stage">
  <div class="header">
    <div class="bc-kanji">前堂</div>
    <div class="bc-tag">DEV · LOBBY</div>
    <div class="bc-hint">点格登场 / Esc 退</div>
  </div>
  <div class="seal corner-seal-2">门</div>

  <!-- 帐幕飘带 -->
