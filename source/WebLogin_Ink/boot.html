<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · Ink 启动</title>
<link rel="stylesheet" href="assets/common.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #E8EEF6;
  font-family: KaiBrush, 'Songti SC', 'STKaiti', KaiTi, '楷体', serif;
  user-select: none;
  cursor: default;
}
.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-width: 960px;
  min-height: 540px;
  color: rgba(5, 7, 8, 0.9);
  background:
    radial-gradient(ellipse 26vw 18vh at 51% 32%, rgba(255,255,255,.92), transparent 72%),
    radial-gradient(ellipse 48vw 36vh at 51% 56%, rgba(213,225,238,.44), transparent 78%),
    radial-gradient(ellipse 20vw 16vh at 9% 94%, rgba(115,132,145,.30), transparent 72%),
    radial-gradient(ellipse 24vw 20vh at 86% 91%, rgba(190,202,214,.24), transparent 74%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='71'/><feColorMatrix values='0 0 0 0 0.60 0 0 0 0 0.66 0 0 0 0 0.72 0 0 0 0.16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
    linear-gradient(180deg, #F1F5FA 0%, #E7EEF6 48%, #DCE6EF 100%);
}
.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle 1.2px at 6% 18%, rgba(255,255,255,.90), transparent 72%),
    radial-gradient(circle 1px at 89% 9%, rgba(255,255,255,.78), transparent 72%),
    radial-gradient(circle 1.4px at 91% 28%, rgba(255,255,255,.90), transparent 72%),
    radial-gradient(circle 1px at 7% 84%, rgba(255,255,255,.72), transparent 72%),
    radial-gradient(circle 1.2px at 78% 93%, rgba(255,255,255,.82), transparent 72%),
    repeating-radial-gradient(circle at 100% 18%, rgba(255,255,255,.42) 0 1px, transparent 1px 14px);
  opacity: .86;
}
.stage::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 31vh;
  z-index: 2;
  pointer-events: none;
  background:
    linear-gradient(0deg, rgba(36,43,48,.30), transparent 65%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 420' preserveAspectRatio='none'><path d='M0 330 C160 270 260 355 410 300 C520 260 640 350 790 300 C940 245 1030 345 1200 292 C1370 240 1480 335 1600 278 L1600 420 L0 420 Z' fill='%233A4146' opacity='.32'/><path d='M370 310 C445 265 512 285 610 250 C548 316 470 333 370 310 Z' fill='%231D2225' opacity='.28'/><path d='M0 405 C250 360 460 393 700 350 C980 302 1210 388 1600 330 L1600 420 L0 420 Z' fill='%23080A0B' opacity='.20'/><path d='M92 382 L130 338 L170 382 Z M111 365 L111 420 L124 420 L124 365 Z' fill='%23080A0B' opacity='.26'/></svg>");
}
.boot-shade {
  position: absolute;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  background: #F1F5FA;
  opacity: 1;
  transition: opacity 900ms cubic-bezier(.22, .9, .26, 1);
}
.stage.boot-ready .boot-shade { opacity: 0; }
.ink-birds {
  position: absolute;
  top: 5.8vh;
  left: 50%;
  width: 460px;
  height: 110px;
  transform: translateX(-50%) translateY(-12px);
  z-index: 5;
  opacity: 0;
  transition: opacity 900ms ease 520ms, transform 1100ms cubic-bezier(.22,.9,.26,1) 520ms;
}
.stage.boot-ready .ink-birds { opacity: .42; transform: translateX(-50%) translateY(0); }
.ink-birds i { position: absolute; width: 58px; height: 22px; }
.ink-birds i::before,
.ink-birds i::after {
  content: "";
  position: absolute;
  top: 11px;
  width: 32px;
  height: 11px;
  border-top: 4px solid rgba(25,31,35,.45);
  border-radius: 50% 50% 0 0;
}
.ink-birds i::before { left: 0; transform: rotate(18deg); }
.ink-birds i::after { right: 0; transform: rotate(-18deg); }
.ink-birds i:nth-child(1) { left: 20px; top: 30px; transform: scale(.58); opacity: .62; }
.ink-birds i:nth-child(2) { left: 150px; top: 45px; transform: scale(.92); opacity: .50; }
.ink-birds i:nth-child(3) { right: 40px; top: 8px; transform: scale(1.1); opacity: .42; }
.title-poster {
  position: absolute;
  left: 50%;
  top: 15vh;
  width: min(52vw, 680px);
  height: 62vh;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
}
.ink-blade {
  position: absolute;
  left: 57%;
  top: 3%;
  width: 24px;
  height: 92%;
  z-index: 1;
  transform-origin: 50% 0%;
  transform: scaleY(0) rotate(.4deg);
  background: linear-gradient(180deg, rgba(12,14,16,.96), #000 52%, rgba(18,20,22,.96));
  border-radius: 70% 50% 60% 42%;
  filter: drop-shadow(12px 20px 13px rgba(42,52,61,.24));
  transition: transform 1050ms cubic-bezier(.16,.9,.18,1) 450ms;
}
.stage.boot-ready .ink-blade { transform: scaleY(1) rotate(.4deg); }
.ink-sweep {
  position: absolute;
  left: 45%;
  bottom: 1.5%;
  width: 168px;
  height: 20px;
  z-index: 1;
  opacity: 0;
  transform: translateX(-22px) rotate(-3deg);
  background:
    radial-gradient(ellipse at 18% 60%, rgba(5,6,7,.32), transparent 62%),
    linear-gradient(7deg, transparent 0 22%, rgba(5,6,7,.36) 34% 48%, transparent 66%);
  filter: blur(2.4px);
  transition: opacity 700ms ease 980ms, transform 900ms cubic-bezier(.22,.9,.26,1) 980ms;
}
.stage.boot-ready .ink-sweep { opacity: .38; transform: translateX(0) rotate(-3deg); }
.title-main {
  position: relative;
  z-index: 2;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: clamp(104px, 11.2vw, 178px);
  line-height: 1.08;
  letter-spacing: .10em;
  color: rgba(4,5,6,.92);
  font-weight: 900;
  transform: translateX(-44px) rotate(-2deg);
  opacity: 0;
  clip-path: inset(0 0 100% 0);
  text-shadow: 0 2px 0 rgba(255,255,255,.20), 0 20px 32px rgba(80,96,110,.24);
  transition: opacity 560ms ease 980ms, clip-path 1150ms cubic-bezier(.16,.9,.18,1) 980ms;
}
.stage.boot-ready .title-main { opacity: 1; clip-path: inset(0 0 0 0); }
.title-sub {
  position: absolute;
  left: 18%;
  bottom: 13%;
  z-index: 3;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: clamp(20px, 2.1vw, 34px);
  letter-spacing: .26em;
  line-height: 1.45;
  color: rgba(12,15,17,.72);
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 680ms ease 1500ms, transform 820ms cubic-bezier(.22,.9,.26,1) 1500ms;
}
.tagline {
  position: absolute;
  left: 8%;
  bottom: 7%;
  z-index: 3;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: clamp(12px, 1.05vw, 18px);
  line-height: 1.7;
  letter-spacing: .22em;
  color: rgba(18,22,24,.58);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 680ms ease 1660ms, transform 820ms cubic-bezier(.22,.9,.26,1) 1660ms;
}
.stage.boot-ready .title-sub,
.stage.boot-ready .tagline { opacity: 1; transform: translateY(0); }
.seal {
  position: absolute;
  left: 59%;
  top: 27vh;
  z-index: 11;
  width: 42px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  writing-mode: vertical-rl;
  color: rgba(20,24,26,.70);
  background: rgba(235,240,246,.42);
  border: 2px solid rgba(42,48,52,.55);
  box-shadow: 0 8px 18px rgba(66,78,88,.15), inset 0 0 0 2px rgba(255,255,255,.28);
  font-size: 16px;
  letter-spacing: .08em;
  opacity: 0;
  transform: scale(.92) rotate(-1deg);
  transition: opacity 560ms ease 1780ms, transform 780ms cubic-bezier(.22,.9,.26,1) 1780ms;
}
.stage.boot-ready .seal { opacity: 1; transform: scale(1) rotate(-1deg); }
.seal::before { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(42,48,52,.34); }
.chapter-title,
.time-stamp,
.skip-hint {
  position: absolute;
  z-index: 20;
  opacity: 0;
  transition: opacity 700ms ease 2080ms, transform 820ms cubic-bezier(.22,.9,.26,1) 2080ms;
}
.chapter-title {
  left: 6vw;
  bottom: 6vh;
  color: rgba(48,58,66,.55);
  letter-spacing: .30em;
  font-size: 13px;
  transform: translateX(-10px);
}
.time-stamp {
  right: 6vw;
  bottom: 6vh;
  color: rgba(48,58,66,.42);
  font-family: var(--font-mono, Consolas, monospace);
  letter-spacing: .34em;
  font-size: 10px;
  text-align: right;
  line-height: 1.7;
  transform: translateX(10px);
}
.skip-hint {
  left: 50%;
  bottom: 5vh;
  color: rgba(35,43,50,.42);
  font-family: var(--font-mono, Consolas, monospace);
  font-size: 10px;
  letter-spacing: .42em;
  transform: translateX(-50%) translateY(8px);
}
.stage.boot-ready .chapter-title,
.stage.boot-ready .time-stamp { opacity: 1; transform: translateX(0); }
.stage.boot-ready .skip-hint { opacity: .56; transform: translateX(-50%) translateY(0); animation: skip-blink 2.4s ease-in-out 2500ms infinite; }
@keyframes skip-blink { 0%,100%{opacity:.42;} 50%{opacity:.86;} }
.grain { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:.12; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' seed='31'/><feColorMatrix values='0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.84 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.vignette { position:absolute; inset:0; z-index:7; pointer-events:none; background:radial-gradient(ellipse 82% 84% at 50% 48%, transparent 50%, rgba(150,166,178,.23) 100%); }
.stage.boot-leaving { animation: boot-out 520ms ease-in forwards; }
@keyframes boot-out { to { opacity:0; transform: scale(1.01); } }
@media (prefers-reduced-motion: reduce) {
  .boot-shade { opacity: 0; }
  .ink-birds, .title-main, .title-sub, .tagline, .seal, .chapter-title, .time-stamp, .skip-hint { opacity: 1; transform: none; clip-path: none; transition: none; animation: none; }
  .ink-blade { transform: scaleY(1); transition: none; }
  .ink-sweep { opacity: .88; transform: rotate(-4deg); transition: none; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
ue.interface.setBootData = function(data) {
  window.SRBootTemplate = data && data.template ? data.template : "Ink";
};

window.SRBoot = {
  state: { transitioning: false, autoTimer: null, totalDelay: 5600 },
  navigateToLogin() {
    if (this.state.transitioning) return;
    this.state.transitioning = true;
    if (this.state.autoTimer) { clearTimeout(this.state.autoTimer); this.state.autoTimer = null; }
    document.querySelector(".stage").classList.add("boot-leaving");
    setTimeout(() => SRBridge.send("nav", { to: "login" }), 480);
  },
  back() { SRBridge.back("startup-web-boot"); }
};

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Enter" || e.key === " " || e.key === "Backspace") {
    e.preventDefault();
    SRBoot.navigateToLogin();
  }
});

const SR_PREFETCH_PAGES = [
  "login", "settings", "skills", "inventory", "journal", "dialogue",
  "load", "combat", "cinematic", "pause", "map", "codex", "profile", "lobby"
];
function srPrefetchAll() {
  SR_PREFETCH_PAGES.forEach(p => {
    const link = document.createElement("link");
    link.rel = "prefetch";
    link.as = "document";
    link.href = p + ".html";
    document.head.appendChild(link);
  });
  ["assets/common.css", "assets/ue-bridge.js"].forEach(href => {
    const link = document.createElement("link");
    link.rel = "prefetch";
    link.href = href;
    document.head.appendChild(link);
  });
}

window.addEventListener("DOMContentLoaded", () => {
  SRBridge.ready("startup-web-boot");
  if (typeof requestIdleCallback === "function") {
    requestIdleCallback(srPrefetchAll, { timeout: 600 });
  } else {
    setTimeout(srPrefetchAll, 200);
  }
  requestAnimationFrame(() => document.querySelector(".stage")?.classList.add("boot-ready"));
  // 自动跳转
  SRBoot.state.autoTimer = setTimeout(() => SRBoot.navigateToLogin(), SRBoot.state.totalDelay);
});
</script>
</head>
<body>
<main class="stage">
  <div class="ink-birds" aria-hidden="true"><i></i><i></i><i></i></div>
  <section class="title-poster" aria-label="标题">
    <div class="ink-blade" aria-hidden="true"></div>
    <div class="ink-sweep" aria-hidden="true"></div>
    <div class="title-main">一介</div>
    <div class="title-sub">寒土孤山</div>
    <div class="tagline">凡人的宁静 · 时代的碾碎</div>
  </section>
  <div class="seal">一介印</div>
  <div class="chapter-title">建安末 · 寒山雪纸</div>
  <div class="time-stamp">INK TEMPLATE<br>一介 · 二〇二六</div>
  <div class="skip-hint">PRESS ANY KEY TO CONTINUE</div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="boot-shade" aria-hidden="true"></div>
</main>
</body>
</html>
