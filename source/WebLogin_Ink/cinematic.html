<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一介 · 剧情演绎 · 水墨戏台</title>
<link rel="stylesheet" href="assets/common.css">
<style>
/* === 水墨 · 戏台过场 ===================================================
 * 布局重构：
 *   - bar-top / bar-bottom 改为朱红丝帛幕（铜钉条 + 流苏）拉开
 *   - scene 改为羊皮战图底色 + 中央暖光
 *   - chapter-mark 朱印章章节牌
 *   - caption 改黑漆念白牌（朱砂边 + 「」装饰）
 *   - progress 改朱印方块进度
 *   - controls 改虎符按钮
 * SRCinematic 命名空间、setCinematicData、SRBridge 协议层一致保留。
 * ============================================================================ */

.stage {
  background:
    radial-gradient(ellipse 50% 35% at 50% 40%, rgba(184, 58, 28, 0.10), transparent 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='p'><feTurbulence baseFrequency='0.014 0.04' numOctaves='2' seed='25'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.14  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
    linear-gradient(180deg, #0F0805 0%, #18120B 50%, #08070A 100%);
}

/* === 朱红丝帛幕（letterbox） ============================================ */
.bar-top, .bar-bottom {
  position: absolute; left: 0; right: 0;
  height: 17vh;
  /* 朱红丝帛纹理 */
  background:
    repeating-linear-gradient(0deg,
      rgba(0, 0, 0, 0.06) 0px, rgba(0, 0, 0, 0.06) 1px,
      transparent 1px, transparent 4px),
    linear-gradient(180deg, var(--zhusha-deep) 0%, #6A1A08 30%, var(--zhusha) 50%, #6A1A08 70%, var(--zhusha-deep) 100%);
  z-index: 30;
  transition: transform 480ms cubic-bezier(0.25, 0.85, 0.4, 1);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
}
.bar-top    { top: 0; transform: translateY(-100%); }
.bar-bottom { bottom: 0; transform: translateY(100%); }
.stage.cine-on .bar-top    { transform: translateY(0); }
.stage.cine-on .bar-bottom { transform: translateY(0); }

/* 顶部丝帛底端：铜钉条 + 流苏 */
.bar-top::after {
  content: "";
  position: absolute;
  bottom: 0; left: 8px; right: 8px;
  height: 6px;
  background:
    radial-gradient(circle 2.5px at 5% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 25% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 50% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 75% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 95% 50%, #BC8F3A, transparent 55%);
}
.bar-top::before {
  /* 顶部金色木轴 */
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 12px;
  background: linear-gradient(180deg, #4A2E16 0%, #6E4824 30%, #8E5C30 50%, #6E4824 70%, #2C1A0A 100%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
}
/* 底部丝帛镜像 */
.bar-bottom::after {
  content: "";
  position: absolute;
  top: 0; left: 8px; right: 8px;
  height: 6px;
  background:
    radial-gradient(circle 2.5px at 5% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 25% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 50% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 75% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 2.5px at 95% 50%, #BC8F3A, transparent 55%);
}
.bar-bottom::before {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 12px;
  background: linear-gradient(180deg, #2C1A0A 0%, #6E4824 30%, #8E5C30 50%, #6E4824 70%, #4A2E16 100%);
  box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.55);
}

.scene {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 50% 35% at 50% 40%, rgba(184, 58, 28, 0.16) 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 60%, rgba(0, 0, 0, 0.55), transparent 70%),
    linear-gradient(180deg, #0F0B07 0%, #18120B 50%, #08070A 100%);
}

.silhouette {
  position: absolute; left: 50%; bottom: 24%;
  transform: translateX(-50%);
  width: 26vw; max-width: 380px;
  opacity: 0.92;
}

/* === 章节朱印 ========================================================== */
.chapter-mark {
  position: absolute;
  top: 5vh; left: 50%; transform: translateX(-50%);
  text-align: center;
  z-index: 40;
  opacity: 0;
  transition: opacity 600ms ease 200ms;
}
.stage.cine-on .chapter-mark { opacity: 1; }

.chapter-mark .num {
  font-family: var(--font-kai);
  font-size: 12px; font-weight: 900;
  letter-spacing: 0.4em;
  color: var(--paper);
  background: var(--zhusha-deep);
  padding: 3px 12px;
  display: inline-block;
  border: 1px solid #2A1B0E;
  margin-bottom: 10px;
  box-shadow: 0 0 6px var(--zhusha-glow);
}
.chapter-mark .name {
  font-family: var(--font-kai);
  font-size: 26px; font-weight: 900;
  letter-spacing: 0.36em; padding-left: 0.36em;
  color: var(--paper);
  text-shadow:
    0 0 18px rgba(255, 220, 170, 0.55),
    0 2px 6px rgba(0, 0, 0, 0.7);
}
.chapter-mark .divider {
  width: 100px; height: 2px;
  margin: 12px auto 0;
  background: linear-gradient(90deg, transparent 4%, rgba(220, 184, 122, 0.45) 20%, var(--zhusha) 50%, rgba(220, 184, 122, 0.45) 80%, transparent 96%);
  box-shadow: 0 0 6px var(--zhusha-glow);
  position: relative;
}
.chapter-mark .divider::before, .chapter-mark .divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 8px; height: 8px;
  background: var(--zhusha);
  transform: translateY(-50%) rotate(45deg);
  box-shadow: 0 0 6px var(--zhusha-glow);
}
.chapter-mark .divider::before { left: 0; }
.chapter-mark .divider::after  { right: 0; }

/* === 念白漆牌 ========================================================== */
.caption {
  position: absolute;
  bottom: 22vh; left: 50%;
  transform: translateX(-50%);
  width: min(1000px, 85vw);
  text-align: center;
  padding: 22px 36px;
  background: linear-gradient(180deg, rgba(20, 12, 6, 0.9), rgba(8, 4, 2, 0.95));
  border: 2px solid var(--zhusha);
  border-left: 6px solid var(--zhusha-bright);
  z-index: 40;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 18px var(--zhusha-glow);
}
.caption::before {
  /* 顶端铜钉条 */
  content: "";
  position: absolute;
  top: 4px; left: 12px; right: 12px;
  height: 3px;
  background:
    radial-gradient(circle 1.5px at 5% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 25% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 50% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 75% 50%, #BC8F3A, transparent 55%),
    radial-gradient(circle 1.5px at 95% 50%, #BC8F3A, transparent 55%);
}
.caption-speaker {
  font-family: var(--font-kai);
  font-size: 13px; font-weight: 900;
  letter-spacing: 0.4em;
  color: var(--paper);
  background: var(--zhusha);
  padding: 4px 14px;
  display: inline-block;
  border: 1px solid #2A1B0E;
  margin-bottom: 14px;
  box-shadow: 0 0 8px var(--zhusha-glow);
}
.caption-line {
  font-family: var(--font-kai);
  font-size: clamp(20px, 2.0vw, 32px);
  line-height: 1.85;
  letter-spacing: 0.16em;
  color: var(--paper);
  text-shadow: 0 0 12px rgba(255, 220, 170, 0.4), 0 2px 14px rgba(0, 0, 0, 0.85);
  min-height: 4em;
  position: relative;
  padding: 0 24px;
}
.caption-line::before {
  content: "「";
  position: absolute;
  left: 0; top: -8px;
  font-family: var(--font-kai);
  font-size: 32px;
  color: var(--zhusha-bright);
  text-shadow: 0 0 10px var(--zhusha-glow);
}
.caption-line::after {
  content: "」";
  position: absolute;
  right: 0; bottom: -16px;
  font-family: var(--font-kai);
  font-size: 32px;
  color: var(--zhusha-bright);
  text-shadow: 0 0 10px var(--zhusha-glow);
}
.caption-line .typed {
  display: inline-block;
  vertical-align: top;
}
.caption-line .cursor {
  display: inline-block;
  width: 10px; height: 1.1em;
  background: var(--zhusha-bright);
  margin-left: 6px;
  vertical-align: text-bottom;
  opacity: 0.9;
  box-shadow: 0 0 10px var(--zhusha-glow);
  animation: cine-cursor 0.7s steps(2) infinite;
}
.caption-line.done .cursor { display: none; }
@keyframes cine-cursor {
  0%, 50%   { opacity: 0.9; }
  50.01%, 100% { opacity: 0.0; }
}

/* === progress 朱印进度 ================================================= */
.progress {
  position: absolute;
  bottom: 19vh; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
  z-index: 40;
}
.progress .dot {
  width: 12px; height: 12px;
  background: rgba(76, 52, 28, 0.55);
  border: 2px solid #2A1B0E;
  transform: rotate(45deg);
  transition: all 0.2s ease;
}
.progress .dot.done {
  background: var(--gold);
  box-shadow: 0 0 6px rgba(220, 184, 122, 0.55);
}
.progress .dot.now {
  background: var(--zhusha-bright);
  border-color: #2A1B0E;
  box-shadow: 0 0 14px var(--zhusha-glow);
  width: 16px; height: 16px;
}

/* === controls 虎符按钮 ================================================= */
.controls {
  position: absolute;
  bottom: 4.6vh; left: 0; right: 0;
  z-index: 60;
  display: flex; justify-content: center; gap: 18px;
}
.cine-btn {
  font-family: var(--font-kai);
  font-size: 14px; font-weight: 900;
  letter-spacing: 0.36em;
  color: var(--paper-2);
  /* 虎符底色 */
  background: linear-gradient(180deg, #3A2614 0%, #2A1B0E 100%);
  border: 2px solid #6E4824;
  padding: 10px 26px;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: inset 0 0 0 1px rgba(220, 184, 122, 0.22), 0 4px 8px rgba(0, 0, 0, 0.45);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
}
.cine-btn:hover {
  color: var(--paper);
  border-color: rgba(220, 184, 122, 0.55);
  background: linear-gradient(180deg, #4A3018 0%, #3A2614 100%);
}
.cine-btn:active { transform: translateY(1px); }
.cine-btn.primary {
  border-color: var(--zhusha-deep);
  color: var(--paper);
  background: linear-gradient(180deg, var(--zhusha) 0%, var(--zhusha-deep) 100%);
  box-shadow:
    0 0 18px var(--zhusha-glow),
    inset 0 0 0 1px rgba(255, 222, 170, 0.32);
}
.cine-btn.primary:hover {
  background: linear-gradient(180deg, var(--zhusha-bright) 0%, var(--zhusha) 100%);
}

@media (max-height: 720px) {
  .footer-bar { display: none; }
  .controls { bottom: 6vh; }
  .caption { padding: 16px 28px; }
}
</style>
<script src="assets/ue-bridge.js"></script>
<script>
window.SRCinematic = {
  state: {
    chapter: { num: "贰 · 第三幕", name: "山村回忆 · 灵儿戏水" },
    nodeIndex: 0,
    typing: false,
    typedLen: 0,
    typeTimer: null,
    nodes: [
      { speaker: "旁白", line: "雨初停。竹梢上挂着水珠，落在井边的石阶上。" },
      { speaker: "灵儿", line: "舅父，你回来啦——" },
      { speaker: "風行客", line: "灵儿……还认得我吗？" },
      { speaker: "灵儿", line: "我只记得，井里的鱼会游到天上去。" },
      { speaker: "旁白", line: "他没有回答，只是把斗笠放下，火光映在他眉梢。" }
    ]
  },

  current() { return this.state.nodes[this.state.nodeIndex]; },

  setChapter(c) {
    if (!c) return;
    this.state.chapter = Object.assign({}, this.state.chapter, c);
    this.renderChapter();
  },

  start() {
    document.querySelector(".stage").classList.add("cine-on");
    this.renderChapter();
    this.startNode();
  },

  startNode() {
    const node = this.current();
    if (!node) return;
    document.querySelector(".caption-speaker").textContent = node.speaker || "";
    const lineEl = document.querySelector(".caption-line");
    lineEl.classList.remove("done");
    const typedEl = document.querySelector(".caption-line .typed");
    typedEl.textContent = "";

    this.state.typing = true;
    this.state.typedLen = 0;
    if (this.state.typeTimer) clearInterval(this.state.typeTimer);
    this.state.typeTimer = setInterval(() => {
      this.state.typedLen++;
      typedEl.textContent = node.line.slice(0, this.state.typedLen);
      if (this.state.typedLen >= node.line.length) {
        clearInterval(this.state.typeTimer);
        this.state.typeTimer = null;
        this.state.typing = false;
        lineEl.classList.add("done");
      }
    }, 38);
    this.renderProgress();
  },

  finishTyping() {
    if (!this.state.typing) return;
    if (this.state.typeTimer) { clearInterval(this.state.typeTimer); this.state.typeTimer = null; }
    const node = this.current();
    document.querySelector(".caption-line .typed").textContent = node.line;
    document.querySelector(".caption-line").classList.add("done");
    this.state.typing = false;
  },

  next() {
    if (this.state.typing) { this.finishTyping(); return; }
    if (this.state.nodeIndex >= this.state.nodes.length - 1) {
      this.finish();
      return;
    }
    this.state.nodeIndex++;
    this.startNode();
    SRBridge.send("cinematic-advance", { nodeIndex: this.state.nodeIndex });
  },

  replay() {
    this.state.nodeIndex = 0;
    this.startNode();
    SRBridge.send("cinematic-replay", {});
  },

  skip() {
    if (this.state.typeTimer) { clearInterval(this.state.typeTimer); this.state.typeTimer = null; }
    this.state.nodeIndex = this.state.nodes.length - 1;
    this.startNode();
    setTimeout(() => this.finishTyping(), 50);
    SRBridge.send("cinematic-skip", {});
  },

  finish() {
    SRBridge.send("cinematic-finish", { surface: "startup-web-cinematic" });
    SRBridge.toast("山村回忆 · 启程", { tone: "quest", title: "剧情", ttl: 2000 });
  },

  back() { SRBridge.back("startup-web-cinematic"); },

  renderChapter() {
    const c = this.state.chapter;
    document.querySelector(".chapter-mark .num").textContent  = c.num || "";
    document.querySelector(".chapter-mark .name").textContent = c.name || "";
  },

  renderProgress() {
    const wrap = document.querySelector(".progress");
    wrap.innerHTML = "";
    this.state.nodes.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = "dot";
      if (idx < this.state.nodeIndex) dot.classList.add("done");
      else if (idx === this.state.nodeIndex) dot.classList.add("now");
      wrap.appendChild(dot);
    });
  }
};

ue.interface.setCinematicData = function(data) {
  if (!data) return;
  if (data.chapter) window.SRCinematic.setChapter(data.chapter);
  if (Array.isArray(data.nodes)) {
    window.SRCinematic.state.nodes = data.nodes;
    window.SRCinematic.state.nodeIndex = 0;
    window.SRCinematic.startNode();
  }
};

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); SRCinematic.back(); }
  else if (e.key === "Enter" || e.key === " ")     { e.preventDefault(); SRCinematic.next(); }
  else if (e.key === "r" || e.key === "R")         { e.preventDefault(); SRCinematic.replay(); }
  else if (e.key === "Tab")                         { e.preventDefault(); SRCinematic.skip(); }
});

window.addEventListener("DOMContentLoaded", () => {
  SRBridge.ready("startup-web-cinematic");
  setTimeout(() => SRCinematic.start(), 120);
});
</script>
</head>
<body>
<main class="stage">
  <div class="scene"></div>
  <svg class="silhouette" viewBox="0 0 580 700" aria-hidden="true">
    <g fill="#040303" opacity="0.96">
      <ellipse cx="290" cy="190" rx="100" ry="32"/>
      <rect x="278" y="190" width="24" height="60"/>
      <ellipse cx="290" cy="248" rx="22" ry="28"/>
      <path d="M225,260 L210,360 L195,520 L188,690 L235,700 L345,700 L392,690 L385,520 L370,360 L355,260 Q290,240 225,260 Z"/>
      <rect x="378" y="320" width="6" height="240" transform="rotate(8 381 440)"/>
      <rect x="370" y="312" width="22" height="6" transform="rotate(8 381 315)"/>
      <circle cx="381" cy="305" r="9" fill="none" stroke="#040303" stroke-width="3"/>
    </g>
  </svg>

  <div class="bar-top"></div>
  <div class="bar-bottom"></div>

  <div class="chapter-mark">
    <div class="num"></div>
    <div class="name"></div>
    <div class="divider"></div>
  </div>

  <section class="caption">
    <div class="caption-speaker"></div>
    <div class="caption-line"><span class="typed"></span><span class="cursor"></span></div>
  </section>

  <div class="progress"></div>

  <div class="controls">
    <button class="cine-btn" type="button" onclick="window.SRCinematic.skip()">跳过 [Tab]</button>
    <button class="cine-btn primary" type="button" onclick="window.SRCinematic.next()">下一句 [Enter]</button>
    <button class="cine-btn" type="button" onclick="window.SRCinematic.replay()">重 演 [R]</button>
  </div>
</main>
</body>
</html>
