<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<title>一介 · 见闻录 · Codex</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="nav-tabs.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    width: 1280px; height: 720px; position: relative;
    color: var(--ink-black); font-family: var(--font-kai);
    --safe-x: 56px;
  }
  .stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 42vw 30vh at 49% 24%, rgba(255,255,255,.78), transparent 72%),
      radial-gradient(ellipse 50vw 38vh at 52% 58%, rgba(214,226,238,.42), transparent 78%),
      radial-gradient(ellipse 22vw 18vh at 9% 94%, rgba(115,132,145,.30), transparent 72%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='59'/><feColorMatrix values='0 0 0 0 0.60 0 0 0 0 0.66 0 0 0 0 0.72 0 0 0 0.16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
      linear-gradient(180deg, #F1F5FA 0%, #E7EEF6 46%, #DDE6EF 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' seed='23'/><feColorMatrix values='0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.84 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .body {
    position: absolute;
    top: 64px; left: 0; right: 0; bottom: 60px;
    z-index: 2;
    display: grid;
    grid-template-columns: 130px 240px 1fr;
  }

  /* === 卷首：竖排分类 === */
  .cats {
    position: relative;
    padding: 28px 0;
    display: flex; flex-direction: column; gap: 4px;
    border-right: 1px solid rgba(15,20,24,.14);
    background: linear-gradient(90deg, rgba(35,43,50,.04), transparent);
  }
  .cats::before {
    content: "卷 首";
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-kai); font-size: 10px;
    letter-spacing: 0.32em; color: rgba(35,43,50,.42);
  }
  .cat {
    margin-top: 0; padding: 16px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: all .14s ease;
    position: relative;
  }
  .cat:hover { background: rgba(248,251,255,.62); }
  .cat.active {
    background: var(--ink-black); color: rgba(248,251,255,.96);
  }
  .cat.active::after {
    content: ""; position: absolute; right: -1px; top: 14px; bottom: 14px;
    width: 2px; background: var(--zhusha, #B83A1C);
  }
  .cat-num {
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
    letter-spacing: 0; color: rgba(35,43,50,.55);
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(15,20,24,.32);
  }
  .cat.active .cat-num { color: rgba(248,251,255,.96); border-color: rgba(248,251,255,.55); }
  .cat-name {
    /* 竖排 */
    writing-mode: vertical-rl;
    font-family: var(--font-kai); font-size: 18px; font-weight: 900;
    letter-spacing: 0.32em; color: var(--ink-black);
    line-height: 1; padding: 4px 0;
  }
  .cat.active .cat-name { color: rgba(248,251,255,.96); }
  .cat-en {
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.28em; color: rgba(35,43,50,.42);
    writing-mode: vertical-rl;
  }
  .cat.active .cat-en { color: rgba(214,226,238,.55); }

  /* === 分卷：词条列表 === */
  .entries {
    position: relative;
    padding: 28px 16px 26px 18px;
    border-right: 1px solid rgba(15,20,24,.10);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(15,20,24,.18) transparent;
  }
  .entries-head {
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid rgba(15,20,24,.10);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .entries-h-name {
    font-family: var(--font-kai); font-size: 15px; font-weight: 900;
    letter-spacing: 0.32em; color: var(--ink-black);
  }
  .entries-h-count {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.55);
  }
  .entry-row {
    position: relative;
    padding: 11px 14px 11px 16px; margin-bottom: 6px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.16);
    cursor: pointer; transition: all .14s ease;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .entry-row:hover { transform: translateX(3px); border-color: rgba(15,20,24,.5); }
  .entry-row.active {
    background: var(--ink-black); color: rgba(248,251,255,.96);
    border-color: var(--ink-black);
    box-shadow: 0 6px 18px rgba(20,28,36,.30);
  }
  .entry-row.unread::before {
    content: ""; position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px;
    background: var(--zhusha, #B83A1C);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(184,58,28,.7);
  }
  .entry-name {
    font-family: var(--font-kai); font-size: 14px; font-weight: 700;
    letter-spacing: 0.16em; color: inherit;
  }
  .entry-tag {
    font-family: var(--font-kai); font-size: 10px; letter-spacing: 0.20em;
    padding: 2px 6px;
    border: 1px solid rgba(15,20,24,.32); color: rgba(35,43,50,.7);
    background: rgba(248,251,255,.46);
    white-space: nowrap;
  }
  .entry-row.active .entry-tag { border-color: rgba(248,251,255,.55); color: rgba(248,251,255,.86); background: transparent; }

  /* === 折页：词条详注 === */
  .scroll-pane {
    padding: 26px 38px 26px 36px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(15,20,24,.18) transparent;
    background: linear-gradient(180deg, rgba(248,251,255,.42) 0%, rgba(232,240,247,.16) 100%);
    position: relative;
  }
  /* 折页中线 */
  .scroll-pane::before {
    content: ""; position: absolute;
    left: 56%; top: 26px; bottom: 26px;
    width: 1px;
    background: linear-gradient(180deg,
      transparent, rgba(15,20,24,.12) 12%, rgba(15,20,24,.12) 88%, transparent);
  }

  .scroll-grid {
    display: grid; grid-template-columns: 1.35fr 1fr;
    gap: 28px;
    height: 100%;
  }

  .col-left  { display: flex; flex-direction: column; min-width: 0; }
  .col-right { display: flex; flex-direction: column; min-width: 0; padding-left: 10px; }

  .scroll-head {
    position: relative;
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 1px solid rgba(15,20,24,.14);
  }
  .scroll-cat {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.42em;
    color: rgba(35,43,50,.55);
  }
  .scroll-title {
    margin-top: 6px;
    font-family: var(--font-kai); font-size: 36px; font-weight: 900;
    letter-spacing: 0.16em; color: var(--ink-black);
    line-height: 1.1;
  }
  .scroll-stamp {
    position: absolute; top: 0; right: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 22px; font-weight: 900;
    color: rgba(248,251,255,.96);
    background: var(--zhusha, #B83A1C);
    transform: rotate(-3deg);
  }

  .scroll-body p {
    font-family: var(--font-kai); font-size: 14px; line-height: 1.95;
    letter-spacing: 0.10em; color: rgba(20,24,26,.88);
    text-wrap: pretty; margin-bottom: 14px;
    text-indent: 2em;
  }
  .scroll-body em {
    font-style: normal;
    background: linear-gradient(transparent 60%, rgba(184,58,28,.22) 60%);
    padding: 0 2px;
    color: var(--ink-black); font-weight: 900;
  }

  /* 右栏 plate */
  .plate {
    flex: 1;
    background: rgba(248,251,255,.7);
    border: 1px solid rgba(15,20,24,.16);
    padding: 22px 22px 18px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .plate::before {
    content: ""; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 1px dashed rgba(15,20,24,.12); pointer-events: none;
  }
  .plate-glyph {
    flex: 1; min-height: 160px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-weight: 900;
    font-size: 168px;
    color: var(--ink-black);
    line-height: 1;
    text-shadow: 0 0 32px rgba(255,255,255,.7);
    position: relative;
  }
  .plate-glyph::after {
    content: ""; position: absolute;
    left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(15,20,24,.32), transparent);
  }
  .plate-caption {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.42em;
    color: rgba(35,43,50,.55);
    text-align: center;
    padding-top: 10px;
  }

  .scroll-meta {
    margin-top: 14px;
  }
  .scroll-meta h4 {
    font-family: var(--font-kai); font-size: 11px; font-weight: 900;
    letter-spacing: 0.42em; color: rgba(35,43,50,.6);
    margin-bottom: 8px;
    border-left: 2px solid var(--ink-black); padding-left: 8px;
  }
  .scroll-meta-row {
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.10);
    margin-bottom: 4px;
    font-family: var(--font-kai); font-size: 12px;
  }
  .scroll-meta-row > span:first-child { color: rgba(35,43,50,.6); letter-spacing: 0.16em; }
  .scroll-meta-row > .v { color: var(--ink-black); font-weight: 900; letter-spacing: 0.10em; }

  /* === footer === */
  .footer-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: 60px; padding: 0 var(--safe-x);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(0deg, rgba(232,240,247,.8) 0%, rgba(248,251,255,0) 100%);
    border-top: 1px solid rgba(15,20,24,.10);
  }
  .footer-meta {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.55);
  }
  .footer-meta .label-cn {
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
    letter-spacing: 0.32em; color: var(--ink-black); margin-right: 10px;
  }
  .prompts { display: flex; align-items: center; gap: 18px; }
  .prompt {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0.22em;
    color: rgba(20,24,26,.86);
  }
  .km {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 8px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--ink-black);
    background: rgba(248,251,255,.95);
    border: 1.2px solid rgba(15,20,24,.55);
    border-radius: 11px;
  }
  .km.cross { color: rgba(248,251,255,.96); background: var(--ink-black); border-color: var(--ink-black); }
</style>

<script>
const C = {
  activeCatId: "people",
  activeEntryId: "han_xingke",
  cats: [
    { id:"people",   num:"壹", name:"人物", en:"PEOPLE" },
    { id:"places",   num:"貳", name:"地名", en:"PLACES" },
    { id:"items",    num:"參", name:"器物", en:"ITEMS" },
    { id:"lore",     num:"肆", name:"典故", en:"LORE" },
    { id:"factions", num:"伍", name:"宗派", en:"FACTIONS" }
  ],
  entries: {
    people: [
      { id:"han_xingke", name:"風行客", tag:"主角", glyph:"客", stamp:"識",
        title:"風 行 客", cat:"人物 · 主 角",
        paragraphs:[
          "原名不可考，自漠北归来后改字「行客」。<em>性沉默，重情</em>，少时与灵儿之母为邻。",
          "经雪行三日，归故里时，已不见旧人。火堆旁的先生只点头，未问其行止。"
        ],
        meta:[["登场","第一幕"],["佩刀","环首汉刀"],["旧职","边镇兵卒"],["乡里","汉之南境"]] },
      { id:"lin_er", name:"灵儿", tag:"幼亲", glyph:"靈", stamp:"親", unread:true,
        title:"灵 儿", cat:"人物 · 故 乡",
        paragraphs:["山村南口井边的稚女。<em>不记得母亲走那年</em>，只记得「井里的鱼会游到天上去」。"],
        meta:[["登场","第三幕"],["年纪","七 余"],["关系","表 妹"]] },
      { id:"xian_sheng", name:"先生", tag:"故人", glyph:"先", stamp:"故",
        title:"先 生", cat:"人物 · 故 乡",
        paragraphs:["山村中独居一老，<em>话少而知人</em>。火堆从不熄，茶常温。问以世事，不答；问以风雨，则点头。"],
        meta:[["登场","第三幕"],["居所","南口火堆旁"],["所执","残卷一束"]] },
      { id:"old_guard", name:"老兵", tag:"出关人", glyph:"卒", stamp:"邊",
        title:"老 兵", cat:"人物 · 配 角",
        paragraphs:["居延关守门的老兵。<em>三声咳，写名字</em>，是出关人的全部仪式。"],
        meta:[["登场","第一幕"],["所属","汉北都尉"]] }
    ],
    places: [
      { id:"han_village", name:"山村南口", tag:"故乡", glyph:"村", stamp:"鄉",
        title:"山 村 南 口", cat:"地名 · 第 三 幕",
        paragraphs:["三幕主舞台。<em>井边湿石</em>、火堆、旧屋三景共存。雨初停时最为静谧。"],
        meta:[["所属","汉之南境"],["居民","二十余户"],["特产","麦饼 · 柴米"]] },
      { id:"juyan_pass", name:"居延关", tag:"边关", glyph:"關", stamp:"邊",
        title:"居 延 关", cat:"地名 · 第 一 幕",
        paragraphs:["汉之北门。<em>雪夜出关，少有归人</em>。守军三班，关吏一人。"],
        meta:[["所属","汉 北"],["特产","茯 苓"],["关吏","老 兵"]] },
      { id:"han_road", name:"漠北古道", tag:"古道", glyph:"道", stamp:"行",
        title:"漠 北 古 道", cat:"地名 · 第 二 幕",
        paragraphs:["三日大雪，<em>白茫茫的古道</em>上只剩车辙和孤丐。"],
        meta:[["地势","平 坦"],["险情","饿 狼"]] }
    ],
    items: [
      { id:"han_dao", name:"环首汉刀", tag:"兵器 · 上品", glyph:"刀", stamp:"兵",
        title:"环 首 汉 刀", cat:"器物 · 兵 器",
        paragraphs:["汉之直刃。<em>朴素如山，沉稳如根</em>。环首一圆，绳穗一束，可挂于腰。"],
        meta:[["产地","并 州"],["重量","二斤四两"],["匠人","失 名"]] },
      { id:"qing_yu", name:"青玉玦", tag:"饰物", glyph:"玦", stamp:"親", unread:true,
        title:"青 玉 玦", cat:"器物 · 佩 饰",
        paragraphs:["母亲遗物。<em>玉色青而有纹</em>，旧裂处以红丝缝合，意「不离」。"],
        meta:[["来历","母 亲"],["价值","不 可 估"]] },
      { id:"hu_qiu", name:"御寒裘", tag:"衣物", glyph:"裘", stamp:"暖",
        title:"御 寒 裘", cat:"器物 · 衣 物",
        paragraphs:["雪行中所赠。<em>厚而不重</em>，雪夜披之，可见夜灯。"],
        meta:[["来历","路遇丐者"],["材质","羊 毛"]] }
    ],
    lore: [
      { id:"rtt_origin", name:"潜行之始", tag:"系统", glyph:"潛", stamp:"術",
        title:"潜 行 · 古 之 斥 候", cat:"典故 · 系 统",
        paragraphs:["「潜行」者，<em>近敌而不接战</em>之术也。源于汉边骑兵之斥候法，今为本作潜行系统之名。"],
        meta:[["首演","影崖敌寨"],["源流","汉边斥候"]] },
      { id:"han_jian", name:"汉简残卷", tag:"残卷", glyph:"簡", stamp:"密", unread:true,
        title:"汉 简 残 卷", cat:"典故 · 机 要",
        paragraphs:["残竹简上字迹斑驳，<em>「寒土孤山」</em>四字尚清，余字含糊难辨。"],
        meta:[["现存","三 块 余"],["所司","机 要"]] }
    ],
    factions: [
      { id:"border_guard", name:"汉边骑", tag:"正", glyph:"邊", stamp:"汉",
        title:"汉 边 骑", cat:"宗派 · 官",
        paragraphs:["北境守军。<em>朴正而苦寒</em>，以斥候法著称。三班守关，雪夜不眠。"],
        meta:[["旗号","赤"],["所属","汉北都尉"],["人数","三 百 余"]] },
      { id:"shadow_cliff", name:"影崖兵", tag:"敌", glyph:"影", stamp:"敵",
        title:"影 崖 兵", cat:"宗派 · 敌",
        paragraphs:["悬崖上的兵寨。<em>飞鸟不至</em>，潜行系统在此首演。"],
        meta:[["所属","〔未知〕"],["据点","影 崖"]] }
    ]
  }
};

function setCat(id) {
  if (!C.entries[id]) return;
  C.activeCatId = id;
  const first = C.entries[id][0];
  if (first) C.activeEntryId = first.id;
  render();
}
function setEntry(id) {
  const list = C.entries[C.activeCatId];
  const e = list && list.find(x => x.id === id);
  if (!e) return;
  C.activeEntryId = id;
  e.unread = false;
  renderEntries(); renderScroll();
}
function cycleCat(d) {
  const i = C.cats.findIndex(c => c.id === C.activeCatId);
  setCat(C.cats[(i + d + C.cats.length) % C.cats.length].id);
}
function cycleEntry(d) {
  const list = C.entries[C.activeCatId];
  const i = list.findIndex(e => e.id === C.activeEntryId);
  setEntry(list[(i + d + list.length) % list.length].id);
}

function renderCats() {
  const wrap = document.querySelector(".cats");
  wrap.innerHTML = "";
  C.cats.forEach(c => {
    const node = document.createElement("div");
    node.className = "cat" + (c.id === C.activeCatId ? " active" : "");
    node.innerHTML = `<div class="cat-num">${c.num}</div><div class="cat-name">${c.name}</div><div class="cat-en">${c.en}</div>`;
    node.addEventListener("click", () => setCat(c.id));
    wrap.appendChild(node);
  });
}
function renderEntries() {
  const wrap = document.querySelector(".entries");
  const list = C.entries[C.activeCatId] || [];
  const cat = C.cats.find(c => c.id === C.activeCatId);
  const unreadCount = list.filter(e => e.unread).length;
  wrap.innerHTML = `
    <div class="entries-head">
      <div class="entries-h-name">分 卷 · ${cat.name}</div>
      <div class="entries-h-count">${list.length} 条${unreadCount ? ' · ' + unreadCount + ' 新' : ''}</div>
    </div>`;
  list.forEach(e => {
    const node = document.createElement("div");
    let cls = "entry-row";
    if (e.id === C.activeEntryId) cls += " active";
    if (e.unread) cls += " unread";
    node.className = cls;
    node.innerHTML = `<div class="entry-name">${e.name}</div><div class="entry-tag">${e.tag}</div>`;
    node.addEventListener("click", () => setEntry(e.id));
    wrap.appendChild(node);
  });
}
function renderScroll() {
  const list = C.entries[C.activeCatId] || [];
  const e = list.find(x => x.id === C.activeEntryId) || list[0];
  const wrap = document.querySelector(".scroll-pane");
  if (!e) { wrap.innerHTML = ""; return; }
  const paragraphs = (e.paragraphs || []).map(p => `<p>${p}</p>`).join("");
  const metaRows = (e.meta || []).map(m => `<div class="scroll-meta-row"><span>${m[0]}</span><span class="v">${m[1]}</span></div>`).join("");
  wrap.innerHTML = `
    <div class="scroll-grid">
      <div class="col-left">
        <div class="scroll-head">
          <div class="scroll-cat">${e.cat}</div>
          <div class="scroll-title">${e.title}</div>
          <div class="scroll-stamp">${e.stamp || "識"}</div>
        </div>
        <div class="scroll-body">${paragraphs}</div>
      </div>
      <div class="col-right">
        <div class="plate">
          <div class="plate-glyph">${e.glyph || ""}</div>
          <div class="plate-caption">PLACEHOLDER · 待 绘</div>
        </div>
        <div class="scroll-meta">
          <h4>诸 数</h4>
          ${metaRows}
        </div>
      </div>
    </div>`;
}
function render() { renderCats(); renderEntries(); renderScroll(); }

document.addEventListener("keydown", (e) => {
  if (e.key === "q" || e.key === "Q" || e.key === "e" || e.key === "E") return;
  if (e.key === "Tab") { e.preventDefault(); cycleCat(e.shiftKey ? -1 : 1); }
  else if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); cycleEntry(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); cycleEntry(1); }
  else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); cycleCat(-1); }
  else if (e.key === "ArrowRight"|| e.key === "d" || e.key === "D") { e.preventDefault(); cycleCat(1); }
});

render();
</script>
<script src="nav-tabs.js"></script>
</body>
</html>
