<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<title>一介 · 行迹录 · Journal</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="nav-tabs.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    width: 1280px; height: 720px; position: relative;
    color: var(--ink-black); font-family: var(--font-kai);
    --safe-x: 56px;
  }
  .stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 42vw 30vh at 49% 24%, rgba(255,255,255,.78), transparent 72%),
      radial-gradient(ellipse 50vw 38vh at 52% 58%, rgba(214,226,238,.42), transparent 78%),
      radial-gradient(ellipse 22vw 18vh at 9% 94%, rgba(115,132,145,.30), transparent 72%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='59'/><feColorMatrix values='0 0 0 0 0.60 0 0 0 0 0.66 0 0 0 0 0.72 0 0 0 0.16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
      linear-gradient(180deg, #F1F5FA 0%, #E7EEF6 46%, #DDE6EF 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' seed='23'/><feColorMatrix values='0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.84 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .body {
    position: absolute;
    top: 64px; left: 0; right: 0; bottom: 60px;
    z-index: 2;
    display: grid;
    grid-template-columns: 320px 1fr 280px;
  }

  /* === 左：章回列表 === */
  .list {
    padding: 26px 18px 26px 28px;
    display: flex; flex-direction: column; gap: 12px;
    border-right: 1px solid rgba(15,20,24,.10);
  }
  .list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(15,20,24,.10);
    margin-bottom: 4px;
  }
  .list-title {
    font-family: var(--font-kai); font-size: 14px; letter-spacing: 0.36em;
    font-weight: 900; color: var(--ink-black);
  }
  .list-count {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.55);
  }
  .entry {
    position: relative;
    padding: 14px 16px 14px 22px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.16);
    cursor: pointer; transition: all .14s ease;
  }
  .entry::before {
    /* 章回卷轴侧边的朱印封绳 */
    content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px;
    width: 2px;
    background: rgba(15,20,24,.32);
  }
  .entry:hover { transform: translateX(3px); border-color: rgba(15,20,24,.5); }
  .entry.active {
    background: var(--ink-black); color: rgba(248,251,255,.96);
    border-color: var(--ink-black);
    box-shadow: 0 8px 22px rgba(20,28,36,.32);
  }
  .entry.active::before { background: var(--zhusha, #B83A1C); width: 3px; }
  .entry-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .entry-name {
    font-family: var(--font-kai); font-size: 15px; font-weight: 700;
    letter-spacing: 0.18em; color: inherit;
  }
  .entry-state {
    font-family: var(--font-kai); font-size: 11px; letter-spacing: 0.22em;
    padding: 2px 8px;
    border: 1px solid rgba(15,20,24,.32);
    color: rgba(20,24,26,.86);
    white-space: nowrap;
  }
  .entry.active .entry-state { border-color: rgba(248,251,255,.55); color: rgba(248,251,255,.96); }
  .entry-state.done { background: rgba(35,43,50,.10); }
  .entry-state.now  { background: var(--zhusha, #B83A1C); border-color: var(--zhusha, #B83A1C); color: rgba(248,251,255,.96); }
  .entry-state.todo { color: rgba(35,43,50,.5); border-color: rgba(35,43,50,.32); border-style: dashed; }
  .entry.active .entry-state.now { background: rgba(248,251,255,.96); color: var(--zhusha, #B83A1C); border-color: rgba(248,251,255,.96); }
  .entry-where {
    margin-top: 6px;
    font-family: var(--font-kai); font-size: 11px; letter-spacing: 0.18em;
    color: rgba(35,43,50,.6);
  }
  .entry.active .entry-where { color: rgba(214,226,238,.6); }

  /* === 中：长卷正文 === */
  .scroll {
    padding: 26px 36px 26px 32px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(15,20,24,.18) transparent;
    background: linear-gradient(180deg, rgba(248,251,255,.42) 0%, rgba(232,240,247,.16) 100%);
  }
  .scroll-head {
    position: relative;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid rgba(15,20,24,.14);
  }
  .scroll-act {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.42em;
    color: rgba(35,43,50,.55);
  }
  .scroll-title {
    margin-top: 6px;
    font-family: var(--font-kai); font-size: 32px; font-weight: 900;
    letter-spacing: 0.16em; color: var(--ink-black);
    line-height: 1.15;
  }
  .scroll-stamp {
    position: absolute; top: 0; right: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 20px; font-weight: 900;
    color: rgba(248,251,255,.96);
    background: var(--zhusha, #B83A1C);
    transform: rotate(-3deg);
  }
  .scroll-stamp.done { background: var(--ink-black); }
  .scroll-stamp.todo { background: rgba(35,43,50,.42); }

  .scroll-summary {
    font-family: var(--font-kai); font-size: 14px; line-height: 1.95;
    letter-spacing: 0.10em; color: rgba(20,24,26,.88);
    text-wrap: pretty;
    padding: 14px 22px 14px 28px;
    background: rgba(248,251,255,.74);
    border: 1px solid rgba(15,20,24,.10);
    position: relative;
    margin-bottom: 22px;
  }
  .scroll-summary::before, .scroll-summary::after {
    /* 引号装饰 */
    position: absolute;
    font-family: var(--font-kai); font-weight: 900;
    color: rgba(15,20,24,.32);
    pointer-events: none;
  }
  .scroll-summary::before {
    content: "「"; top: 4px; left: 4px;
    font-size: 24px;
  }
  .scroll-summary::after {
    content: "」"; bottom: 4px; right: 4px;
    font-size: 24px;
  }

  /* 时间线 */
  .timeline-h {
    font-family: var(--font-kai); font-size: 12px; font-weight: 900;
    letter-spacing: 0.42em; color: rgba(35,43,50,.6);
    margin-bottom: 12px;
    border-left: 2px solid var(--ink-black); padding-left: 8px;
  }
  .timeline {
    position: relative;
    padding-left: 22px;
  }
  .timeline::before {
    content: ""; position: absolute;
    left: 4px; top: 8px; bottom: 8px;
    width: 1px;
    background: repeating-linear-gradient(180deg,
      rgba(15,20,24,.42) 0 6px,
      transparent 6px 12px);
  }
  .step {
    position: relative;
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0;
  }
  .step::before {
    content: ""; position: absolute;
    left: -22px; top: 16px;
    width: 9px; height: 9px;
    background: rgba(248,251,255,.96);
    border: 1.5px solid rgba(15,20,24,.55);
    transform: rotate(45deg);
  }
  .step.done::before { background: var(--ink-black); border-color: var(--ink-black); }
  .step.now::before {
    background: var(--zhusha, #B83A1C); border-color: var(--zhusha, #B83A1C);
    box-shadow: 0 0 0 3px rgba(184,58,28,.22), 0 0 12px rgba(184,58,28,.5);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .step.todo::before { border-style: dashed; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(184,58,28,.22), 0 0 12px rgba(184,58,28,.5); }
    50%     { box-shadow: 0 0 0 6px rgba(184,58,28,.10), 0 0 18px rgba(184,58,28,.7); }
  }
  .step .stamp {
    flex: 0 0 auto;
    font-family: var(--font-kai); font-size: 12px; font-weight: 900;
    letter-spacing: 0.28em; color: var(--ink-black);
    padding: 2px 8px;
    background: rgba(248,251,255,.7);
    border: 1px solid rgba(15,20,24,.32);
    min-width: 56px; text-align: center;
  }
  .step.done .stamp { background: rgba(35,43,50,.08); }
  .step.now .stamp  { background: var(--zhusha, #B83A1C); color: rgba(248,251,255,.96); border-color: var(--zhusha, #B83A1C); }
  .step.todo .stamp { color: rgba(35,43,50,.5); border-style: dashed; }
  .step .text {
    flex: 1; padding-top: 3px;
    font-family: var(--font-kai); font-size: 13px; line-height: 1.7;
    letter-spacing: 0.06em; color: rgba(20,24,26,.86);
  }
  .step.todo .text { color: rgba(35,43,50,.55); }
  .step.done .text { text-decoration: line-through; text-decoration-color: rgba(20,24,26,.32); }

  /* === 右：机要 === */
  .meta {
    padding: 26px 28px;
    border-left: 1px solid rgba(15,20,24,.10);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(15,20,24,.18) transparent;
  }
  .meta-head {
    padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid rgba(15,20,24,.14);
  }
  .meta-h-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.42em;
    color: rgba(35,43,50,.55);
  }
  .meta-h-name {
    margin-top: 4px;
    font-family: var(--font-kai); font-size: 18px; font-weight: 900;
    letter-spacing: 0.20em; color: var(--ink-black);
  }
  .meta-section { margin-bottom: 18px; }
  .meta-section h4 {
    font-family: var(--font-kai); font-size: 11px; font-weight: 900;
    letter-spacing: 0.42em; color: rgba(35,43,50,.6);
    margin-bottom: 8px;
    border-left: 2px solid var(--ink-black); padding-left: 8px;
  }
  .meta-row {
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.10);
    margin-bottom: 4px;
    font-family: var(--font-kai); font-size: 12px;
  }
  .meta-row > span:first-child { color: rgba(35,43,50,.6); letter-spacing: 0.16em; }
  .meta-row > .v { color: var(--ink-black); font-weight: 900; letter-spacing: 0.10em; }
  .reward {
    padding: 12px;
    background: linear-gradient(180deg, rgba(184,58,28,.06), rgba(184,58,28,.02));
    border: 1px solid rgba(184,58,28,.42);
    margin-bottom: 14px;
  }
  .reward-label {
    font-family: var(--font-kai); font-size: 11px; letter-spacing: 0.32em;
    color: var(--zhusha, #B83A1C);
    margin-bottom: 4px;
  }
  .reward-name {
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
    letter-spacing: 0.16em; color: var(--ink-black);
  }
  .meta-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .btn {
    flex: 1; padding: 9px 10px;
    font-family: var(--font-kai); font-size: 12px; font-weight: 700;
    letter-spacing: 0.32em;
    border: 1px solid rgba(15,20,24,.55);
    background: rgba(248,251,255,.7); color: var(--ink-black);
    cursor: pointer; transition: all .14s ease;
  }
  .btn:hover { background: rgba(232,240,247,.9); }
  .btn.primary { background: var(--ink-black); color: rgba(248,251,255,.96); border-color: var(--ink-black); }
  .btn.primary:hover { transform: translateY(-1px); }

  /* === footer === */
  .footer-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: 60px; padding: 0 var(--safe-x);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(0deg, rgba(232,240,247,.8) 0%, rgba(248,251,255,0) 100%);
    border-top: 1px solid rgba(15,20,24,.10);
  }
  .footer-meta {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.55);
  }
  .footer-meta .label-cn {
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
    letter-spacing: 0.32em; color: var(--ink-black); margin-right: 10px;
  }
  .prompts { display: flex; align-items: center; gap: 18px; }
  .prompt {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0.22em;
    color: rgba(20,24,26,.86);
  }
  .km {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 8px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--ink-black);
    background: rgba(248,251,255,.95);
    border: 1.2px solid rgba(15,20,24,.55);
    border-radius: 11px;
  }
  .km.cross { color: rgba(248,251,255,.96); background: var(--ink-black); border-color: var(--ink-black); }

  .toast {
    position: absolute; left: 50%; top: 84px;
    transform: translateX(-50%) translateY(-12px);
    padding: 10px 18px;
    background: var(--ink-black); color: rgba(248,251,255,.96);
    font-family: var(--font-kai); font-size: 13px; letter-spacing: 0.28em;
    z-index: 9; opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main class="stage">
  <div class="grain"></div>

  <nav class="nav-tabs" data-current="journal" aria-label="界面切换">
    <span class="tk-key l">L1</span>
    <div class="tabs-row">
      <a class="tab-link" data-screen="map">地图</a>
      <a class="tab-link" data-screen="journal">日志</a>
      <a class="tab-link" data-screen="inventory">行囊</a>
      <a class="tab-link" data-screen="skills">武学</a>
      <a class="tab-link" data-screen="codex">收藏</a>
      <a class="tab-link" data-screen="settings">設定</a>
    </div>
    <span class="tk-key r">R1</span>
    <div class="nav-right">
      <span class="chap-num">壹</span>
      <span class="meta-coin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <rect x="9.5" y="9.5" width="5" height="5"></rect>
        </svg>
        596
      </span>
    </div>
  </nav>

  <div class="body">
    <aside class="list">
      <div class="list-head">
        <div class="list-title">行 迹 · 章 回</div>
        <div class="list-count">3 / 7</div>
      </div>
      <div class="list-body"></div>
    </aside>
    <section class="scroll"></section>
    <aside class="meta"></aside>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta"><span class="label-cn">行 迹 录</span>七章 · 三章已成 · 一章在行</div>
    <div class="prompts">
      <span class="prompt"><span class="km">L1·R1</span>切换</span>
      <span class="prompt"><span class="km">↑↓</span>选章</span>
      <span class="prompt"><span class="km cross">✕</span>跟随</span>
    </div>
  </footer>

  <div class="toast" aria-live="polite"></div>
</main>

<script>
const J = {
  activeId: "act3_village",
  entries: [
    { id:"act1_pass", name:"第一幕 · 出关", state:"done", where:"汉土北境 · 居延关",
      act:"第一幕 · 已成", title:"出 居 延 关",
      summary:"雪夜出关。守门的老兵咳了三声，把我的名字写在出关簿子的末页。",
      steps:[
        { stamp:"〇·〇一", state:"done", text:"领出关文牒。" },
        { stamp:"〇·〇二", state:"done", text:"与守门老兵告别。" },
        { stamp:"〇·〇三", state:"done", text:"出关，雪夜启程。" }],
      meta:[["领位人","老 兵"],["地标","居延关"],["时辰","戌·三"]],
      reward:"碎银 · 出关文牒"
    },
    { id:"act2_road", name:"第二幕 · 雪行", state:"done", where:"漠北 · 古道",
      act:"第二幕 · 已成", title:"雪 行 · 见 无 名 丐 者",
      summary:"茫雪压了三日，路上只剩一个无名的丐者。他没说话，只是望了望天，又望了望我。",
      steps:[
        { stamp:"〇·〇一", state:"done", text:"翻越冰原断崖。" },
        { stamp:"〇·〇二", state:"done", text:"路遇丐者，留半块干粮。" },
        { stamp:"〇·〇三", state:"done", text:"入山村，遇先生。" }],
      meta:[["领位人","〔无〕"],["地标","漠北古道"],["时辰","卯·五"]],
      reward:"御寒裘 · 干粮 ×3"
    },
    { id:"act3_village", name:"第三幕 · 山村回忆", state:"now", where:"寒土孤山 · 山村",
      act:"第三幕 · 在 行 · 进度 七成", title:"山 村 回 忆 · 灵 儿 戏 水",
      summary:"回到山村旧居。雨初停，竹梢上挂着水珠。灵儿在井边戏水，似乎已不记得母亲走的那年。先生说，孩子忘事是福气。",
      steps:[
        { stamp:"〇·〇一", state:"done", text:"在井边遇见灵儿。" },
        { stamp:"〇·〇二", state:"done", text:"陪她说了几句关于母亲的事。" },
        { stamp:"〇·〇三", state:"now",  text:"返回山村南口的旧屋。" },
        { stamp:"〇·〇四", state:"todo", text:"取出母亲留下的青玉玦。" },
        { stamp:"〇·〇五", state:"todo", text:"与先生作别。" }],
      meta:[["领位人","先 生"],["地标","山村南口"],["时辰","廿二·四一"]],
      reward:"母亲的青玉玦"
    },
    { id:"act4_capital", name:"第四幕 · 长安", state:"todo", where:"〔旧都〕 · 待",
      act:"第四幕 · 待启", title:"旧 都 · 长 安",
      summary:"故国都城。残碑断瓦，问之者寡。",
      steps:[
        { stamp:"?", state:"todo", text:"〔尚未触发〕" }],
      meta:[["领位人","〔未知〕"],["地标","旧都 · 长安"]],
      reward:"〔未知〕"
    },
    { id:"chapter_jian", name:"残卷 · 汉简", state:"todo", where:"〔机要 · 待〕",
      act:"残 卷 · 隐", title:"残 卷 · 汉 简",
      summary:"残竹简上字迹斑驳，「寒土孤山」四字尚清，余字含糊难辨。",
      steps:[
        { stamp:"?", state:"todo", text:"找回三块汉简残片。" },
        { stamp:"?", state:"todo", text:"寻通晓汉文的隐者。" }],
      meta:[["领位人","〔机要〕"],["地标","〔未知〕"]],
      reward:"〔残卷之机要〕"
    }
  ]
};

const STATE_LABEL = { done:"已 成", now:"在 行", todo:"待 启" };
const STAMP_CHAR  = { done:"成", now:"行", todo:"待" };

function showToast(msg) {
  const t = document.querySelector(".toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1600);
}

function renderList() {
  const wrap = document.querySelector(".list-body");
  wrap.innerHTML = "";
  J.entries.forEach(e => {
    const node = document.createElement("div");
    node.className = "entry" + (e.id === J.activeId ? " active" : "");
    node.innerHTML = `
      <div class="entry-row">
        <div class="entry-name">${e.name}</div>
        <div class="entry-state ${e.state}">${STATE_LABEL[e.state]}</div>
      </div>
      <div class="entry-where">${e.where}</div>`;
    node.addEventListener("click", () => setEntry(e.id));
    wrap.appendChild(node);
  });
}
function renderScroll() {
  const e = J.entries.find(x => x.id === J.activeId);
  if (!e) return;
  const wrap = document.querySelector(".scroll");
  const stepsHtml = e.steps.map(s => `
    <div class="step ${s.state}">
      <span class="stamp">${s.stamp}</span>
      <span class="text">${s.text}</span>
    </div>`).join("");
  wrap.innerHTML = `
    <div class="scroll-head">
      <div class="scroll-act">${e.act}</div>
      <div class="scroll-title">${e.title}</div>
      <div class="scroll-stamp ${e.state}">${STAMP_CHAR[e.state]}</div>
    </div>
    <div class="scroll-summary">${e.summary}</div>
    <div class="timeline-h">线 脉</div>
    <div class="timeline">${stepsHtml}</div>`;
}
function renderMeta() {
  const e = J.entries.find(x => x.id === J.activeId);
  if (!e) return;
  const wrap = document.querySelector(".meta");
  const rows = e.meta.map(m => `<div class="meta-row"><span>${m[0]}</span><span class="v">${m[1]}</span></div>`).join("");
  wrap.innerHTML = `
    <div class="meta-head">
      <div class="meta-h-label">机 要</div>
      <div class="meta-h-name">${e.name.split(" · ")[1] || e.name}</div>
    </div>
    <div class="meta-section">
      <h4>诸 事</h4>
      ${rows}
    </div>
    <div class="meta-section">
      <h4>奖 赏</h4>
      <div class="reward">
        <div class="reward-label">REWARD</div>
        <div class="reward-name">${e.reward}</div>
      </div>
    </div>
    <div class="meta-actions">
      <button class="btn primary" onclick="follow()">${e.state === 'done' ? '已 成' : (e.state === 'now' ? '跟 随' : '关 注')}</button>
      <button class="btn" onclick="showToast('已 标 记')">标 记</button>
    </div>`;
}

function setEntry(id) {
  J.activeId = id;
  renderList(); renderScroll(); renderMeta();
}
function follow() {
  const e = J.entries.find(x => x.id === J.activeId);
  if (!e) return;
  if (e.state === "done") showToast("此章已成");
  else if (e.state === "todo") showToast("尚未启此章");
  else showToast(`跟随：${e.name}`);
}
function cycle(d) {
  const i = J.entries.findIndex(e => e.id === J.activeId);
  setEntry(J.entries[(i + d + J.entries.length) % J.entries.length].id);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "q" || e.key === "Q" || e.key === "e" || e.key === "E") return;
  if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); cycle(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); cycle(1); }
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); follow(); }
});

renderList(); renderScroll(); renderMeta();
</script>
<script src="nav-tabs.js"></script>
</body>
</html>
