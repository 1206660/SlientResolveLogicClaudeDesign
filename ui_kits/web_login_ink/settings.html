<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<title>一介 · 议政厅 · Settings</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="nav-tabs.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    width: 1280px; height: 720px; position: relative;
    color: var(--ink-black); font-family: var(--font-kai);
    --safe-x: 56px; --safe-y: 38px;
  }

  /* ============ STAGE BG (matches Title screen) ============ */
  .stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 42vw 30vh at 49% 24%, rgba(255,255,255,.78), transparent 72%),
      radial-gradient(ellipse 50vw 38vh at 52% 58%, rgba(214,226,238,.42), transparent 78%),
      radial-gradient(ellipse 22vw 18vh at 9% 94%, rgba(115,132,145,.30), transparent 72%),
      radial-gradient(ellipse 24vw 20vh at 86% 92%, rgba(190,202,214,.24), transparent 74%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='59'/><feColorMatrix values='0 0 0 0 0.60 0 0 0 0 0.66 0 0 0 0 0.72 0 0 0 0.16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
      linear-gradient(180deg, #F1F5FA 0%, #E7EEF6 46%, #DDE6EF 100%);
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle 1.2px at 7% 18%, rgba(255,255,255,.88), transparent 72%),
      radial-gradient(circle 1px   at 89% 10%, rgba(255,255,255,.76), transparent 72%),
      radial-gradient(circle 1.4px at 91% 30%, rgba(255,255,255,.88), transparent 72%);
    opacity: .86;
  }
  .horizon {
    position: absolute; inset: auto 0 0 0; height: 22vh; pointer-events: none; z-index: 0;
    background:
      linear-gradient(0deg, rgba(36,43,48,.26), transparent 65%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 420' preserveAspectRatio='none'><path d='M0 330 C160 270 260 355 410 300 C520 260 640 350 790 300 C940 245 1030 345 1200 292 C1370 240 1480 335 1600 278 L1600 420 L0 420 Z' fill='%233A4146' opacity='.26'/><path d='M0 405 C250 360 460 393 700 350 C980 302 1210 388 1600 330 L1600 420 L0 420 Z' fill='%23080A0B' opacity='.16'/></svg>");
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' seed='23'/><feColorMatrix values='0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.84 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ============ PAGE HEADER (sub-header under nav) ============ */
  .topbar {
    position: absolute; top: calc(64px + 18px); left: var(--safe-x); right: var(--safe-x);
    z-index: 4;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(15,20,24,.14);
  }
  .bc-kanji {
    font-family: var(--font-kai); font-size: 32px; font-weight: 900;
    letter-spacing: 0.20em; color: var(--ink-black);
    line-height: 1;
  }
  .bc-kanji::before {
    content: "壹"; display: inline-block; vertical-align: 0.16em;
    margin-right: 14px; padding: 3px 9px;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0;
    color: rgba(248,251,255,.94); background: var(--ink-black);
  }
  .bc-path {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.62);
    display: flex; align-items: center; gap: 10px;
  }
  .bc-path .sep { color: rgba(35,43,50,.32); }
  .bc-path .cur { color: var(--ink-black); font-family: var(--font-kai); font-weight: 900; font-size: 13px; letter-spacing: 0.30em; }

  /* corner seal */
  .corner-seal {
    position: absolute; top: var(--safe-y); right: calc(var(--safe-x) + 0px);
    width: 38px; height: 56px; z-index: 5;
    display: none; align-items: center; justify-content: center;
    writing-mode: vertical-rl;
    color: rgba(20,24,26,.74);
    background: rgba(235,240,246,.42);
    border: 1.5px solid rgba(42,48,52,.55);
    box-shadow: 0 8px 18px rgba(66,78,88,.15), inset 0 0 0 2px rgba(255,255,255,.28);
    font-size: 14px; letter-spacing: 0.08em;
  }

  /* ============ BODY ============ */
  .body {
    position: absolute;
    top: calc(64px + 18px + 56px + 18px);
    left: var(--safe-x); right: var(--safe-x);
    bottom: 76px;
    z-index: 2;
    display: grid;
    grid-template-columns: 232px 1fr;
    gap: 22px;
  }

  /* sidebar */
  .sidebar {
    padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(248,251,255,.54);
    border: 1px solid rgba(30,38,45,.14);
    box-shadow: 0 26px 86px rgba(73,91,108,.16), inset 0 0 0 1px rgba(255,255,255,.32);
    backdrop-filter: blur(5px);
    overflow: hidden;
  }
  .sidebar-label {
    padding: 8px 11px 10px;
    color: rgba(89,105,118,.50); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.42em;
  }
  .cat {
    position: relative;
    display: grid; grid-template-columns: 38px 1fr; column-gap: 12px;
    align-items: center;
    min-height: 60px;
    padding: 10px 14px 10px 38px;
    background: rgba(255,255,255,.12);
    border: 1px solid transparent;
    color: var(--ink-black);
    cursor: pointer;
    transition: all 160ms ease;
  }
  .cat::before {
    content: ""; position: absolute; left: 12px; top: 50%;
    width: 18px; height: 1.5px;
    background: rgba(18,23,27,.28); transform: translateY(-50%);
    transition: width 160ms ease, height 160ms ease;
  }
  .cat:hover, .cat.active {
    transform: translateX(4px);
    background: rgba(255,255,255,.62);
    border-color: rgba(9,12,14,.28);
    box-shadow: 0 18px 42px rgba(80,98,116,.13), inset 0 -2px 0 rgba(5,7,8,.32);
  }
  .cat.active::before { width: 22px; height: 3px; background: rgba(0,0,0,.86); }
  .cat-num {
    grid-row: 1 / 3;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(18,23,27,.62);
    border: 1px solid rgba(18,23,27,.18);
    background: rgba(255,255,255,.18);
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
  }
  .cat.active .cat-num { color: var(--paper); background: var(--ink-black); border-color: var(--ink-black); }
  .cat-name { font-size: 17px; letter-spacing: 0.22em; font-weight: 900; color: var(--ink-black); }
  .cat-en { margin-top: 2px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.24em; color: rgba(62,74,84,.58); }

  /* content */
  .content {
    position: relative;
    padding: 26px 28px 24px;
    background: rgba(248,251,255,.54);
    border: 1px solid rgba(30,38,45,.14);
    box-shadow: 0 26px 86px rgba(73,91,108,.16), inset 0 0 0 1px rgba(255,255,255,.32);
    backdrop-filter: blur(5px);
    overflow-y: auto; scrollbar-gutter: stable;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: rgba(0,0,0,.04); }
  .content::-webkit-scrollbar-thumb { background: rgba(84,98,109,.32); }

  .section-head {
    display: flex; align-items: end; justify-content: space-between;
    gap: 24px; margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(15,20,24,.12);
  }
  .section-title { font-size: 32px; letter-spacing: 0.18em; font-weight: 900; color: var(--ink-black); line-height: 1; }
  .section-hint {
    max-width: 380px; text-align: right;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
    color: rgba(62,74,84,.66); line-height: 1.5;
  }

  .row {
    display: grid;
    grid-template-columns: 220px 1fr 88px;
    align-items: center;
    gap: 16px;
    min-height: 64px;
    margin-top: 8px;
    padding: 12px 18px;
    background: rgba(255,255,255,.34);
    border: 1px solid rgba(30,38,45,.12);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .row.signature {
    background: linear-gradient(90deg, rgba(255,255,255,.52), rgba(255,255,255,.18));
    border-color: rgba(5,7,8,.28);
  }
  .row.signature::before {
    content: "推荐"; display: inline-block;
    position: absolute; margin-left: -56px; margin-top: -4px;
    padding: 2px 6px;
    font-family: var(--font-kai); font-size: 9px; letter-spacing: 0.24em;
    color: var(--paper); background: var(--zhusha);
  }
  .row-title { font-size: 17px; letter-spacing: 0.16em; font-weight: 900; color: rgba(10,12,14,.92); }
  .row-desc { margin-top: 4px; font-family: var(--font-body); font-size: 11px; letter-spacing: 0.04em; line-height: 1.5; color: rgba(62,74,84,.74); }

  .value {
    justify-self: end; min-width: 64px; text-align: right;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
    color: rgba(5,7,8,.82);
  }
  .value span { color: rgba(89,105,118,.50); }

  /* segmented control */
  .seg {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px;
    border: 1px solid rgba(30,38,45,.12);
    background: rgba(223,232,241,.44);
  }
  .seg-item {
    min-width: 76px; padding: 8px 12px;
    color: rgba(35,43,50,.62);
    font-size: 12px; letter-spacing: 0.12em; text-align: center;
    cursor: pointer;
    transition: all 150ms ease;
  }
  .seg-item:hover { background: rgba(255,255,255,.46); color: var(--ink-black); }
  .seg-item.active {
    background: var(--ink-black); color: var(--paper);
    box-shadow: 0 10px 24px rgba(44,54,64,.20);
  }

  /* toggle */
  .toggle { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
  .toggle-track {
    width: 50px; height: 26px; padding: 3px;
    border: 1px solid rgba(30,38,45,.18);
    background: rgba(223,232,241,.46);
    transition: all 150ms ease;
  }
  .toggle-knob {
    width: 18px; height: 18px;
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(30,38,45,.18);
    box-shadow: 0 5px 12px rgba(54,66,78,.18);
    transition: transform 160ms cubic-bezier(.22,.9,.26,1);
  }
  .toggle.on .toggle-track { background: var(--ink-black); border-color: var(--ink-black); }
  .toggle.on .toggle-knob { transform: translateX(24px); }
  .toggle-label { font-size: 12px; letter-spacing: 0.14em; color: rgba(62,74,84,.74); }

  /* slider */
  .slider-wrap { min-width: 280px; padding: 8px 0; }
  .slider {
    position: relative; height: 4px;
    background: rgba(30,38,45,.14);
    cursor: ew-resize;
  }
  .slider-fill {
    position: absolute; inset: 0 auto 0 0;
    background: linear-gradient(90deg, rgba(5,7,8,.78), rgba(75,88,100,.50));
  }
  .slider-knob {
    position: absolute; top: 50%;
    width: 18px; height: 18px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(248,251,255,.96);
    border: 1px solid rgba(5,7,8,.32);
    box-shadow: 0 8px 18px rgba(44,54,64,.22);
  }
  .slider-ticks {
    margin-top: 6px;
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.20em;
    color: rgba(89,105,118,.42);
  }

  /* preview tile (signature feature) */
  .preview-tile {
    margin-top: 16px; padding: 14px 16px;
    background: rgba(255,255,255,.38);
    border: 1px solid rgba(30,38,45,.14);
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .preview-tile h5 {
    grid-column: 1 / -1;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0.30em;
    color: var(--ink-black);
    padding-bottom: 8px; margin-bottom: 4px;
    border-bottom: 1px dashed rgba(30,38,45,.20);
  }
  .pv {
    height: 64px;
    border: 1px solid rgba(30,38,45,.18);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0.30em;
    color: rgba(20,24,28,.78);
  }
  .pv-default { background: linear-gradient(135deg, #1A1208 0%, #2B1F12 100%); color: rgba(237,223,194,.92); }
  .pv-default::after { content: ""; position: absolute; right: 8px; top: 8px; width: 8px; height: 8px; background: var(--zhusha-bright); }
  .pv-ink { background: linear-gradient(180deg, #F1F5FA 0%, #DDE6EF 100%); color: rgba(5,7,8,.86); }
  .pv-ink::after { content: ""; position: absolute; left: 8px; bottom: 8px; width: 18px; height: 1px; background: rgba(5,7,8,.7); }
  .pv-scroll { background: linear-gradient(180deg, #E8DCC4 0%, #C4B393 100%); color: rgba(40,28,16,.86); filter: contrast(1.05) sepia(0.18); }

  /* action row */
  .action-row {
    display: flex; justify-content: flex-end; gap: 12px;
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid rgba(30,38,45,.10);
  }
  .action-btn {
    min-width: 132px; padding: 11px 18px;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(30,38,45,.18);
    color: rgba(8,10,12,.78);
    font-family: var(--font-kai); font-size: 14px; font-weight: 900; letter-spacing: 0.32em;
    cursor: pointer;
    transition: all 150ms ease;
  }
  .action-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(60,75,90,.16); }
  .action-btn.primary {
    background: var(--ink-black); color: var(--paper);
    border-color: var(--ink-black);
  }

  /* toast */
  .toast {
    position: absolute; right: var(--safe-x); bottom: 90px; z-index: 8;
    min-width: 240px;
    padding: 12px 18px;
    background: rgba(248,251,255,.86);
    border: 1px solid rgba(30,38,45,.22);
    box-shadow: 0 20px 60px rgba(71,88,104,.22);
    color: var(--ink-black);
    font-family: var(--font-kai); font-size: 13px; font-weight: 900; letter-spacing: 0.24em;
    opacity: 0; transform: translateY(12px);
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast::before {
    content: ""; display: inline-block; vertical-align: middle;
    width: 6px; height: 6px; margin-right: 10px;
    background: var(--zhusha); border-radius: 50%;
  }

  /* footer prompts */
  .footer-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: 60px; padding: 0 var(--safe-x);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, transparent, rgba(223,232,241,.62));
    border-top: 1px solid rgba(30,38,45,.10);
  }
  .footer-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.24em; color: rgba(62,74,84,.62); }
  .prompts { display: flex; align-items: center; gap: 22px; }
  .prompt { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.18em; color: rgba(34,42,48,.78); font-family: var(--font-kai); font-weight: 900; }
  .km {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(23,28,32,.42);
    color: rgba(23,28,32,.78);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  }
  .km.cross { background: rgba(255,255,255,.36); }
</style>
</head>
<body>
<main class="stage">
  <div class="horizon"></div>
  <div class="grain"></div>

  <!-- 全局导航 ─ L1/R1 切页 -->
  <nav class="nav-tabs" data-current="settings" aria-label="界面切换">
    <span class="tk-key l">L1</span>
    <div class="tabs-row">
      <a class="tab-link" data-screen="map">地图</a>
      <a class="tab-link" data-screen="journal">日志</a>
      <a class="tab-link" data-screen="inventory">行囊</a>
      <a class="tab-link" data-screen="skills">武学</a>
      <a class="tab-link" data-screen="codex">收藏</a>
      <a class="tab-link active" data-screen="settings">設定</a>
    </div>
    <span class="tk-key r">R1</span>
    <div class="nav-right">
      <span class="chap-num">壹</span>
      <span class="meta-coin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <rect x="9.5" y="9.5" width="5" height="5"></rect>
        </svg>
        596
      </span>
    </div>
  </nav>

  <!-- topbar -->
  <header class="topbar">
    <div class="bc-kanji">設&nbsp;定</div>
    <div class="bc-path">
      <span>主页</span><span class="sep">·</span>
      <span>設定</span><span class="sep">·</span>
      <span class="cur">影像</span>
    </div>
  </header>

  <!-- body -->
  <div class="body">
    <aside class="sidebar"></aside>
    <section class="content"></section>
  </div>

  <!-- footer prompts -->
  <footer class="footer-bar">
    <div class="footer-meta">設定 · 内测版 〇·壹·〇 · 自动保存</div>
    <div class="prompts">
      <span class="prompt"><span class="km">L1·R1</span>切换界面</span>
      <span class="prompt"><span class="km">□</span>切换分类</span>
      <span class="prompt"><span class="km">△</span>恢复默认</span>
      <span class="prompt"><span class="km cross">✕</span>保存</span>
      <span class="prompt"><span class="km">○</span>返回</span>
    </div>
  </footer>

  <div class="toast" aria-live="polite"></div>
</main>

<script>
  const STATE = {
    activeId: "display",
    categories: [
      { id:"display",  numeral:"壹", name:"影像", en:"DISPLAY" },
      { id:"audio",    numeral:"貳", name:"音聲", en:"AUDIO" },
      { id:"controls", numeral:"參", name:"操控", en:"CONTROLS" },
      { id:"gameplay", numeral:"肆", name:"玩法", en:"GAMEPLAY" },
      { id:"access",   numeral:"伍", name:"輔助", en:"ACCESSIBILITY" },
      { id:"account",  numeral:"陸", name:"帳號", en:"ACCOUNT" }
    ],
    sections: {
      display: {
        title: "影像", hint: "八项 · 自动保存 · 推荐配置随设备自适应",
        rows: [
          { id:"template", title:"界面模板", desc:"整体视觉风格 · 切换后将重载界面", kind:"preview", signature:true,
            options:[{id:"Default",label:"默认 · 楷墨"},{id:"Ink",label:"水墨 · Ink"},{id:"Scroll",label:"古卷"}], value:"Ink" },
          { id:"renderMode", title:"画面模式", desc:"性能优先帧率 / 平衡 VRR / 画质优先解析度", kind:"seg",
            options:[{id:"perf",label:"性能 · 60帧"},{id:"balance",label:"平衡 · 40帧"},{id:"quality",label:"画质 · 30帧"}], value:"balance" },
          { id:"hdr", title:"高动态范围", desc:"需电视支持 · 开启后可进入校准", kind:"toggle", value:true, valueText:"1400 尼特", labelOn:"已开 · 标准制式", labelOff:"未开" },
          { id:"motionBlur", title:"运动模糊", desc:"摄像机快速移动时的模糊强度", kind:"slider", value:32, max:100, ticks:["无","弱","中","强"] },
          { id:"camShake", title:"摄像机摇晃", desc:"战斗与奔跑时的屏幕摇晃", kind:"slider", value:60, max:100, ticks:["平稳","常规","强烈"] },
          { id:"subtitleSize", title:"字幕大小", desc:"含说话人标签与背景不透明度", kind:"seg",
            options:[{id:"s",label:"小"},{id:"m",label:"中"},{id:"l",label:"大"},{id:"xl",label:"特大"}], value:"m" },
          { id:"colorblind", title:"色觉辅助", desc:"调整关键 UI 与敌我识别的色彩", kind:"seg",
            options:[{id:"off",label:"关闭"},{id:"rg",label:"红绿"},{id:"by",label:"蓝黄"},{id:"all",label:"全色盲"}], value:"off" }
        ]
      },
      audio: {
        title: "音聲", hint: "五项 · 主音量 80% · 杜比全景声已识别",
        rows: [
          { id:"master", title:"主音量", desc:"总输出 · 影响所有音轨", kind:"slider", value:80, max:100 },
          { id:"music", title:"配乐", desc:"片头 · 战斗 · 探索", kind:"slider", value:70, max:100 },
          { id:"ambient", title:"环境", desc:"风 · 水 · 林 · 远人声", kind:"slider", value:65, max:100 },
          { id:"voice", title:"配音", desc:"对白 · 念白 · 战吼", kind:"slider", value:90, max:100 },
          { id:"subtitleVoice", title:"字幕音", desc:"字幕推送提示音", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" }
        ]
      },
      controls: {
        title: "操控", hint: "DualSense 已连接 · 可外设",
        rows: [
          { id:"vibration", title:"振动", desc:"DualSense 触觉反馈强度", kind:"slider", value:50, max:100 },
          { id:"trigger", title:"自适应扳机", desc:"L2/R2 阻力与战斗节奏匹配", kind:"toggle", value:true, labelOn:"已开 · 战斗强化", labelOff:"已关" },
          { id:"stick", title:"摇杆灵敏度", desc:"右摇杆视角灵敏度", kind:"slider", value:55, max:100 },
          { id:"invertY", title:"反向 Y 轴", desc:"上拉视角下移", kind:"toggle", value:false, labelOn:"已反", labelOff:"标准" }
        ]
      },
      gameplay: {
        title: "玩法", hint: "战斗与提示密度",
        rows: [
          { id:"difficulty", title:"难度", desc:"影响敌人攻击节奏与伤害", kind:"seg",
            options:[{id:"easy",label:"宽悯"},{id:"normal",label:"如常"},{id:"hard",label:"凛冬"}], value:"normal", signature:true },
          { id:"autoLock", title:"自动锁敌", desc:"动作命中前自动吸附目标", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id:"windHint", title:"风向辅助", desc:"潜行时显示风的指向", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id:"rttDensity", title:"RTT 提示密度", desc:"战斗内画面右上提示的密度", kind:"seg",
            options:[{id:"low",label:"少"},{id:"mid",label:"中"},{id:"high",label:"多"}], value:"mid" }
        ]
      },
      access: {
        title: "輔助", hint: "无障碍 · 可与好友配置同步",
        rows: [
          { id:"bigText", title:"大字体", desc:"UI 文本 +20%", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id:"highContrast", title:"高对比", desc:"提升敌我与可交互物的对比度", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id:"oneHand", title:"单手模式", desc:"重要操作合并到单侧手柄", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" },
          { id:"screenReader", title:"屏读", desc:"朗读 UI 焦点", kind:"toggle", value:false, labelOn:"已开", labelOff:"已关" }
        ]
      },
      account: {
        title: "帳號", hint: "云存档与遥测",
        rows: [
          { id:"cloudSync", title:"云存档", desc:"自动同步至 PSN / Steam Cloud", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" },
          { id:"telemetry", title:"匿名使用统计", desc:"用于改进游戏稳定性", kind:"toggle", value:true, labelOn:"已开", labelOff:"已关" }
        ]
      }
    }
  };

  function showToast(text) {
    const t = document.querySelector(".toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function setActive(id) {
    if (!STATE.sections[id]) return;
    STATE.activeId = id;
    document.querySelector(".bc-path .cur").textContent = STATE.categories.find(c => c.id === id).name;
    document.querySelector(".bc-kanji").innerHTML = STATE.categories.find(c => c.id === id).numeral
      ? `<span style="display:inline-block;vertical-align:0.16em;margin-right:16px;padding:4px 10px;font-family:var(--font-kai);font-size:13px;letter-spacing:0;color:rgba(248,251,255,.94);background:var(--ink-black);">${STATE.categories.find(c => c.id === id).numeral}</span>${STATE.sections[id].title}`
      : STATE.sections[id].title;
    renderSidebar(); renderContent();
  }

  function setRowValue(rowId, val) {
    const sec = STATE.sections[STATE.activeId];
    const r = sec.rows.find(x => x.id === rowId);
    if (!r) return;
    r.value = val;
    renderContent();
  }

  function renderSidebar() {
    const el = document.querySelector(".sidebar");
    el.innerHTML = `<div class="sidebar-label">SETTINGS</div>`;
    STATE.categories.forEach(cat => {
      const node = document.createElement("div");
      node.className = "cat" + (cat.id === STATE.activeId ? " active" : "");
      node.innerHTML = `
        <div class="cat-num">${cat.numeral}</div>
        <div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-en">${cat.en}</div>
        </div>`;
      node.addEventListener("click", () => setActive(cat.id));
      el.appendChild(node);
    });
  }

  function renderContent() {
    const el = document.querySelector(".content");
    const sec = STATE.sections[STATE.activeId];
    el.innerHTML = "";

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<div class="section-title">${sec.title}</div><div class="section-hint">${sec.hint}</div>`;
    el.appendChild(head);

    sec.rows.forEach(row => {
      const node = document.createElement("div");
      node.className = "row" + (row.signature ? " signature" : "");
      node.style.position = "relative";

      const t = document.createElement("div");
      t.innerHTML = `<div class="row-title">${row.title}</div><div class="row-desc">${row.desc}</div>`;
      node.appendChild(t);

      const ctrl = document.createElement("div");
      const val = document.createElement("div");
      val.className = "value";

      if (row.kind === "seg" || row.kind === "preview") {
        const seg = document.createElement("div");
        seg.className = "seg";
        row.options.forEach(opt => {
          const it = document.createElement("div");
          it.className = "seg-item" + (opt.id === row.value ? " active" : "");
          it.textContent = opt.label;
          it.addEventListener("click", () => setRowValue(row.id, opt.id));
          seg.appendChild(it);
        });
        ctrl.appendChild(seg);
        const cur = row.options.find(o => o.id === row.value);
        val.textContent = cur ? cur.label.split(" · ")[0] : "";
      } else if (row.kind === "toggle") {
        const w = document.createElement("div");
        w.className = "toggle" + (row.value ? " on" : "");
        w.innerHTML = `<div class="toggle-track"><div class="toggle-knob"></div></div><div class="toggle-label">${row.value ? (row.labelOn||"已开") : (row.labelOff||"已关")}</div>`;
        w.addEventListener("click", () => setRowValue(row.id, !row.value));
        ctrl.appendChild(w);
        val.innerHTML = row.valueText ? row.valueText : `<span>${row.value ? "开" : "关"}</span>`;
      } else if (row.kind === "slider") {
        const w = document.createElement("div");
        w.className = "slider-wrap";
        const tr = document.createElement("div");
        tr.className = "slider";
        const fill = document.createElement("div");
        fill.className = "slider-fill";
        const knob = document.createElement("div");
        knob.className = "slider-knob";
        const max = row.max || 100;
        const pct = Math.max(0, Math.min(100, (row.value/max)*100));
        fill.style.width = pct + "%"; knob.style.left = pct + "%";
        tr.appendChild(fill); tr.appendChild(knob);
        const calc = (e) => {
          const r = tr.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width));
          return Math.round(ratio * max);
        };
        let drag = false;
        const mv = (e) => { if (drag) setRowValue(row.id, calc(e)); };
        const up = () => { drag = false; window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); };
        tr.addEventListener("mousedown", (e) => {
          e.preventDefault(); drag = true; setRowValue(row.id, calc(e));
          window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
        });
        w.appendChild(tr);
        if (row.ticks) {
          const tk = document.createElement("div");
          tk.className = "slider-ticks";
          row.ticks.forEach(t => { const s = document.createElement("span"); s.textContent = t; tk.appendChild(s); });
          w.appendChild(tk);
        }
        ctrl.appendChild(w);
        val.innerHTML = `${row.value}<span> / ${max}</span>`;
      }
      node.appendChild(ctrl);
      node.appendChild(val);
      el.appendChild(node);

      // signature preview tile under the template row
      if (row.kind === "preview") {
        const tile = document.createElement("div");
        tile.className = "preview-tile";
        tile.innerHTML = `
          <h5>当前模板预览</h5>
          <div class="pv pv-default">默认 · 楷墨</div>
          <div class="pv pv-ink">水墨 · Ink</div>
          <div class="pv pv-scroll">古卷 · Scroll</div>`;
        el.appendChild(tile);
      }
    });

    const actions = document.createElement("div");
    actions.className = "action-row";
    const apply = document.createElement("button");
    apply.className = "action-btn primary"; apply.textContent = "保 存";
    apply.addEventListener("click", () => showToast("已保存 · 自动同步"));
    const reset = document.createElement("button");
    reset.className = "action-btn"; reset.textContent = "恢 复 默 认";
    reset.addEventListener("click", () => showToast("已恢复默认"));
    actions.appendChild(apply); actions.appendChild(reset);
    el.appendChild(actions);
  }

  function cycleCat(dir) {
    const cats = STATE.categories;
    const idx = cats.findIndex(c => c.id === STATE.activeId);
    setActive(cats[(idx + dir + cats.length) % cats.length].id);
  }

  document.addEventListener("keydown", (e) => {
    if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    if (e.key === "q" || e.key === "Q" || e.key === "e" || e.key === "E") return; // 让 nav-tabs.js 处理
    if (e.key === "Tab") { e.preventDefault(); cycleCat(e.shiftKey ? -1 : 1); }
    else if (e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); cycleCat(-1); }
    else if (e.key === "ArrowDown" || e.key === "s") { e.preventDefault(); cycleCat(1); }
    else if (e.key === "Enter") { e.preventDefault(); showToast("已保存 · 自动同步"); }
  });

  renderSidebar(); renderContent();
</script>
<script src="nav-tabs.js"></script>
</body>
</html>
