<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<title>一介 · 武学谱 · Skills</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="nav-tabs.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    width: 1280px; height: 720px; position: relative;
    color: var(--ink-black); font-family: var(--font-kai);
    --safe-x: 56px;
  }
  .stage {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 42vw 30vh at 49% 24%, rgba(255,255,255,.78), transparent 72%),
      radial-gradient(ellipse 50vw 38vh at 52% 58%, rgba(214,226,238,.42), transparent 78%),
      radial-gradient(ellipse 22vw 18vh at 9% 94%, rgba(115,132,145,.30), transparent 72%),
      radial-gradient(ellipse 24vw 20vh at 86% 92%, rgba(190,202,214,.24), transparent 74%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='p'><feTurbulence baseFrequency='0.018 0.055' numOctaves='4' seed='59'/><feColorMatrix values='0 0 0 0 0.60 0 0 0 0 0.66 0 0 0 0 0.72 0 0 0 0.16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
      linear-gradient(180deg, #F1F5FA 0%, #E7EEF6 46%, #DDE6EF 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' seed='23'/><feColorMatrix values='0 0 0 0 0.72 0 0 0 0 0.78 0 0 0 0 0.84 0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .body {
    position: absolute;
    top: 64px; left: 0; right: 0; bottom: 60px;
    z-index: 2;
    display: grid;
    grid-template-columns: 22% 46% 1fr;
  }

  /* === 左：流派 === */
  .schools { padding: 26px 18px 26px 28px; display: flex; flex-direction: column; gap: 12px; }
  .schools-head {
    font-family: var(--font-kai); font-size: 13px; letter-spacing: 0.36em;
    color: rgba(35,43,50,.6);
    margin-bottom: 6px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(15,20,24,.10);
  }
  .school {
    position: relative;
    padding: 14px 16px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.16);
    cursor: pointer; transition: all .16s ease;
  }
  .school::before {
    content: ""; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
    border: 1px dashed rgba(15,20,24,.10); pointer-events: none;
  }
  .school:hover { transform: translateX(3px); border-color: rgba(15,20,24,.5); }
  .school.active {
    background: var(--ink-black);
    color: rgba(248,251,255,.96);
    border-color: var(--ink-black);
    box-shadow: 0 8px 22px rgba(20,28,36,.32);
  }
  .school .sn-name {
    font-family: var(--font-kai); font-size: 22px; font-weight: 900;
    letter-spacing: 0.32em; color: inherit;
  }
  .school .sn-tag {
    font-family: var(--font-kai); font-size: 11px;
    letter-spacing: 0.28em; color: rgba(35,43,50,.6);
    margin-top: 4px;
  }
  .school.active .sn-tag { color: rgba(214,226,238,.55); }
  .school::after {
    content: "›"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 22px; color: rgba(35,43,50,.32); transition: all .16s ease;
  }
  .school.active::after { color: rgba(248,251,255,.85); transform: translateY(-50%) translateX(4px); }

  /* === 中：招式 === */
  .tree {
    padding: 26px 22px;
    border-left: 1px solid rgba(15,20,24,.14);
    border-right: 1px solid rgba(15,20,24,.14);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(248,251,255,.42) 0%, rgba(232,240,247,.16) 100%);
  }
  .tree-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(15,20,24,.10);
  }
  .tree-title { font-family: var(--font-kai); font-size: 22px; font-weight: 900; letter-spacing: 0.28em; color: var(--ink-black); }
  .tree-hint  { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em; color: rgba(35,43,50,.55); }

  .tree-body {
    flex: 1; position: relative;
    display: flex; flex-direction: column; gap: 16px;
    padding-top: 10px;
  }
  /* 中线 */
  .tree-body::before {
    content: ""; position: absolute;
    left: 32px; top: 18px; bottom: 6px;
    width: 1px;
    background: repeating-linear-gradient(180deg,
      rgba(15,20,24,.32) 0 6px,
      transparent 6px 12px);
  }
  .skill {
    position: relative;
    display: grid; grid-template-columns: 56px 1fr auto;
    gap: 14px; align-items: center;
    padding: 12px 14px 12px 16px;
    margin-left: 8px;
    background: rgba(248,251,255,.7);
    border: 1px solid rgba(15,20,24,.16);
    cursor: pointer; transition: all .16s ease;
  }
  .skill::before {
    content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 1px; background: rgba(15,20,24,.32);
  }
  .skill:hover { transform: translateX(3px); border-color: rgba(15,20,24,.5); }
  .skill.active {
    background: var(--ink-black);
    border-color: var(--ink-black);
    color: rgba(248,251,255,.96);
    box-shadow: 0 8px 22px rgba(20,28,36,.30);
  }
  .skill.active::before { background: var(--ink-black); height: 2px; }
  .rune {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 28px; font-weight: 900;
    color: rgba(248,251,255,.96);
    background: var(--ink-black);
    position: relative;
  }
  .rune::after {
    content: ""; position: absolute; inset: 3px;
    border: 1px solid rgba(248,251,255,.42); pointer-events: none;
  }
  .skill.active .rune {
    background: rgba(248,251,255,.96); color: var(--ink-black);
  }
  .skill.active .rune::after { border-color: rgba(20,28,36,.42); }
  .skill.locked .rune { background: rgba(35,43,50,.16); color: rgba(35,43,50,.42); }
  .skill.locked .rune::after { border-color: rgba(35,43,50,.20); }
  .skill-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .skill-name {
    font-family: var(--font-kai); font-size: 16px; font-weight: 700;
    letter-spacing: 0.20em; color: var(--ink-black);
  }
  .skill.active .skill-name { color: rgba(248,251,255,.96); }
  .skill.locked .skill-name { color: rgba(35,43,50,.46); }
  .skill-desc {
    font-family: var(--font-kai); font-size: 11px; line-height: 1.6;
    letter-spacing: 0.10em; color: rgba(35,43,50,.7);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .skill.active .skill-desc { color: rgba(214,226,238,.7); }
  .skill-cost {
    font-family: var(--font-kai); font-size: 11px;
    letter-spacing: 0.20em;
    padding: 4px 8px;
    border: 1px solid rgba(15,20,24,.32);
    color: rgba(20,24,26,.84);
    white-space: nowrap;
  }
  .skill.active .skill-cost { border-color: rgba(248,251,255,.55); color: rgba(248,251,255,.96); }

  /* === 右：详注 === */
  .detail {
    padding: 26px 28px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(15,20,24,.18) transparent;
  }
  .d-head {
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(15,20,24,.14);
    position: relative;
  }
  .d-title {
    font-family: var(--font-kai); font-size: 28px; font-weight: 900;
    letter-spacing: 0.20em; color: var(--ink-black);
  }
  .d-tag {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.42em; color: rgba(35,43,50,.6);
    margin-top: 6px;
  }
  .d-stamp {
    position: absolute; top: 0; right: 0;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 18px; font-weight: 900;
    color: rgba(248,251,255,.96);
    background: var(--ink-black);
    transform: rotate(-3deg);
  }
  .d-section { margin-bottom: 16px; }
  .d-section h4 {
    font-family: var(--font-kai); font-size: 12px; font-weight: 900;
    letter-spacing: 0.42em; color: rgba(35,43,50,.6);
    margin-bottom: 8px;
    border-left: 2px solid var(--ink-black);
    padding-left: 8px;
  }
  .d-section p {
    font-family: var(--font-kai); font-size: 13px; line-height: 1.85;
    letter-spacing: 0.08em; color: rgba(20,24,26,.86);
    text-wrap: pretty;
  }
  .d-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(248,251,255,.62);
    border: 1px solid rgba(15,20,24,.10);
    font-family: var(--font-kai); font-size: 12px;
  }
  .stat-name { color: rgba(35,43,50,.6); letter-spacing: 0.20em; }
  .stat-val  { color: var(--ink-black); font-weight: 900; letter-spacing: 0.10em; }

  /* === footer === */
  .footer-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: 60px; padding: 0 var(--safe-x);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(0deg, rgba(232,240,247,.8) 0%, rgba(248,251,255,0) 100%);
    border-top: 1px solid rgba(15,20,24,.10);
  }
  .footer-meta {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em;
    color: rgba(35,43,50,.55);
  }
  .footer-meta .label-cn {
    font-family: var(--font-kai); font-size: 14px; font-weight: 900;
    letter-spacing: 0.32em; color: var(--ink-black);
    margin-right: 10px;
  }
  .prompts { display: flex; align-items: center; gap: 18px; }
  .prompt {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-kai); font-size: 12px; letter-spacing: 0.22em;
    color: rgba(20,24,26,.86);
  }
  .km {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 8px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--ink-black);
    background: rgba(248,251,255,.95);
    border: 1.2px solid rgba(15,20,24,.55);
    border-radius: 11px;
  }
  .km.cross { color: rgba(248,251,255,.96); background: var(--ink-black); border-color: var(--ink-black); }

  .toast {
    position: absolute; left: 50%; top: 84px;
    transform: translateX(-50%) translateY(-12px);
    padding: 10px 18px;
    background: var(--ink-black); color: rgba(248,251,255,.96);
    font-family: var(--font-kai); font-size: 13px; letter-spacing: 0.28em;
    z-index: 9; opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main class="stage">
  <div class="grain"></div>

  <nav class="nav-tabs" data-current="skills" aria-label="界面切换">
    <span class="tk-key l">L1</span>
    <div class="tabs-row">
      <a class="tab-link" data-screen="map">地图</a>
      <a class="tab-link" data-screen="journal">日志</a>
      <a class="tab-link" data-screen="inventory">行囊</a>
      <a class="tab-link" data-screen="skills">武学</a>
      <a class="tab-link" data-screen="codex">收藏</a>
      <a class="tab-link" data-screen="settings">設定</a>
    </div>
    <span class="tk-key r">R1</span>
    <div class="nav-right">
      <span class="chap-num">壹</span>
      <span class="meta-coin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <rect x="9.5" y="9.5" width="5" height="5"></rect>
        </svg>
        596
      </span>
    </div>
  </nav>

  <div class="body">
    <aside class="schools">
      <div class="schools-head">流 派 · 四 脉</div>
      <div class="school-list"></div>
    </aside>
    <section class="tree">
      <div class="tree-head">
        <div class="tree-title"></div>
        <div class="tree-hint"></div>
      </div>
      <div class="tree-body"></div>
    </section>
    <section class="detail"></section>
  </div>

  <footer class="footer-bar">
    <div class="footer-meta"><span class="label-cn">武 学 谱</span>四脉八式 · 待修</div>
    <div class="prompts">
      <span class="prompt"><span class="km">L1·R1</span>切换界面</span>
      <span class="prompt"><span class="km">↑↓</span>选式</span>
      <span class="prompt"><span class="km">←→</span>切派</span>
      <span class="prompt"><span class="km cross">✕</span>修习</span>
    </div>
  </footer>

  <div class="toast" aria-live="polite"></div>
</main>

<script>
const STATE = {
  activeSchoolId: "han_blade",
  activeSkillId: "han_basic",
  schools: [
    { id: "han_blade", name: "汉刀", tag: "环首 · 直刃" },
    { id: "qing_kung", name: "轻功", tag: "踏雪 · 拔身" },
    { id: "iron_qi",   name: "铁气", tag: "御身 · 拒伤" },
    { id: "wind_song", name: "风咏", tag: "感风 · 御风" }
  ],
  trees: {
    han_blade: { title:"汉刀 · 招式", hint:"三式 · 已学 二", skills: [
      { id:"han_basic",  rune:"挥", name:"挥砍 · 基", cost:"〇 气", desc:"环首直刃，自上而下，朴而有力。" },
      { id:"han_storm",  rune:"乱", name:"乱风斩",   cost:"二 气", desc:"低位横扫，破盾，可清扫两人。" },
      { id:"han_pierce", rune:"刺", name:"穿心刺",   cost:"三 气", desc:"前冲突刺，命中收尾时附带流血。", locked:true }
    ]},
    qing_kung: { title:"轻功 · 行身", hint:"二式 · 全数已学", skills: [
      { id:"qk_step", rune:"踏", name:"踏雪步", cost:"一 气", desc:"短距瞬移，可越过陷阱。" },
      { id:"qk_pull", rune:"拔", name:"拔身术", cost:"二 气", desc:"高跳出墙，落地无损耗。" }
    ]},
    iron_qi: { title:"铁气 · 御身", hint:"二式 · 全数已学", skills: [
      { id:"iq_skin", rune:"御", name:"铁皮诀", cost:"一 气", desc:"短时间内大幅减伤。" },
      { id:"iq_root", rune:"根", name:"扎根法", cost:"〇 气", desc:"格挡时不被击退，但移动减半。" }
    ]},
    wind_song: { title:"风咏 · 感应", hint:"一式 · 待解", skills: [
      { id:"ws_listen", rune:"聆", name:"聆风诀", cost:"〇 气", desc:"短暂显示半径内敌人位置与朝向。", locked:true }
    ]}
  },
  detail: {
    han_basic: { title:"挥砍 · 基", tag:"汉刀 · 入门", stamp:"修",
      sections:[
        { h:"招式诀", p:"起手沉肩，刀下随气走。势出即收，不留余势。" },
        { h:"搭配",   p:"与「拔身术」连接形成腾空斩。可承「乱风斩」收尾。" }],
      stats:[{n:"伤害",v:"38"},{n:"耗气",v:"0"},{n:"出招",v:"0.32 s"},{n:"硬直",v:"0.20 s"}]
    },
    han_storm: { title:"乱风斩", tag:"汉刀 · 中阶", stamp:"修",
      sections:[{ h:"招式诀", p:"弯腰沉胯，腰带刀走，扫开两面。" }],
      stats:[{n:"伤害",v:"60×2"},{n:"耗气",v:"2"},{n:"出招",v:"0.48 s"},{n:"硬直",v:"0.32 s"}]
    },
    han_pierce: { title:"穿心刺", tag:"汉刀 · 待解", stamp:"封",
      sections:[{ h:"招式诀", p:"突进直刺，留待解锁。" }],
      stats:[{n:"伤害",v:"95"},{n:"耗气",v:"3"},{n:"出招",v:"0.55 s"},{n:"硬直",v:"0.40 s"}]
    },
    qk_step: { title:"踏雪步", tag:"轻功", stamp:"修",
      sections:[{h:"招式诀",p:"短距瞬移，越过陷阱。"}],
      stats:[{n:"距离",v:"4 m"},{n:"耗气",v:"1"},{n:"冷却",v:"2 s"}]
    },
    qk_pull: { title:"拔身术", tag:"轻功", stamp:"修",
      sections:[{h:"招式诀",p:"高跳越墙，落地无损耗。"}],
      stats:[{n:"高度",v:"3 m"},{n:"耗气",v:"2"}]
    },
    iq_skin: { title:"铁皮诀", tag:"铁气", stamp:"修",
      sections:[{h:"招式诀",p:"短时间大幅减伤。"}],
      stats:[{n:"减伤",v:"60%"},{n:"持续",v:"4 s"},{n:"耗气",v:"1"}]
    },
    iq_root: { title:"扎根法", tag:"铁气", stamp:"修",
      sections:[{h:"招式诀",p:"格挡不被击退，但移动减半。"}],
      stats:[{n:"位移抗性",v:"100%"},{n:"移动",v:"-50%"}]
    },
    ws_listen: { title:"聆风诀", tag:"风咏 · 待解", stamp:"封",
      sections:[{h:"招式诀",p:"显示半径内敌人位置。"}],
      stats:[{n:"半径",v:"12 m"},{n:"持续",v:"3 s"}]
    }
  }
};

function showToast(msg) {
  const t = document.querySelector(".toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1600);
}

function renderSchools() {
  const wrap = document.querySelector(".school-list");
  wrap.innerHTML = "";
  STATE.schools.forEach(s => {
    const node = document.createElement("div");
    node.className = "school" + (s.id === STATE.activeSchoolId ? " active" : "");
    node.innerHTML = `<div class="sn-name">${s.name}</div><div class="sn-tag">${s.tag}</div>`;
    node.addEventListener("click", () => setSchool(s.id));
    wrap.appendChild(node);
  });
}
function renderTree() {
  const tree = STATE.trees[STATE.activeSchoolId];
  document.querySelector(".tree-title").textContent = tree.title;
  document.querySelector(".tree-hint").textContent = tree.hint;
  const body = document.querySelector(".tree-body");
  body.innerHTML = "";
  tree.skills.forEach(sk => {
    const node = document.createElement("div");
    let cls = "skill";
    if (sk.id === STATE.activeSkillId) cls += " active";
    if (sk.locked) cls += " locked";
    node.className = cls;
    node.innerHTML = `
      <div class="rune">${sk.rune}</div>
      <div class="skill-meta">
        <div class="skill-name">${sk.name}</div>
        <div class="skill-desc">${sk.desc}</div>
      </div>
      <div class="skill-cost">${sk.cost}</div>`;
    node.addEventListener("click", () => setSkill(sk.id));
    body.appendChild(node);
  });
}
function renderDetail() {
  const d = STATE.detail[STATE.activeSkillId];
  if (!d) return;
  const wrap = document.querySelector(".detail");
  wrap.innerHTML = `
    <div class="d-head">
      <div class="d-title">${d.title}</div>
      <div class="d-tag">${d.tag}</div>
      <div class="d-stamp">${d.stamp || "修"}</div>
    </div>
    ${d.sections.map(s => `<div class="d-section"><h4>${s.h}</h4><p>${s.p}</p></div>`).join("")}
    <div class="d-section">
      <h4>诸 数</h4>
      <div class="d-stats">
        ${d.stats.map(s => `<div class="stat-row"><span class="stat-name">${s.n}</span><span class="stat-val">${s.v}</span></div>`).join("")}
      </div>
    </div>`;
}

function setSchool(id) {
  STATE.activeSchoolId = id;
  // 切派后默认选当前流派第一招
  const first = STATE.trees[id].skills[0];
  if (first) STATE.activeSkillId = first.id;
  renderSchools(); renderTree(); renderDetail();
}
function setSkill(id) {
  STATE.activeSkillId = id;
  renderTree(); renderDetail();
}
function cycleSchool(d) {
  const i = STATE.schools.findIndex(s => s.id === STATE.activeSchoolId);
  setSchool(STATE.schools[(i + d + STATE.schools.length) % STATE.schools.length].id);
}
function cycleSkill(d) {
  const list = STATE.trees[STATE.activeSchoolId].skills;
  const i = list.findIndex(s => s.id === STATE.activeSkillId);
  setSkill(list[(i + d + list.length) % list.length].id);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "q" || e.key === "Q" || e.key === "e" || e.key === "E") return;
  if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") { e.preventDefault(); cycleSkill(-1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); cycleSkill(1); }
  else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); cycleSchool(-1); }
  else if (e.key === "ArrowRight"|| e.key === "d" || e.key === "D") { e.preventDefault(); cycleSchool(1); }
  else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    const sk = STATE.trees[STATE.activeSchoolId].skills.find(s => s.id === STATE.activeSkillId);
    if (sk) showToast(sk.locked ? "尚未解锁" : `修习：${sk.name}`);
  }
});

renderSchools(); renderTree(); renderDetail();
</script>
<script src="nav-tabs.js"></script>
